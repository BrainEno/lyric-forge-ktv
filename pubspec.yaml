name: lyric_forge_ktv
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # File picker for importing audio files.
  # 10.3.8+ renames the native iOS FileUtils class to FilePickerUtils, avoiding
  # an Objective-C runtime collision with iOS 26 OSAnalytics.framework that can
  # crash the app at launch before Flutter renders its first frame.
  # Pin 10.3.10 because it includes that fix while reverting accidental breaking
  # changes that briefly shipped in 10.3.9.
  file_picker: 10.3.10

  # Path provider for accessing application directories.
  path_provider: ^2.1.2

  # Unicode/legacy text decoding for imported lyrics (UTF-16, GBK, Shift-JIS,
  # EUC-JP, Windows code pages). Pure Dart and cross-platform.
  charset: ^2.0.1

  # Pure-Dart reader for embedded ID3/Vorbis/MP4/RIFF tags and cover art.
  audio_metadata_reader: ^1.8.0

  # Audio playback. Android/iOS/macOS keep just_audio's native backends. Windows
  # and Linux use libmpv/FFmpeg through just_audio_media_kit so unusual MP3/VBR
  # encodings do not depend on the host OS codec stack.
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # UUID generation.
  uuid: ^4.5.1

  # QR pairing for desktop-to-mobile Media Hub connections.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

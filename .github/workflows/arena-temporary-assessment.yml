name: Temporary candidate assessment checks
on:
  push:
    branches: [arena/f690cad4-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format check
        run: git diff --name-only 2f3bfb365439c0224bde419c2c274613df537ea8 HEAD -- '*.dart' | xargs -r dart format --output=none --set-exit-if-changed
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:59' --slug assess-asr-candidates --title 'Assess saved ASR candidate freshness'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2359-assess-asr-candidates.md')
          print(p.read_text())
          p.write_text('''# [2026-11-07 23:59] Assess saved ASR candidate freshness

          - Scope: Report whether a saved rerun candidate still matches current lyrics and selected audio without applying or changing either version.
          - Files: Candidate assessor, candidate-store baseline comparison, focused tests, product follow-up, handoff, index, entry and generated work-log navigation.
          - Validation:
            - Pinned Flutter Actions run 42655844804: format after dependency resolution, candidate assessment/store/rerun tests, and flutter analyze --no-pub --no-fatal-infos lib test tool passed.
            - Temporary Actions work-log run: formatting and work-log write/check; final PR gate reported separately. Local Flutter/Dart unavailable.
          - Notes: Assessment is point-in-time, not authorization to overwrite lyrics. Model contents and settings remain unverified; audio checks are not locks and repository CAS is not cross-process. No UI or production caller, no safe apply or deletion, and no real engine or song evaluation.
          - Commit: `Assess saved ASR candidate freshness`
          '''.replace('\n          ', '\n'))
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return documentation patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2359-assess-asr-candidates.md
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          PY

name: Temporary Dart formatter diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - '**.dart'
      - '.github/workflows/temp-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Reproduce the quality-gate format check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$TARGET_SHA" -- '*.dart')
          printf 'Files: %s\n' "${dart_files[*]}"
          set +e
          output=$(dart format --output=none --set-exit-if-changed "${dart_files[@]}" 2>&1)
          result=$?
          set -e
          if (( result == 0 )); then
            echo '::notice::Exact combined formatter check passes.'
          else
            echo "::error::Exact combined formatter rc=${result}: ${output//$'\n'/ }"
          fi

name: Temporary ASR confidence worklog
on:
  push:
    branches: [arena/67b864b7-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-07 23:10" --slug protect-split-asr-confidence --title "Protect split ASR confidence evidence"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2310-protect-split-asr-confidence.md')
          s = p.read_text()
          s = s.replace('TODO — describe the task purpose.', 'Keep split secondary-ASR evidence in review when any scored segment is low, and explain confidence rather than claiming text disagreement.')
          s = s.replace('TODO — list changed files.', 'Consensus analyzer, ASR-first pipeline, targeted tests, ASR review, handoff, index, this entry and generated work-log navigation.')
          s = s.replace('  - dart format ... => TODO', '  - Pinned Flutter Actions run 42626819397: dart format on changed Dart files after flutter pub get passed.')
          s = s.replace('  - flutter analyze ... => TODO', '  - Pinned Flutter Actions run 42626819397: flutter analyze --no-pub --no-fatal-infos lib test tool passed.')
          s = s.replace('  - flutter test ... => TODO', '  - Pinned Flutter Actions run 42626819397: flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading passed. Local Flutter/Dart unavailable; final PR checks reported separately.')
          s = s.replace('TODO — record risks and unverified behavior.', 'Scored segments are checked individually at the existing threshold; unscored placeholders are ignored and the aggregate mean remains unchanged. Nearby unrelated segments may conservatively trigger review; repetition analysis still uses the mean and its own threshold. No real-song benchmark or manual UI/device verification.')
          s = s.replace('TODO: replace with the actual English imperative subject', 'Protect low confidence split ASR evidence')
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return generated patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2310-protect-split-asr-confidence.md || true
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 60000): print(f'::notice::PATCH{i//60000:03d}:{data[i:i+60000]}')
          PY

name: Temporary candidate persistence checks
on:
  push:
    branches: [arena/98f90783-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format check
        run: git diff --name-only 0374b32dc614bafee72e045b6fd00fcb7d60aeb8 HEAD -- '*.dart' | xargs -r dart format --output=none --set-exit-if-changed
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:55' --slug persist-asr-candidates --title 'Persist independent ASR candidates'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2355-persist-asr-candidates.md')
          print(p.read_text())
          p.write_text('''# [2026-11-07 23:55] Persist independent ASR candidates

          - Scope: Persist both the human-edited baseline and a separate rerun candidate without replacing the active lyrics.
          - Files: Candidate store and focused tests, product follow-up, handoff, index, entry and generated work-log navigation.
          - Validation:
            - Pinned Flutter Actions run 42651644755: format after dependency resolution, candidate persistence/isolated rerun/file project repository tests, and flutter analyze --no-pub --no-fatal-infos lib test tool passed.
            - Temporary Actions work-log run: formatting and work-log write/check; final PR gate reported separately. Local Flutter/Dart unavailable.
          - Notes: No UI or production caller; versions are bounded to five pairs and 512 KiB per pair, with no automatic eviction or deletion interface yet. Saving updates project revision; source checks are not locks, model contents are unverified and CAS is not cross-process. Repository persistence failure may leave its in-memory state changed. No real engine or song evaluation.
          - Commit: `Persist independent ASR candidates`
          '''.replace('\n          ', '\n'))
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return documentation patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2355-persist-asr-candidates.md
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          PY

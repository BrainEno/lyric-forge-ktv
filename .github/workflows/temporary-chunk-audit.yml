name: Temporary chunk audit validation
on:
  push:
    branches: [arena/a018021f-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM 6781e3e19108516da55480cc82b4dbebfdc00c0d HEAD -- '*.dart')
          dart format "${files[@]}"
          git diff --binary -- "${files[@]}" | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=FORMAT%04d::%s\n", NR, $0}'
      - name: Analyze and targeted tests
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analysis.log 2>&1
          a=$?
          flutter test --no-pub --reporter expanded test/features/transcription/chunk_asr_audio_verifier_test.dart test/features/transcription/chunk_project_evidence_loader_test.dart test/features/transcription/project_proofread_evidence_loader_test.dart test/features/transcription/asr_evidence_audio_verifier_test.dart test/features/lyrics/presentation/widgets/project_chunk_asr_snapshot_dialog_test.dart test/features/lyrics/presentation/widgets/project_asr_snapshot_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart > /tmp/tests.log 2>&1
          t=$?
          printf '\nANALYZE_EXIT=%s TEST_EXIT=%s\n' "$a" "$t" >> /tmp/tests.log
          cat /tmp/analysis.log >> /tmp/tests.log
          gzip -c /tmp/tests.log | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=TESTLOG%04d::%s\n", NR, $0}'
          test "$a" = 0 && test "$t" = 0
      - name: Generate work log
        shell: bash
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 22:49' --slug review-verified-asr-chunks --title 'Review verified ASR chunk snapshots'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2249-review-verified-asr-chunks.md')
          p.write_text('''# [2026-11-07 22:49] Review verified ASR chunk snapshots

          - Scope: Allow explicit, read-only inspection of validated independent ASR chunk pairs without treating them as current-draft consensus or changing lyrics.
          - Files: Project proofread evidence model, audio verifier and loader, editor and snapshot dialogs, data and widget tests, handoff and work-log navigation.
          - Validation:
            - dart format changed Dart files in Actions 43192529594 => formatted; patch applied locally.
            - flutter analyze --no-fatal-infos in Actions 43192529594 => no errors or warnings; info diagnostics remain.
            - Focused verifier, loader, snapshot dialog and editor tests in Actions 43192529594 => 126 passed.
          - Notes: Source SHA, selection and revision checks are point-in-time, not locks. Chunk overlap is not deduplicated, line indices are local, and no result is applied. Real recordings and native accessibility remain unverified; #319 stays open.
          - Commit: `Document chunk snapshot review`
          ''')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2249-review-verified-asr-chunks.md
          git diff --binary -- docs/work_log.md docs/work_log_index.md docs/work_log_archive.md docs/log/entries/2026-11-07-2249-review-verified-asr-chunks.md | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=DOCS%04d::%s\n", NR, $0}'

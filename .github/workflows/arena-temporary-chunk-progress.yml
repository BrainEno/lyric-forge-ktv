name: Temporary chunk progress checks
on:
  push:
    branches: [arena/b6d630ec-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format check
        run: git diff --name-only e6fb9afc1f73b7262059635b5b82cc4215829442 HEAD -- '*.dart' | xargs -r dart format --output=none --set-exit-if-changed
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:57' --slug chunk-transcription-terminal-events --title 'Fix chunk transcription terminal events'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2357-chunk-transcription-terminal-events.md')
          print(p.read_text())
          p.write_text('''# [2026-11-07 23:57] Fix chunk transcription terminal events

          - Scope: Prevent individual ASR attempts from reporting a final whole-task outcome and honor cancellation while chunk results are merged.
          - Files: Resumable chunk transcription service and focused tests, product follow-up, handoff, index, entry and generated work-log navigation.
          - Validation:
            - Pinned Flutter Actions run 42749328039: format after dependency resolution, chunk/high-quality/project-cancellation/typed-cancellation tests, and flutter analyze --no-pub --no-fatal-infos lib test tool passed.
            - Temporary Actions work-log run: format check and work-log write/check; final PR gate reported separately. Local Flutter/Dart unavailable.
          - Notes: A checkpoint already being committed is completed and cleaned before cancellation is honored; JSON and manifest are not a cross-file transaction. A canceled merge may leave a generated file but never returns success. Device and real-song verification remain open; no recognition accuracy gain is claimed.
          - Commit: `Fix chunk transcription terminal events`
          '''.replace('\n          ', '\n'))
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return documentation patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2357-chunk-transcription-terminal-events.md
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          PY

name: Temporary Phase 4.4 final validation

on:
  push:
    branches:
      - arena/746aa31e-lyric-forge-ktv

permissions:
  contents: write

env:
  VALIDATION_RUN_ID: ${{ github.run_id }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t dart_files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} )); then
            mkdir -p build
            set +e
            dart format "${dart_files[@]}" > build/phase44-format.log 2>&1
            status=$?
            set -e
            if (( status != 0 )); then
              cat build/phase44-format.log > docs/phase44-ci-failure.txt
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add docs/phase44-ci-failure.txt
              git commit -m 'chore: capture Phase 4.4 formatter diagnostics'
              git push origin "HEAD:${GITHUB_REF_NAME}"
              exit "$status"
            fi
          fi
      - name: Run complete quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/phase44-quality.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            tail -200 build/phase44-quality.log > docs/phase44-ci-failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/phase44-ci-failure.txt
            git commit -m 'chore: capture Phase 4.4 CI diagnostics'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$status"
          fi
      - name: Record completed validation
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          dart tool/work_log.dart new --timestamp "$stamp" --slug phase44-state-management-final --title "Finalize scoped editor and playback state"
          python3 - "$stamp" "$VALIDATION_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id = sys.argv[1:]
          matches = list(Path('docs/log/entries').glob('*-phase44-state-management-final.md'))
          if not matches:
              raise SystemExit('work-log entry was not created')
          path = max(matches, key=lambda item: item.name)
          path.write_text(textwrap.dedent(f'''\
          # [{stamp}] Finalize scoped editor and playback state

          - Scope: Complete Phase 4.4's minimal state-management slice. The editor document controller now publishes completed changes through a local Provider/Selector scope; the desktop player reuses its existing session snapshot in queue/mode controls without creating another service or stream subscription.
          - Files: `pubspec.yaml`, `pubspec.lock`, `lib/features/lyrics/presentation/controllers/lyric_editor_document_controller.dart`, `lib/features/lyrics/presentation/screens/lyric_editor_screen.dart`, `lib/features/player/presentation/widgets/global_player_bar.dart`, `lib/features/player/presentation/widgets/playback_mode_controls.dart`, `lib/features/player/presentation/widgets/playback_queue_panel.dart`, `test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart`, `test/features/player/presentation/widgets/playback_queue_panel_state_test.dart`, `docs/decisions.md`, `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`, `docs/handoff.md`, `docs/work_log_index.md`, and generated work-log navigation files.
          - Validation:
            - `flutter pub get --enforce-lockfile` => passed.
            - `dart format` on changed Dart files => passed.
            - `bash scripts/quality_gate.sh --skip-pub-get` => passed (analyzer, full test suite, and work-log preflight; CI run {run_id}).
            - `dart tool/work_log.dart write` and `dart tool/work_log.dart check` => passed.
            - No real-song accuracy or physical-device playback result is claimed.
          - Notes: Project loading initializes controller state before the Provider/Selector subtree is built, avoiding notifications during build. The mobile bar and audio playback state continue to use their existing streams; playback/session services remain the only source of truth. Recognition, lyric-fusion, and editing semantics are unchanged. The earlier 20:58 entry records the first implementation pass; this entry describes the final pre-PR shape after narrowing the player-bar integration.
          - Commit: `feat: observe editor state and reuse playback snapshots`
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Remove temporary workflow and push final tree
        run: |
          rm .github/workflows/temporary-phase44-final-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record final Phase 4.4 state validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Temporary Dart format report

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  format-report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run exact quality-gate format diagnostic
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "GITHUB_SHA=$GITHUB_SHA"
            echo "CHECKOUT=$(git rev-parse HEAD)"
            echo "CHANGED DART FILES (exact format-gate filter):"
          } > formatter-report.txt
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          printf '%s\n' "${dart_files[@]}" >> formatter-report.txt
          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files." >> formatter-report.txt
            exit 0
          fi
          echo "FORMAT CHECK OUTPUT:" >> formatter-report.txt
          set +e
          dart format --output=none --set-exit-if-changed "${dart_files[@]}" >> formatter-report.txt 2>&1
          check_status=$?
          set -e
          echo "FORMAT_CHECK_EXIT=$check_status" >> formatter-report.txt
          echo "FORMATTER DIFF:" >> formatter-report.txt
          dart format "${dart_files[@]}" >> formatter-report.txt 2>&1
          git --no-pager diff -- "${dart_files[@]}" >> formatter-report.txt

      - name: Publish temporary formatter diagnostic to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('formatter-report.txt', 'utf8');
            const body = [
              '<!-- temporary-dart-format-report -->',
              'Temporary formatter diagnostic; this comment will be removed after investigation.',
              '```text',
              report.slice(0, 58000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

name: Temporary Phase 4.5 validation

on:
  push:
    branches:
      - arena/e0abd96c-lyric-forge-ktv

permissions:
  contents: write

env:
  VALIDATION_RUN_ID: ${{ github.run_id }}
  VALIDATION_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t dart_files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} )); then
            dart format "${dart_files[@]}"
          fi
      - name: Test CI workflow contract
        run: flutter test test/ci_workflow_contract_test.dart
      - name: Prepare Phase 4.5 work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          dart tool/work_log.dart new --timestamp "$stamp" --slug phase45-retire-redundant-asr-check --title "Retire redundant ASR client workflow"
          python3 - "$stamp" "$VALIDATION_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id = sys.argv[1:]
          matches = list(Path('docs/log/entries').glob('*-phase45-retire-redundant-asr-check.md'))
          if not matches:
              raise SystemExit('work-log entry was not created')
          path = max(matches, key=lambda item: item.name)
          path.write_text(textwrap.dedent(f'''\
          # [{stamp}] Retire redundant ASR client workflow

          - Scope: Start Phase 4.5 with one independently verifiable CI simplification. Remove the ASR client-only analyzer and single-test workflow because the universal Flutter Quality Gate runs repository-wide analysis and the complete Flutter test suite for every PR to main.
          - Files: `.github/workflows/asr-client-checks.yml` (removed), `test/ci_workflow_contract_test.dart`, `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`, `docs/work_log_index.md`, `docs/handoff.md`, and generated work-log navigation files.
          - Validation:
            - `dart format` on changed Dart files => passed.
            - `flutter test test/ci_workflow_contract_test.dart` => passed.
            - `bash scripts/quality_gate.sh --skip-pub-get` => passed (analyze, full test suite, work-log preflight; CI run {run_id}).
            - `dart tool/work_log.dart write` and `dart tool/work_log.dart check` => passed.
          - Notes: No production code, runtime behavior, ASR algorithm, or lyric semantics changed. KTV, native-platform, runtime-release, and icon workflows remain untouched; this slice does not authorize deleting other specialist checks without an equivalent coverage audit.
          - Commit: `ci: retire duplicate ASR client workflow`
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Run complete quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/phase45-quality.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            tail -80 build/phase45-quality.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit "$status"
          fi
      - name: Finalize handoff and verify work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          python3 - "$stamp" "$VALIDATION_RUN_ID" "$VALIDATION_SHA" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id, sha = sys.argv[1:]
          handoff = Path('docs/handoff.md')
          handoff.write_text(textwrap.dedent(f'''\
          # Handoff

          ## 目标

          Phase 4.5 第一切片已完成：移除冗余的 ASR client-only analyzer/test workflow；全局 Flutter Quality Gate 对每个 main PR 执行全仓分析与全量测试。其他专项 workflow 保留，待逐个审查覆盖后再决定。

          ## Git 现场

          - Repository: `BrainEno/lyric-forge-ktv`
          - 活动分支：`arena/e0abd96c-lyric-forge-ktv`（active）。
          - 基线：`100a472`；经 CI 验证的实现提交：`{sha}`。
          - 工作区由验证 workflow 收尾并清除临时 workflow；PR 尚未创建。

          ## 已改文件

          - `.github/workflows/asr-client-checks.yml`：删除重复 ASR client-only analyzer/test。
          - `test/ci_workflow_contract_test.dart`：锁定全局门禁对所有 main PR 生效、运行 full analyze/test 并取代该窄门禁。
          - `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`、`docs/work_log_index.md`、本文件及 Phase 4.5 work-log entry。

          ## 检查结果

          - `dart format`、`flutter test test/ci_workflow_contract_test.dart`、完整 `bash scripts/quality_gate.sh --skip-pub-get` 均通过（CI run `{run_id}`）。
          - work-log `write/check` 将在本收尾步骤验证。
          - 未改生产 Dart 行为、ASR 算法、歌词语义或其他专项 workflow。

          ## 下一步

          1. 创建 PR 并确认通用质量门禁通过；之后再选一个独立专项 workflow cluster 做覆盖审计，不批量删除其余验证。

          ## 已知风险

          - 本地没有 Flutter/Dart SDK；格式、测试和完整质量门禁均依赖固定 CI 工具链。
          - 目前仅证明 ASR client 专项分析与单测由全量门禁覆盖；KTV recovery、macOS/Windows、runtime 发布等路径仍需各自专项验证。
          - 本次不涉及真实歌曲或设备验证。

          最后更新：{stamp}（Asia/Taipei）
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Remove temporary workflow and push validated tree
        run: |
          rm .github/workflows/temporary-phase45-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Phase 4.5 validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: ASR end-to-end smoke validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/core/services/service_locator.dart'
      - 'lib/features/settings/presentation/screens/settings_screen.dart'
      - 'lib/features/settings/presentation/widgets/asr_end_to_end_smoke_test_card.dart'
      - 'lib/features/transcription/data/services/local_asr_end_to_end_smoke_test_service.dart'
      - 'lib/features/transcription/domain/services/asr_end_to_end_smoke_test_service.dart'
      - 'test/features/transcription/asr_end_to_end_smoke_test_service_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/asr-end-to-end-smoke-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Analyze smoke path
        run: >-
          flutter analyze
          lib/core/services/service_locator.dart
          lib/features/settings/presentation/screens/settings_screen.dart
          lib/features/settings/presentation/widgets/asr_end_to_end_smoke_test_card.dart
          lib/features/transcription/data/services/local_asr_end_to_end_smoke_test_service.dart
          lib/features/transcription/domain/services/asr_end_to_end_smoke_test_service.dart
          test/features/transcription/asr_end_to_end_smoke_test_service_test.dart
      - name: Test smoke orchestration
        run: flutter test test/features/transcription/asr_end_to_end_smoke_test_service_test.dart

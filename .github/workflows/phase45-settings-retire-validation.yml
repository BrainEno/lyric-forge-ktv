name: Temporary Phase 4.5 settings workflow validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/transcription-settings-validation.yml'
      - '.github/workflows/phase45-settings-retire-validation.yml'
      - 'test/ci_workflow_contract_test.dart'
      - 'docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md'
      - 'docs/work_log_index.md'
      - 'docs/handoff.md'
      - 'docs/log/entries/**'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Apply pinned Dart formatter
        run: dart format test/ci_workflow_contract_test.dart
      - name: Run CI workflow contract test
        run: flutter test test/ci_workflow_contract_test.dart
      - name: Run complete repository quality gate
        run: bash scripts/quality_gate.sh --skip-pub-get
      - name: Generate and validate work-log files
        env:
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-04 15:55" --slug phase45-retire-transcription-settings --title "Retire redundant transcription settings workflow"
          python3 - <<'PY'
          import os
          from pathlib import Path

          entry = Path('docs/log/entries/2026-11-04-1555-phase45-retire-transcription-settings.md')
          text = entry.read_text()
          replacements = {
              '- Scope: TODO — describe the task purpose.': '- Scope: Retire the transcription-settings focused workflow because its targeted analyzer command and settings contract test are covered by the universal Flutter Quality Gate on every main pull request.',
              '- Files: TODO — list changed files.': '- Files: `.github/workflows/transcription-settings-validation.yml` (removed), `test/ci_workflow_contract_test.dart`, `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`, `docs/work_log_index.md`, `docs/handoff.md`, and generated work-log navigation files.',
              '  - dart format ... => TODO': '  - `dart format test/ci_workflow_contract_test.dart` => passed in the pinned-toolchain validation run.',
              '  - flutter analyze ... => TODO': '  - `flutter analyze --no-pub --no-fatal-infos lib test` => passed via `bash scripts/quality_gate.sh --skip-pub-get` in pinned-toolchain validation run ' + os.environ['VALIDATION_RUN'] + '.',
              '  - flutter test ... => TODO': '  - `flutter test test/ci_workflow_contract_test.dart` and complete `flutter test --no-pub --reporter expanded` => passed in pinned-toolchain validation run ' + os.environ['VALIDATION_RUN'] + '.',
              '- Notes: TODO — record risks and unverified behavior.': '- Notes: No runtime code or settings/transcription behavior changed. Local Flutter/Dart SDK is unavailable; validation uses the repository-pinned CI toolchain. Native, KTV recovery, runtime-release, and icon workflows remain out of scope.',
              '- Commit: `TODO: replace with the actual English imperative subject`': '- Commit: `ci: retire redundant transcription settings workflow`',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing work-log template field: {old}')
              text = text.replace(old, new, 1)
          entry.write_text(text)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish generated files for retrieval
        shell: bash
        run: |
          for file in \
            test/ci_workflow_contract_test.dart \
            docs/log/entries/2026-11-04-1555-phase45-retire-transcription-settings.md \
            docs/work_log.md; do
            payload_file="$RUNNER_TEMP/payload"
            base64 -w0 "$file" > "$payload_file"
            prefix="$RUNNER_TEMP/chunk-${file##*/}."
            split -b 3500 -d -a 3 "$payload_file" "$prefix"
            index=0
            for chunk in "$prefix"*; do
              payload="$(cat "$chunk")"
              echo "::notice title=generated-chunk:$file:$index::$payload"
              index=$((index + 1))
            done
          done
          for file in docs/work_log_archive.md docs/work_log_index.md; do
            patch_file="$RUNNER_TEMP/${file##*/}.patch"
            git diff -- "$file" > "$patch_file"
            if [[ -s "$patch_file" ]]; then
              payload="$(base64 -w0 "$patch_file")"
              echo "::notice title=generated-patch:$file::$payload"
            fi
          done

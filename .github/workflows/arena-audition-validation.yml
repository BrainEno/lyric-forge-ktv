name: Arena reference audition validation
on:
  push:
    branches: ['arena/4a5f5d3a-lyric-forge-ktv']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and report patch
        run: |
          git diff --name-only --diff-filter=AM df7a96a65739f581d58990024721d6ac13af2470 -- '*.dart' > /tmp/files
          xargs -d '\n' dart format < /tmp/files
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=FORMAT{i//4000}::{s[i:i+4000]}')
          PY
      - name: Analyze and test
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test tool > /tmp/check.log 2>&1
          a=$?
          flutter test --no-pub test/features/lyrics/domain/proofreading/reference_timing_audition_planner_test.dart test/features/lyrics/presentation/controllers/line_audition_controller_test.dart test/features/lyrics/presentation/controllers/reference_timing_audition_coordinator_test.dart test/features/lyrics/presentation/widgets/reference_timing_audition_test.dart test/features/lyrics/presentation/widgets/reference_alignment_timing_selection_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/architecture_layer_imports_contract_test.dart >> /tmp/check.log 2>&1
          b=$?
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/check.log','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=TESTLOG{i//4000}::{s[i:i+4000]}')
          PY
          exit $((a || b))
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 22:46' --slug 'audition-reference-alignment-timing' --title 'Audition verified reference alignment timing'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2246-audition-reference-alignment-timing.md'
          s=open(p).read()
          replacements={
            'TODO — describe the task purpose.': 'Enable bounded, explicit listening of reference ForcedAligner times on the verified current audio source before adoption.',
            'TODO — list changed files.': 'Reference audition planner and coordinator, line audition controller, review dialog and editor, domain/controller/widget/editor tests, handoff and work log index.',
            'dart format ... => TODO': 'dart format changed Dart files in Actions 43170164156 => formatted; patch applied locally.',
            'flutter analyze ... => TODO': 'flutter analyze --no-pub --no-fatal-infos lib test tool in Actions 43170164156 => no errors or warnings; info diagnostics remain.',
            'flutter test ... => TODO': 'Focused planner, controller, widget, editor and architecture tests in Actions 43170164156 => 145 passed.',
            'TODO — record risks and unverified behavior.': 'Audio and player checks are point-in-time, not locks; pending seeks cannot be cancelled. Real recordings and native accessibility remain unverified; #319 stays open.',
            'TODO: replace with the actual English imperative subject': 'Document reference timing audition',
          }
          for old,new in replacements.items():
            if old not in s: raise RuntimeError(old)
            s=s.replace(old,new)
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2246-audition-reference-alignment-timing.md
          git diff -- docs > /tmp/docs.patch
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/docs.patch','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=DOCS{i//4000}::{s[i:i+4000]}')
          PY

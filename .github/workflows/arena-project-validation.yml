name: Arena project safety validation
on:
  push:
    branches: [arena/a4992560-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/project/data/repositories/file_project_repository.dart test/file_project_repository_test.dart test/features/player/playback_lyrics_read_failure_test.dart
      - name: Focused project and playback tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/file_project_repository_test.dart test/features/player/playback_lyrics_read_failure_test.dart test/core/persistence/atomic_json_file_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug protect-partial-project-store --title 'Protect partial project stores'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os, re
          from pathlib import Path
          stamp = os.environ['ENTRY_STAMP']
          path = Path('docs/log/entries') / (stamp.replace(' ', '-').replace(':', '') + '-protect-partial-project-store.md')
          s = path.read_text()
          s = re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', s, flags=re.M)
          replacements = {
              'Scope': 'Reject incomplete project stores before they can overwrite saved projects and lyric documents, and avoid treating a partial project scan as a missing lyric association.',
              'Files': 'FileProjectRepository, project repository and playback lyric read-failure tests, index, handoff, this entry and generated work-log navigation.',
              'Validation': f"Local Flutter/Dart SDKs unavailable. Pinned GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused project, player and atomic-persistence tests and the full repository quality gate; Dart format and work-log new/write/check ran there. Final PR checks reported separately. git diff --check ran locally.",
              'Notes': 'Non-object records, duplicate project IDs and invalid project data refuse loading and mutations without touching the canonical file or backup; shallow recovery validation remains unchanged. A new repository is needed after external repair because the initial load failure is cached. Cross-process modifications after load and partial media metadata reads remain out of scope. No native playback or manual UI checks performed.',
              'Commit': '`fix: protect partial project stores`',
          }
          for key, value in replacements.items():
              s, count = re.subn(rf'^- {key}:.*$', f'- {key}: {value}', s, count=1, flags=re.M)
              if count != 1: raise RuntimeError(f'missing {key}')
          if 'TODO' in s: raise RuntimeError('unfilled TODO')
          path.write_text(s)
          idx = Path('docs/work_log_index.md')
          text = idx.read_text()
          old = '- Playback lyric resolution fails closed on propagated read errors. Media metadata stores now block writes after partial loads, but readable partial results can still mislead lyric resolution; other stores may skip malformed records. Failed initial loads remain cached until restart, and link writes lack compare-and-swap protection.'
          new = '- Playback lyric resolution fails closed on propagated read errors. Project stores reject partial or duplicate records; media metadata stores block partial writes but readable partial results can still mislead lyric resolution. Other stores may skip malformed records. Failed initial loads remain cached until restart, and link writes lack compare-and-swap protection.'
          if old not in text: raise RuntimeError('expected follow-up missing')
          idx.write_text(text.replace(old, new))
          Path('docs/handoff.md').write_text(f"""# Handoff\n\n## 目标\n\n处理 #223 的工程仓库持久化风险：损坏或重复记录不能被静默丢弃后覆盖，提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `4750044943914b4490bde173da6991b3af148865`；分支 `arena/a4992560-lyric-forge-ktv`。\n- 最终提交、PR 和检查状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 工程文件仓库、工程仓库和歌词读取失败测试、工作日志及本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart；固定 SDK GitHub Actions run {os.environ['GITHUB_RUN_ID']} 通过定向测试及完整质量门禁，并执行 format、work-log new/write/check。最终 head 的检查以 Actions 为准。\n- 本地提交前执行 `git diff --check`；未做真实设备或手动 UI 测试。\n\n## 下一步\n\n确认 PR 最终质量门禁并报告；#223 其余测试覆盖缺口继续保留。\n\n## 已知风险\n\n- 工程仓库首次加载失败后需重建实例；本切片不解决跨进程并发修改或其他存储实现的损坏问题。\n- 媒体元数据部分读取仍可能误导歌词解析，不在本次范围。\n\n最后更新：{stamp}（Asia/Taipei）\n""")
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-protect-partial-project-store.md"
          git diff --binary -- lib/features/project/data/repositories/file_project_repository.dart test/file_project_repository_test.dart test/features/player/playback_lyrics_read_failure_test.dart docs > /tmp/arena.patch
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure log
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          p = Path('/tmp/gate.log')
          if not p.exists(): p = Path('/tmp/focused.log')
          if p.exists():
              data = base64.b64encode(gzip.compress(p.read_bytes()[-350000:])).decode()
              for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

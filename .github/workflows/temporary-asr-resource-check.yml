name: Temporary ASR resource check
on:
  push:
    branches: [arena/45d76760-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/features/transcription/domain/services/asr_resource_coordinator.dart lib/features/transcription/data/services/independent_project_rerun_workflow.dart test/features/transcription/asr_resource_coordinator_test.dart test/features/transcription/independent_project_rerun_workflow_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:53' --slug coordinate-independent-asr-resources --title 'Coordinate independent ASR rerun resources'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2353-coordinate-independent-asr-resources.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2353-coordinate-independent-asr-resources.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PYCODE'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PYCODE

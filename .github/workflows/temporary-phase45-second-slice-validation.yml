name: Temporary Phase 4.5 second-slice validation

on:
  push:
    branches:
      - arena/2b410f70-lyric-forge-ktv

permissions:
  contents: write

env:
  VALIDATION_RUN_ID: ${{ github.run_id }}
  VALIDATION_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t dart_files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} )); then
            dart format "${dart_files[@]}"
          fi
      - name: Test workflow coverage contract
        run: flutter test test/ci_workflow_contract_test.dart
      - name: Prepare Phase 4.5 work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          dart tool/work_log.dart new --timestamp "$stamp" --slug phase45-retire-transcription-execution-check --title "Retire redundant transcription execution checks"
          python3 - "$stamp" "$VALIDATION_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id = sys.argv[1:]
          matches = list(Path('docs/log/entries').glob('*-phase45-retire-transcription-execution-check.md'))
          if not matches:
              raise SystemExit('work-log entry was not created')
          path = max(matches, key=lambda item: item.name)
          path.write_text(textwrap.dedent(f'''\
          # [{stamp}] Retire redundant transcription execution checks

          - Scope: Continue Phase 4.5 with one independently auditable CI reduction. Remove the transcription execution-failure focused workflow because its selected service analysis and failure/fallback tests already run under the universal Flutter Quality Gate on every PR to main.
          - Files: `.github/workflows/transcription-execution-failure-validation.yml` (removed), `test/ci_workflow_contract_test.dart`, `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`, `docs/work_log_index.md`, `docs/handoff.md`, and generated work-log navigation files.
          - Validation:
            - `dart format` on changed Dart files => passed.
            - `flutter test test/ci_workflow_contract_test.dart` => passed.
            - `bash scripts/quality_gate.sh --skip-pub-get` => passed (analyzer, full test suite, work-log preflight; CI run {run_id}).
            - `dart tool/work_log.dart write` and `dart tool/work_log.dart check` => passed.
          - Notes: No runtime code or transcription semantics changed. Native builds, KTV recovery, runtime release, icon, and other focused workflow checks remain unchanged; this slice does not imply they are redundant.
          - Commit: `ci: retire redundant transcription execution workflow`
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Run full quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/phase45-second-slice-quality.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            tail -100 build/phase45-second-slice-quality.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit "$status"
          fi
      - name: Finalize handoff and verify work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          python3 - "$stamp" "$VALIDATION_RUN_ID" "$VALIDATION_SHA" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id, sha = sys.argv[1:]
          Path('docs/handoff.md').write_text(textwrap.dedent(f'''\
          # Handoff

          ## 目标

          Phase 4.5 第二切片已验证：移除仅执行 ASR failure classification / fallback 定向分析与单测的 transcription execution-failure workflow；全局 Flutter Quality Gate 会对每个 main PR 执行全仓 analyze 与全量测试。

          ## Git 现场

          - Repository: `BrainEno/lyric-forge-ktv`
          - 活动分支：`arena/2b410f70-lyric-forge-ktv`（active）。
          - 基线：`c520995`；经 CI 验证的实现提交：`{sha}`。
          - 工作区由验证 workflow 收尾并清除临时 workflow；PR 尚未创建。

          ## 已改文件

          - `.github/workflows/transcription-execution-failure-validation.yml`：删除重复的定向 Flutter analyzer/tests。
          - `test/ci_workflow_contract_test.dart`：断言该聚焦 workflow 不复活，并继续锁定 universal gate 覆盖。
          - `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`、`docs/work_log_index.md`、本文件及 Phase 4.5 work-log entry。

          ## 检查结果

          - `dart format`、`flutter test test/ci_workflow_contract_test.dart`、完整 `bash scripts/quality_gate.sh --skip-pub-get` 均通过（CI run `{run_id}`）。
          - work-log `write/check` 通过。
          - 未改生产 Dart 行为、ASR/歌词语义、KTV recovery 或平台构建配置。

          ## 下一步

          1. 创建 PR，等待最终 head 的 Flutter Quality Gate 通过后再合并；Phase 4.5 其他 workflow 继续逐个审计，不批量删除。

          ## 已知风险

          - 本地无 Flutter/Dart SDK；格式、测试和质量门禁依赖固定 CI 工具链。
          - 此切片只验证该 workflow 的 Dart 分析和测试由全量门禁覆盖，不覆盖原生平台、KTV、runtime 发布路径。
          - 未进行真实歌曲或设备验证；本次与运行时无关。

          最后更新：{stamp}（Asia/Taipei）
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Remove temporary workflow and push validated tree
        run: |
          rm .github/workflows/temporary-phase45-second-slice-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Phase 4.5 second-slice validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

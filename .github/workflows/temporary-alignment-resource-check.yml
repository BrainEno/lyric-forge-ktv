name: Temporary alignment resource check
on:
  push:
    branches: [arena/7196d466-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/app/lyric_editor_assembly.dart lib/features/lyrics/domain/proofreading/forced_alignment_proofread_service.dart lib/features/lyrics/presentation/lyric_review_strings.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart test/app/coordinated_forced_alignment_runner_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:50' --slug coordinate-forced-alignment-asr --title 'Coordinate forced alignment with ASR tasks'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2350-coordinate-forced-alignment-asr.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2350-coordinate-forced-alignment-asr.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PYCODE'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PYCODE

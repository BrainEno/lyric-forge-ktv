name: Arena dashboard validation
on:
  push:
    branches: [arena/6e2e9774-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: dart format lib/features/home/presentation/screens/dashboard_screen.dart test/features/home/presentation/screens/dashboard_screen_test.dart
      - name: Focused dashboard tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/home/presentation/screens/dashboard_screen_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug dashboard-history-errors --title 'Show dashboard history read failures'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os,re
          from pathlib import Path
          stamp=os.environ['ENTRY_STAMP']
          path=Path('docs/log/entries') / (stamp.replace(' ', '-').replace(':', '')+'-dashboard-history-errors.md')
          text=path.read_text()
          text=re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', text, flags=re.M)
          values={
            'Scope':'Distinguish a failed recent playback-history read from an empty history, allow retry and observe early errors before FutureBuilder subscribes.',
            'Files':'Dashboard screen and widget tests; this entry, generated work-log navigation, index and handoff.',
            'Validation':f"Pinned Flutter GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed dashboard widget tests and the full quality gate; it ran Dart format and work-log new/write/check. Earlier focused run 42560804967 exposed an unhandled retry-time history error before FutureBuilder subscribed, addressed before this run. Local git diff --check passed. Final PR checks are reported separately; local Flutter/Dart are unavailable.",
            'Notes':'The retry uses the existing dashboard-wide refresh, so both history and recent projects reload. Tests cover repeated immediate failures of either or both repositories and recovery to a populated shelf with fake repositories, not real devices or visual inspection. File repositories that swallow or cache errors cannot be repaired by this UI; #223 remains open. The unrelated Media Hub total-upload deadline test has previously failed intermittently with Broken pipe.',
            'Commit':'`fix: show dashboard history read failures`',
          }
          for k,v in values.items():
            text,n=re.subn(rf'^- {k}:.*$',f'- {k}: {v}',text,count=1,flags=re.M)
            if n!=1: raise RuntimeError(k)
          if 'TODO' in text: raise RuntimeError('unfilled TODO')
          path.write_text(text)
          idx=Path('docs/work_log_index.md'); text=idx.read_text(); anchor='- **Separation scope (#320):**'; assert anchor in text
          text=text.replace(anchor,'- **Dashboard history (#223):** propagated recent-history read errors are distinguished from empty results and can be retried; file repository caching and partial-read behavior are separate concerns.\n'+anchor,1);idx.write_text(text)
          Path('docs/handoff.md').write_text(f'''# Handoff\n\n## 目标\n\n处理 #223 的首页播放历史读取失败被显示成空记录及刷新时立即失败逃逸的问题，提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `0aee7ace77c55767f392f65d727cbd7c05b6a1cd`；分支 `arena/6e2e9774-lyric-forge-ktv`。最终提交与 PR 状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 首页 screen、widget 测试、工作日志导航与本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart。固定 SDK GitHub Actions run {os.environ['GITHUB_RUN_ID']} 通过定向测试、完整质量门禁，并执行 format、work-log new/write/check；首次定向 run 42560804967 暴露刷新时异常逃逸，修复后复测。最终 PR 检查以 Actions 为准。\n- 本地 `git diff --check`；未做设备或手动视觉检查。\n\n## 下一步\n\n确认最终 PR 检查并报告；#223 的其余覆盖率和持久化风险保留。\n\n## 已知风险\n\n- 只处理仓库向首页传播的错误；存储层吞掉的异常、损坏数据部分读取与缓存恢复不在本次范围。重试仍刷新两个首页数据源。\n- Media Hub 上传 deadline 测试曾间歇性 Broken pipe；不把重跑视为根因已修复。\n\n最后更新：{stamp}（Asia/Taipei）\n''')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-dashboard-history-errors.md"
          git diff --binary -- docs lib/features/home/presentation/screens/dashboard_screen.dart test/features/home/presentation/screens/dashboard_screen_test.dart > /tmp/arena.patch
          python3 - <<'PY'
          import base64,gzip
          data=base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure diagnostic
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('/tmp/gate.log')
          if not p.exists(): p=Path('/tmp/focused.log')
          if p.exists():
            data=base64.b64encode(gzip.compress(p.read_bytes()[-80000:])).decode()
            for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

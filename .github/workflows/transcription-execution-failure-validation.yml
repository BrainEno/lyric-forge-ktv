name: Transcription execution failure validation

on:
  pull_request:
    paths:
      - "lib/features/transcription/data/services/qwen3_asr_native_transcription_service.dart"
      - "lib/features/transcription/data/services/whisper_cpp_transcription_service.dart"
      - "lib/features/transcription/data/services/resumable_chunked_transcription_service.dart"
      - "test/features/transcription/transcription_execution_failure_kind_test.dart"
      - ".github/workflows/transcription-execution-failure-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/features/transcription/data/services/qwen3_asr_native_transcription_service.dart"
      - "lib/features/transcription/data/services/whisper_cpp_transcription_service.dart"
      - "lib/features/transcription/data/services/resumable_chunked_transcription_service.dart"
      - "test/features/transcription/transcription_execution_failure_kind_test.dart"
      - ".github/workflows/transcription-execution-failure-validation.yml"

jobs:
  execution-failure-kinds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze execution failure classification
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/transcription/data/services/qwen3_asr_native_transcription_service.dart
          lib/features/transcription/data/services/whisper_cpp_transcription_service.dart
          lib/features/transcription/data/services/resumable_chunked_transcription_service.dart
          test/features/transcription/transcription_execution_failure_kind_test.dart
      - name: Test execution failure classification
        run: flutter test test/features/transcription/transcription_execution_failure_kind_test.dart
      - name: Regression high-quality fallback semantics
        run: flutter test test/high_quality_transcription_service_test.dart
      - name: Full Flutter regression suite
        run: flutter test

# This workflow intentionally runs both focused semantics and the full suite:
# queue recovery decisions depend on preserving failure kinds end to end.

name: tmp batch validation

on:
  push:
    branches: [arena/545e77c0-lyric-forge-ktv]
    paths-ignore:
      - '.ci-tmp/**'

permissions:
  contents: write

concurrency:
  group: tmp-batch
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        shell: bash
        run: |
          mkdir -p .ci-tmp
          git fetch origin main
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          printf '%s\n' "${files[@]}" > .ci-tmp/format_files.txt
          if (( ${#files[@]} > 0 )); then dart format "${files[@]}" > .ci-tmp/format.txt 2>&1 || true; fi
      - name: Analyze
        shell: bash
        run: |
          (flutter analyze --no-pub --no-fatal-infos lib test tool > .ci-tmp/analyze_full.txt 2>&1 && echo exit=0 || echo exit=$?) > .ci-tmp/analyze_exit.txt
          grep -E "error|warning" .ci-tmp/analyze_full.txt | head -c 20000 > .ci-tmp/analyze_problems.txt || true
          grep -cE "^\s*info" .ci-tmp/analyze_full.txt > .ci-tmp/analyze_info_count.txt || true
          grep -E "lyric_text_cleanup|lyric_find_replace|lyric_repetition|lyric_batch|lyric_edit_shortcuts|lyric_proofread_menu|lyric_editor_|asr_quality_report|lyric_text_cleanup_dialog" .ci-tmp/analyze_full.txt | head -c 20000 > .ci-tmp/analyze_ours.txt || true
          tail -c 3000 .ci-tmp/analyze_full.txt > .ci-tmp/analyze_tail.txt
          rm .ci-tmp/analyze_full.txt
      - name: Targeted tests
        shell: bash
        run: |
          for f in \
            test/features/lyrics/domain/services/lyric_text_cleanup_service_test.dart \
            test/features/lyrics/domain/services/lyric_find_replace_service_test.dart \
            test/features/lyrics/domain/services/lyric_repetition_consistency_service_test.dart \
            test/features/lyrics/presentation/controllers/lyric_batch_text_edit_controller_test.dart \
            test/features/lyrics/presentation/widgets/lyric_batch_text_tools_test.dart \
            test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart \
            test/features/lyrics/presentation/widgets/lyric_edit_shortcuts_test.dart \
            test/features/lyrics/presentation/widgets/lyric_editor_toolbar_test.dart \
            test/tool/asr_quality_report_test.dart; do
            name=$(basename "$f" .dart)
            (flutter test --no-pub "$f" > ".ci-tmp/t_$name.full" 2>&1 && echo "$name exit=0" || echo "$name exit=$?") >> .ci-tmp/targeted.txt
            if grep -q "exit=0" <(tail -1 .ci-tmp/targeted.txt); then rm ".ci-tmp/t_$name.full"; else head -c 30000 ".ci-tmp/t_$name.full" > ".ci-tmp/t_$name.txt"; rm ".ci-tmp/t_$name.full"; fi
          done
      - name: Full tests
        shell: bash
        run: |
          (flutter test --no-pub > .ci-tmp/full.full 2>&1 && echo exit=0 || echo exit=$?) > .ci-tmp/full_exit.txt
          tail -c 4000 .ci-tmp/full.full > .ci-tmp/full_tail.txt
          grep -E "\[E\]|FAILED|Some tests failed" .ci-tmp/full.full | head -c 20000 > .ci-tmp/full_failures.txt || true
          rm .ci-tmp/full.full
      - name: Work log check
        shell: bash
        run: |
          (dart tool/work_log.dart check > .ci-tmp/worklog.txt 2>&1 && echo exit=0 || echo exit=$?) >> .ci-tmp/worklog.txt
      - name: Commit results
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "tmp: validation results" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

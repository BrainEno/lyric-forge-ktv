name: Temporary Provider lock resolution

on:
  push:
    branches:
      - arena/746aa31e-lyric-forge-ktv

permissions:
  contents: write

env:
  PUB_ENVIRONMENT: github-actions

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies
        run: flutter pub get
      - name: Commit the generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo 'The lockfile is already current.'
          else
            git commit -m 'chore: update provider lockfile'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

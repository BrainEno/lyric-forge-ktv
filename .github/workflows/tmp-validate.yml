name: tmp-validate

on:
  push:
    branches: [arena/f913bbc3-lyric-forge-ktv]
    paths-ignore:
      - '.ci-tmp/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Validate
        shell: bash
        run: |
          mkdir -p .ci-tmp
          flutter pub get > .ci-tmp/pubget.txt 2>&1 && echo exit=0 >> .ci-tmp/pubget.txt || echo exit=$? >> .ci-tmp/pubget.txt
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          echo "${files[@]}" > .ci-tmp/format.txt
          if (( ${#files[@]} > 0 )); then
            dart format "${files[@]}" >> .ci-tmp/format.txt 2>&1 && echo exit=0 >> .ci-tmp/format.txt || echo exit=$? >> .ci-tmp/format.txt
          fi
          flutter analyze --no-fatal-infos > .ci-tmp/analyze.txt 2>&1 && echo exit=0 >> .ci-tmp/analyze.txt || echo exit=$? >> .ci-tmp/analyze.txt
          grep -E "^\s*(error|warning) " .ci-tmp/analyze.txt > .ci-tmp/analyze-problems.txt || true
          grep -cE "^\s*info " .ci-tmp/analyze.txt > .ci-tmp/analyze-info-count.txt || true
          flutter test \
            test/features/lyrics/domain/services/lyric_karaoke_export_test.dart \
            test/features/lyrics/domain/services/lyric_pace_analyzer_test.dart \
            test/features/lyrics/domain/services/lyric_tap_sync_session_test.dart \
            test/features/lyrics/domain/services/lyric_export_encoder_test.dart \
            test/features/lyrics/domain/services/lyric_structure_advisor_test.dart \
            test/features/lyrics/domain/services/lyric_timeline_repair_planner_test.dart \
            test/features/lyrics/presentation/widgets/lyric_tap_sync_and_pace_widgets_test.dart \
            test/features/lyrics/presentation/widgets/lyric_timing_tools_widgets_test.dart \
            test/features/lyrics/presentation/widgets/lyric_editor_toolbar_test.dart \
            test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart \
            test/features/lyrics/presentation/widgets/lyric_line_structure_widgets_test.dart \
            test/features/lyrics/presentation/widgets/lyric_batch_text_tools_test.dart \
            > .ci-tmp/targeted.txt 2>&1 && echo exit=0 >> .ci-tmp/targeted.txt || echo exit=$? >> .ci-tmp/targeted.txt
          tail -5 .ci-tmp/targeted.txt > .ci-tmp/targeted-tail.txt
          if grep -q "^exit=0" .ci-tmp/targeted.txt; then
            flutter test > .ci-tmp/full.txt 2>&1 && echo exit=0 >> .ci-tmp/full.txt || echo exit=$? >> .ci-tmp/full.txt
            tail -5 .ci-tmp/full.txt > .ci-tmp/full-tail.txt
            grep -E "\[E\]|FAILED|Some tests failed" .ci-tmp/full.txt | head -50 > .ci-tmp/full-failures.txt || true
          fi
          dart tool/work_log.dart write > .ci-tmp/worklog.txt 2>&1 && echo write_exit=0 >> .ci-tmp/worklog.txt || echo write_exit=$? >> .ci-tmp/worklog.txt
          dart tool/work_log.dart check >> .ci-tmp/worklog.txt 2>&1 && echo check_exit=0 >> .ci-tmp/worklog.txt || echo check_exit=$? >> .ci-tmp/worklog.txt
      - name: Commit results
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci-tmp lib test tool docs
          git commit -m "ci: tmp validation output" || echo nothing
          git push origin HEAD:arena/f913bbc3-lyric-forge-ktv

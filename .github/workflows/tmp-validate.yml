name: tmp validate
on:
  push:
    branches: [arena/f9362eba-lyric-forge-ktv]
    paths-ignore: ['.ci-tmp/**', '.ci-trigger/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          mkdir -p .ci-tmp/validate
          files=$(git diff --name-only b98c0ca3b40120c793575911dc82561b759a1c28 -- 'lib/*.dart' 'test/*.dart' 'tool/*.dart'; git ls-files --others --exclude-standard -- '*.dart')
          dart format $files > .ci-tmp/validate/format.txt 2>&1 || true
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos > .ci-tmp/validate/analyze.txt 2>&1 || true
          grep -E "^\s*(error|warning) " .ci-tmp/validate/analyze.txt > .ci-tmp/validate/analyze-problems.txt || true
          grep -cE "^\s*info " .ci-tmp/validate/analyze.txt > .ci-tmp/validate/analyze-info-count.txt || true
      - name: Targeted tests
        run: |
          flutter test --reporter expanded \
            test/features/lyrics/domain/services/lyric_span_rerecognition_test.dart \
            test/features/lyrics/presentation/widgets/lyric_span_recognition_dialog_test.dart \
            test/features/transcription/project_span_recognition_service_test.dart \
            test/features/transcription/aligner_word_timing_repair_test.dart \
            test/features/transcription/forced_alignment_http_client_test.dart \
            test/features/transcription/qwen_runtime_service_lifecycle_test.dart \
            test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart \
            test/features/lyrics/presentation/widgets/lyric_missed_repeat_dialog_test.dart \
            test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart \
            test/features/lyrics/presentation/widgets/lyric_batch_text_tools_test.dart \
            test/app/coordinated_forced_alignment_runner_test.dart \
            test/architecture/app_assembly_contract_test.dart \
            test/architecture/feature_dependency_graph_test.dart \
            test/ci_workflow_contract_test.dart \
            > .ci-tmp/validate/targeted.txt 2>&1 || true
          tail -60 .ci-tmp/validate/targeted.txt > .ci-tmp/validate/targeted-tail.txt
          grep -E "\[E\]|Expected:|Actual:|Error:|error:" -A12 .ci-tmp/validate/targeted.txt | head -400 > .ci-tmp/validate/targeted-failures.txt || true
      - name: Full suite
        run: |
          flutter test > .ci-tmp/validate/full.txt 2>&1 || true
          tail -30 .ci-tmp/validate/full.txt > .ci-tmp/validate/full-tail.txt
          grep -E "\[E\]" .ci-tmp/validate/full.txt | sort -u | head -100 > .ci-tmp/validate/full-failures.txt || true
          rm .ci-tmp/validate/full.txt
      - name: Work log
        run: |
          (dart tool/work_log.dart write && dart tool/work_log.dart check) > .ci-tmp/validate/worklog.txt 2>&1 || echo "FAILED" >> .ci-tmp/validate/worklog.txt
      - name: Commit
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci-tmp lib test tool docs
          git commit -qm "ci: validation results" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done

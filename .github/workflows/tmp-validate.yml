name: tmp validate

on:
  push:
    branches: [arena/05465f08-lyric-forge-ktv]
    paths-ignore:
      - ".ci-tmp/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Validate
        shell: bash
        run: |
          mkdir -p .ci-tmp
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          { dart format "${files[@]}" && echo exit=0 || echo exit=$?; } > .ci-tmp/format.txt 2>&1
          flutter analyze > .ci-tmp/analyze.txt 2>&1 && echo exit=0 >> .ci-tmp/analyze.txt || echo exit=$? >> .ci-tmp/analyze.txt
          grep -E "^ *(error|warning) " .ci-tmp/analyze.txt > .ci-tmp/analyze-problems.txt || true
          grep -cE "^ *info " .ci-tmp/analyze.txt > .ci-tmp/analyze-info-count.txt || true
          targeted=(
            test/features/lyrics/data/services/karaoke_import_test.dart
            test/features/lyrics/domain/services/lyric_word_timing_check_and_edit_test.dart
            test/features/lyrics/presentation/widgets/lyric_word_timing_tools_widgets_test.dart
            test/local_lyric_file_import_service_test.dart
            test/features/lyrics/data/services/local_lyric_file_import_service_test.dart
            test/features/lyrics/presentation/widgets/lyric_loop_and_word_timing_widgets_test.dart
            test/features/lyrics/presentation/widgets/lyric_tap_sync_and_pace_widgets_test.dart
            test/features/lyrics/domain/services/lyric_export_encoder_test.dart
          )
          existing=()
          for f in "${targeted[@]}"; do [ -f "$f" ] && existing+=("$f"); done
          if flutter test --no-pub "${existing[@]}" > .ci-tmp/targeted.txt 2>&1; then
            echo exit=0 >> .ci-tmp/targeted.txt
            flutter test --no-pub > .ci-tmp/full.txt 2>&1 && echo exit=0 >> .ci-tmp/full.txt || echo exit=$? >> .ci-tmp/full.txt
            tail -n 40 .ci-tmp/full.txt > .ci-tmp/full-tail.txt
            grep -nE "\[E\]|Some tests failed|Expected:|Actual:|Error:|❌" .ci-tmp/full.txt | head -n 200 > .ci-tmp/full-failures.txt || true
            rm .ci-tmp/full.txt
          else
            echo exit=$? >> .ci-tmp/targeted.txt
          fi
          { dart tool/work_log.dart write && dart tool/work_log.dart check && echo exit=0 || echo exit=$?; } > .ci-tmp/worklog.txt 2>&1
          wc -l lib/features/lyrics/presentation/screens/lyric_editor_screen.dart > .ci-tmp/screen-lines.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci-tmp lib test tool docs
          git commit -m "ci: tmp validation results" || true
          git push origin HEAD:${GITHUB_REF_NAME}

name: tmp validate
on:
  push:
    branches: [arena/c21298fd-lyric-forge-ktv]
    paths-ignore: ['.ci-tmp/**', '.ci-trigger/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          mkdir -p .ci-tmp/validate
          files=$(git diff --name-only c67b08755f7f0380a57c02b68c358ddd74953e8e -- 'lib/*.dart' 'test/*.dart' 'tool/*.dart'; git ls-files --others --exclude-standard -- '*.dart')
          dart format $files > .ci-tmp/validate/format.txt 2>&1 || true
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos > .ci-tmp/validate/analyze.txt 2>&1 || true
          grep -E "^\s*(error|warning) " .ci-tmp/validate/analyze.txt > .ci-tmp/validate/analyze-problems.txt || true
          grep -cE "^\s*info " .ci-tmp/validate/analyze.txt > .ci-tmp/validate/analyze-info-count.txt || true
          grep -E "^\s*info " .ci-tmp/validate/analyze.txt | grep -E "loop|whisper_decoding|whisper_cpp|high_quality_transcription|summary_card|config_dialog" > .ci-tmp/validate/analyze-infos-touched.txt || true
      - name: Targeted tests
        run: |
          flutter test --reporter expanded \
            test/features/transcription/domain/asr_segment_loop_detector_test.dart \
            test/features/transcription/domain/whisper_loop_recovery_test.dart \
            test/features/transcription/domain/whisper_loop_arbiter_test.dart \
            test/features/transcription/whisper_loop_recovery_service_test.dart \
            test/features/transcription/whisper_loop_fusion_test.dart \
            test/high_quality_transcription_service_test.dart \
            test/features/transcription/lyric_fusion_recall_test.dart \
            test/features/transcription/whisper_cpp_decoding_profile_test.dart \
            test/features/transcription/domain/whisper_decoding_policy_test.dart \
            test/features/transcription/whisper_decoding_config_fingerprint_test.dart \
            test/features/lyrics/domain/secondary_only_review_test.dart \
            test/features/lyrics/presentation/secondary_suggestion_review_flow_test.dart \
            test/architecture/ \
            > .ci-tmp/validate/targeted.txt 2>&1 || true
          tail -60 .ci-tmp/validate/targeted.txt > .ci-tmp/validate/targeted-tail.txt
          grep -E "\[E\]|Expected:|Actual:|Error:|error:" -A12 .ci-tmp/validate/targeted.txt | head -400 > .ci-tmp/validate/targeted-failures.txt || true
      - name: Full suite
        run: |
          flutter test > .ci-tmp/validate/full.txt 2>&1 || true
          tail -30 .ci-tmp/validate/full.txt > .ci-tmp/validate/full-tail.txt
          grep -E "\[E\]" .ci-tmp/validate/full.txt | sort -u | head -100 > .ci-tmp/validate/full-failures.txt || true
          rm .ci-tmp/validate/full.txt
      - name: Work log
        run: |
          (dart tool/work_log.dart write && dart tool/work_log.dart check) > .ci-tmp/validate/worklog.txt 2>&1 || echo "FAILED" >> .ci-tmp/validate/worklog.txt
      - name: Commit
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci-tmp lib test tool docs
          git commit -qm "ci: validation results" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done

name: tmp-validate

on:
  push:
    branches: [arena/7e88cd21-lyric-forge-ktv]
    paths-ignore:
      - '.ci-tmp/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Validate
        shell: bash
        run: |
          out=.ci-tmp
          rm -rf $out && mkdir -p $out
          flutter pub get > $out/pub.txt 2>&1 && echo "pub exit=0" >> $out/summary.txt || echo "pub exit=$?" >> $out/summary.txt
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          echo "format files=${#files[@]}" >> $out/summary.txt
          if (( ${#files[@]} > 0 )); then dart format "${files[@]}" > $out/format.txt 2>&1; fi
          wc -l lib/features/lyrics/presentation/screens/lyric_editor_screen.dart >> $out/summary.txt
          flutter analyze > $out/analyze.txt 2>&1 && echo "analyze exit=0" >> $out/summary.txt || echo "analyze exit=$?" >> $out/summary.txt
          grep -E "^\s*(error|warning) •" $out/analyze.txt > $out/analyze-problems.txt || true
          grep -cE "^\s*info •" $out/analyze.txt >> $out/summary.txt || true
          flutter test --no-pub --reporter expanded \
            test/features/lyrics/domain/services/lyric_timeline_repair_planner_test.dart \
            test/features/lyrics/domain/services/lyric_timing_shift_service_test.dart \
            test/features/lyrics/domain/services/lyric_export_encoder_test.dart \
            test/features/lyrics/presentation/widgets/lyric_timing_tools_widgets_test.dart \
            test/features/lyrics/presentation/widgets/lyric_editor_toolbar_test.dart \
            test/features/lyrics/presentation/widgets/lyric_line_structure_widgets_test.dart \
            test/features/lyrics/domain/services/lyric_structure_advisor_test.dart \
            test/local_lyric_file_export_service_test.dart \
            > $out/targeted.txt 2>&1 && echo "targeted exit=0" >> $out/summary.txt || echo "targeted exit=$?" >> $out/summary.txt
          grep -nE "❌|\[E\]|EXCEPTION|Expected:|Actual:|Error:|error:" $out/targeted.txt | head -c 20000 > $out/targeted-failures.txt || true
          flutter test --no-pub --reporter expanded > $out/full.txt 2>&1 && echo "full exit=0" >> $out/summary.txt || echo "full exit=$?" >> $out/summary.txt
          grep -nE "❌|\[E\]" $out/full.txt | head -c 20000 > $out/full-failures.txt || true
          tail -n 5 $out/full.txt >> $out/summary.txt
          rm -f $out/full.txt
          dart tool/work_log.dart write > $out/worklog-write.txt 2>&1; echo "worklog write exit=$?" >> $out/summary.txt
          dart tool/work_log.dart check > $out/worklog.txt 2>&1 && echo "worklog exit=0" >> $out/summary.txt || echo "worklog exit=$?" >> $out/summary.txt
      - name: Commit results
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add -A .ci-tmp lib test tool docs
          git commit -m "tmp: validation results" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

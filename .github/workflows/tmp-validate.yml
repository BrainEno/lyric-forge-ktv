name: tmp-validate
on:
  push:
    branches: [arena/e1b625f0-lyric-forge-ktv]
    paths-ignore: ['.ci-tmp/**']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Run checks
        shell: bash
        run: |
          set +e
          mkdir -p .ci-tmp
          out=.ci-tmp
          flutter pub get --enforce-lockfile > $out/pub.txt 2>&1 && echo "pub exit=0" >> $out/summary.txt || echo "pub exit=$?" >> $out/summary.txt
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          dart format "${files[@]}" > $out/format.txt 2>&1
          echo "format files=${#files[@]}" >> $out/summary.txt
          wc -l lib/features/lyrics/presentation/screens/lyric_editor_screen.dart >> $out/summary.txt
          flutter analyze > $out/analyze.txt 2>&1 && echo "analyze exit=0" >> $out/summary.txt || echo "analyze exit=$?" >> $out/summary.txt
          grep -cE "^ *info" $out/analyze.txt >> $out/summary.txt
          grep -E "error •|warning •" $out/analyze.txt | head -40 > $out/analyze-problems.txt
          flutter test --no-pub --reporter expanded \
            test/features/lyrics/domain/services/lyric_line_structure_service_test.dart \
            test/features/lyrics/domain/services/lyric_structure_advisor_test.dart \
            test/features/lyrics/presentation/controllers/lyric_editor_line_structure_test.dart \
            test/features/lyrics/presentation/widgets/lyric_line_structure_widgets_test.dart \
            test/tool/asr_quality_report_test.dart \
            test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart \
            test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart \
            test/features/lyrics/presentation/widgets/lyric_list_pane_test.dart \
            test/features/lyrics/presentation/screens/lyric_editor_orchestration_contract_test.dart \
            > $out/targeted.txt 2>&1 && echo "targeted exit=0" >> $out/summary.txt || echo "targeted exit=$?" >> $out/summary.txt
          grep -n -B2 -A40 "❌\|\[E\]" $out/targeted.txt | head -c 60000 > $out/targeted-failures.txt
          flutter test --no-pub > $out/full.txt 2>&1 && echo "full exit=0" >> $out/summary.txt || echo "full exit=$?" >> $out/summary.txt
          tail -5 $out/full.txt >> $out/summary.txt
          grep -n -B2 -A40 "\[E\]\|Some tests failed\|FAILED" $out/full.txt | head -c 60000 > $out/full-failures.txt
          rm -f $out/full.txt
          head -c 200000 $out/targeted.txt > $out/t.tmp && mv $out/t.tmp $out/targeted.txt
          dart tool/work_log.dart write > $out/worklog-write.txt 2>&1; echo "worklog write exit=$?" >> $out/summary.txt
          dart tool/work_log.dart check > $out/worklog.txt 2>&1 && echo "worklog exit=0" >> $out/summary.txt || echo "worklog exit=$?" >> $out/summary.txt
      - name: Commit results
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A .ci-tmp lib test tool docs
          git commit -m "tmp: validation results" || true
          git push origin HEAD:${GITHUB_REF_NAME}

name: Arena temporary ASR installation owner validation
on:
  push:
    branches: [arena/6d6af082-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/coordinated_asr_install_manager.dart test/features/transcription/coordinated_asr_install_manager_test.dart
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:50' --slug coordinate-asr-installation --title 'Coordinate ASR installation ownership'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2050-coordinate-asr-installation.md')
          s=p.read_text()
          for a,b in {
            'TODO — describe the task purpose.':'Prepare a per-caller installation facade for shared ASR resource coordination and cancellation ownership.',
            'TODO — list changed files.':'Installation coordination facade and tests, handoff, work-log index, entry, generated summary and archive.',
            'dart format ... => TODO':'dart format on changed Dart files => passed on pinned SDK.',
            'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42848531494.',
            'flutter test ... => TODO':'flutter test --no-pub for installation coordination, preflight cancellation, resource coordinator, project cancellation, independent rerun workflow and smoke service => passed in Actions 42848531494.',
            'TODO — record risks and unverified behavior.':'Not wired to production. Correct ownership requires every shared-delegate installation to use a separate facade with the same coordinator; it cannot force cancellation of an uncooperative delegate. Repair, storage operations, cross-process resources and real-device behavior remain unverified.',
            'TODO: replace with the actual English imperative subject':'Coordinate ASR installation ownership',
          }.items():
              assert a in s, a
              s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Expose generated patch
        run: |
          git add -N docs/log/entries/2026-11-07-2050-coordinate-asr-installation.md
          git diff --binary -- docs | gzip -c | base64 -w 0 > /tmp/patch.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/patch.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=PATCH{i//3000:03d}::{s[i:i+3000]}')
          PY

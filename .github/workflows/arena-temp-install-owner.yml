name: Arena temporary ASR installation owner validation
on:
  push:
    branches: [arena/6d6af082-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and expose patch
        run: |
          dart format lib/features/transcription/data/services/coordinated_asr_install_manager.dart test/features/transcription/coordinated_asr_install_manager_test.dart
          git diff --binary | gzip -c | base64 -w 0 > /tmp/format.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/format.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=FORMAT{i//3000:03d}::{s[i:i+3000]}')
          PY
      - run: flutter test --no-pub test/features/transcription/coordinated_asr_install_manager_test.dart test/features/transcription/storage_preflight_install_cancellation_test.dart test/features/transcription/asr_resource_coordinator_test.dart test/features/transcription/local_project_transcription_cancellation_test.dart test/features/transcription/independent_project_rerun_workflow_test.dart test/features/transcription/asr_end_to_end_smoke_test_service_test.dart
      - run: flutter analyze --no-pub --no-fatal-infos lib test tool

name: KTV history validation
on:
  push:
    branches: [feat/ktv-take-history-index]
  workflow_dispatch:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/features/player/ktv_take_history_store_test.dart
      - run: flutter test

name: KTV history validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/player/**'
      - 'lib/features/project/domain/models/project_manifest.dart'
      - 'test/features/player/**'
      - '.github/workflows/ktv-history-validation.yml'
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/features/player/ktv_project_storage_test.dart
      - run: flutter test test/features/player/ktv_take_history_store_test.dart
      - run: flutter test test/features/player/ktv_take_mix_path_test.dart
      - run: flutter test

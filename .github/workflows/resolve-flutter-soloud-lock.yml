name: Resolve flutter_soloud lock

on:
  push:
    branches: [fix/flutter-soloud-meta-conflict]
    paths:
      - pubspec.yaml
      - .github/workflows/resolve-flutter-soloud-lock.yml

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 4.1.7 compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/player/data/services/record_soloud_ktv_microphone_service.dart')
          text = path.read_text()
          old = '''      final outputLatency = _soloud.getOutputLatency();
      _emit(
        _state.copyWith(
          isStarting: false,
          isMonitoring: true,
          permissionDenied: false,
          engineLatency: outputLatency > Duration.zero ? outputLatency : null,
          clearEngineLatency: outputLatency <= Duration.zero,
          clearError: true,
        ),
      );'''
          new = '''      // flutter_soloud 4.1.7 does not expose a reliable output-latency
      // query. Keep the latency unknown rather than reporting a guessed value;
      // the UI already handles this by showing only the user-added monitor delay.
      _emit(
        _state.copyWith(
          isStarting: false,
          isMonitoring: true,
          permissionDenied: false,
          clearEngineLatency: true,
          clearError: true,
        ),
      );'''
          if text.count(old) != 1:
              raise SystemExit('expected one getOutputLatency block')
          path.write_text(text.replace(old, new))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Commit compatibility changes and resolved lockfile
        run: |
          if git diff --quiet -- pubspec.lock lib/features/player/data/services/record_soloud_ktv_microphone_service.dart; then
            echo "Working tree already matches"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.lock lib/features/player/data/services/record_soloud_ktv_microphone_service.dart
          git commit -m "Adapt KTV microphone monitoring to flutter_soloud 4.1.7"
          git push

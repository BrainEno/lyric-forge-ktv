name: Resolve flutter_soloud lock

on:
  push:
    branches: [fix/flutter-soloud-meta-conflict]
    paths:
      - pubspec.yaml
      - .github/workflows/resolve-flutter-soloud-lock.yml

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock already matches"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pubspec.lock
          git commit -m "Regenerate lockfile for flutter_soloud 4.1.7"
          git push

name: Arena temporary shared segment chunk validation
on:
  push:
    branches: [arena/d30617d4-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:48' --slug preserve-shared-asr-chunk-review --title 'Preserve shared ASR review across chunks'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2048-preserve-shared-asr-chunk-review.md')
          s=p.read_text()
          for a,b in {
            'TODO — describe the task purpose.':'Preserve the restrictive shared-secondary review candidate when overlapping transcription chunks resolve to the same lyric line.',
            'TODO — list changed files.':'Chunk metadata merge and tests, handoff, index, entry and generated work-log navigation.',
            'dart format ... => TODO':'dart format on changed Dart files => passed on pinned SDK.',
            'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42949968911.',
            'flutter test ... => TODO':'flutter test --no-pub for resumable chunks, high-quality ASR and lyric inspector => passed in Actions 42949968911.',
            'TODO — record risks and unverified behavior.':'Preferring a shared candidate may hide another candidate for the same merged row. Independently fused chunks may miss cross-boundary sharing, old outputs lack the flag, and no real-song accuracy or device validation was performed.',
            'TODO: replace with the actual English imperative subject':'Preserve shared ASR review across chunks',
          }.items():
              assert a in s, a
              s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Expose generated patch
        run: |
          git add -N docs/log/entries/2026-11-07-2048-preserve-shared-asr-chunk-review.md
          git diff --binary -- docs | gzip -c | base64 -w 0 > /tmp/patch.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/patch.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=PATCH{i//3000:03d}::{s[i:i+3000]}')
          PY

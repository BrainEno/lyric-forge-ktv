name: Temporary independent rerun workflow checks
on:
  push:
    branches: [arena/fd8aa424-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: git diff --name-only 0931afbc1b853af57c7d63bd02928c5e9431eee4 HEAD -- '*.dart' | xargs -r dart format
      - name: Test
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/transcription/independent_project_rerun_workflow_test.dart test/features/transcription/independent_project_rerun_service_test.dart test/features/transcription/project_rerun_candidate_store_test.dart 2>&1 | tee /tmp/workflow-test.log
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/workflow-analyze.log
      - name: Return patch and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','*.dart']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          for path in ['/tmp/workflow-test.log','/tmp/workflow-analyze.log']:
              try:
                  lines = open(path).read().splitlines()
                  hits = [i for i,x in enumerate(lines) if '[E]' in x or 'Error:' in x or 'error •' in x or 'warning •' in x or 'Some tests failed' in x]
                  for i in hits[:5]:
                      for line in lines[max(0,i-2):min(len(lines),i+9)]: print('::error::' + line[:900])
              except FileNotFoundError: pass
          PY

name: Temporary independent rerun workflow checks
on:
  push:
    branches: [arena/fd8aa424-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format check
        run: git diff --name-only 0931afbc1b853af57c7d63bd02928c5e9431eee4 HEAD -- '*.dart' | xargs -r dart format --output=none --set-exit-if-changed
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:58' --slug orchestrate-independent-rerun --title 'Orchestrate independent model reruns'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2358-orchestrate-independent-rerun.md')
          print(p.read_text())
          p.write_text('''# [2026-11-07 23:58] Orchestrate independent model reruns

          - Scope: Connect selected-engine runtime readiness, independent transcription and durable review candidates without replacing current lyrics.
          - Files: Independent rerun workflow and focused tests, product follow-up, handoff, index, entry and generated work-log navigation.
          - Validation:
            - Pinned Flutter Actions run 42658407465: format after dependency resolution, independent workflow/rerun/candidate-store tests, and flutter analyze --no-pub --no-fatal-infos lib test tool passed.
            - Temporary Actions work-log run: formatting and work-log write/check; final PR gate reported separately. Local Flutter/Dart unavailable.
          - Notes: Default factories create actual native engine adapters, but tests use fakes and no production caller exists. App-wide ASR/aligner/install coordination is required before UI wiring; an idle Qwen server may retain GPU memory. Cancellation is refused once candidate persistence begins. Whole-file runs, model contents and real-song accuracy remain unverified.
          - Commit: `Orchestrate independent model reruns`
          '''.replace('\n          ', '\n'))
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return documentation patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2358-orchestrate-independent-rerun.md
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          PY

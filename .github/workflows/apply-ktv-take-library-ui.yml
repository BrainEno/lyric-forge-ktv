name: Clean KTV take library UI patch

on:
  push:
    branches: [feat/ktv-take-library-metadata]
    paths:
      - .github/workflows/apply-ktv-take-library-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove raw-string markers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/player/presentation/screens/player_screen.dart')
          text = path.read_text()
          marker = '\n\\\n'
          count = text.count(marker)
          if count != 2:
              raise SystemExit(f'expected 2 raw-string markers, found {count}')
          path.write_text(text.replace(marker, '\n'))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/player/presentation/screens/player_screen.dart
          git commit -m "Clean KTV take library UI patch"
          git push

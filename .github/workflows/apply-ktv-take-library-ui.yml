name: Apply KTV take library UI patch

on:
  push:
    branches: [feat/ktv-take-library-metadata]
    paths:
      - .github/workflows/apply-ktv-take-library-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch take history UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/screens/player_screen.dart')
          text = path.read_text()

          method_anchor = '  Future<void> _confirmDeleteTake(KtvRecordingSession take) async {\n'
          if text.count(method_anchor) != 1:
              raise SystemExit('expected exactly one delete method anchor')

          methods = r'''  Future<void> _renameTake(KtvRecordingSession take) async {
            final controller = TextEditingController(text: take.displayName ?? '');
            final value = await showDialog<String>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: const Text('给这次演唱命名'),
                content: TextField(
                  controller: controller,
                  autofocus: true,
                  maxLength: KtvTakeHistoryStore.maxDisplayNameLength,
                  decoration: const InputDecoration(
                    labelText: '录音名称',
                    hintText: '例如：第二遍 / 高音最好的一次',
                  ),
                  onSubmitted: (value) => Navigator.pop(dialogContext, value),
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(dialogContext),
                    child: const Text('取消'),
                  ),
                  FilledButton(
                    onPressed: () => Navigator.pop(dialogContext, controller.text),
                    child: const Text('保存'),
                  ),
                ],
              ),
            );
            controller.dispose();
            if (value == null || !mounted) return;
            try {
              await const KtvTakeHistoryStore().updateProjectTakeMetadata(
                _project,
                take,
                displayName: value,
                clearDisplayName: value.trim().isEmpty,
              );
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(value.trim().isEmpty ? '录音名称已清除' : '录音名称已保存'),
                ),
              );
              await _openTakeHistory();
            } catch (error) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('保存录音名称失败：$error')),
              );
            }
          }

          Future<void> _toggleFavoriteTake(KtvRecordingSession take) async {
            try {
              await const KtvTakeHistoryStore().updateProjectTakeMetadata(
                _project,
                take,
                isFavorite: !take.isFavorite,
              );
              if (!mounted) return;
              await _openTakeHistory();
            } catch (error) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('更新收藏状态失败：$error')),
              );
            }
          }

'''
          text = text.replace(method_anchor, methods + method_anchor, 1)

          start_marker = '          for (final take in takes)\n            ListTile(\n'
          if text.count(start_marker) != 1:
              raise SystemExit('expected exactly one take list block start')
          start = text.index(start_marker)
          tail_marker = '        ],\n      ),\n    );\n  }\n\n  Future<void> _shutdownKtvAudio()'
          end = text.find(tail_marker, start)
          if end < 0:
              raise SystemExit('take list block end not found')

          replacement = r'''          for (final take in takes)
            Builder(
              builder: (sheetContext) {
                final timestamp =
                    take.startedAt.toLocal().toString().split('.').first;
                final customName = take.displayName?.trim();
                final hasCustomName = customName?.isNotEmpty == true;
                return ListTile(
                  leading: Icon(
                    take.isFavorite
                        ? Icons.star_rounded
                        : Icons.library_music_outlined,
                    color: take.isFavorite ? AppColors.accent : null,
                  ),
                  title: Text(hasCustomName ? customName! : timestamp),
                  subtitle: Text(
                    '${hasCustomName ? "$timestamp · " : ""}'
                    '${_formatRecordingTime(take.duration)} · '
                    '${take.alignmentReliable ? "可重新混音" : "时间轴异常，仅保留原始人声"}',
                  ),
                  trailing: Row(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      IconButton(
                        tooltip: take.isFavorite ? '取消收藏' : '收藏并置顶',
                        icon: Icon(
                          take.isFavorite
                              ? Icons.star_rounded
                              : Icons.star_border_rounded,
                        ),
                        onPressed: () {
                          Navigator.of(sheetContext).pop();
                          unawaited(_toggleFavoriteTake(take));
                        },
                      ),
                      PopupMenuButton<String>(
                        tooltip: '更多操作',
                        onSelected: (action) {
                          Navigator.of(sheetContext).pop();
                          if (action == 'rename') {
                            unawaited(_renameTake(take));
                          } else if (action == 'delete') {
                            unawaited(_confirmDeleteTake(take));
                          }
                        },
                        itemBuilder: (context) => const [
                          PopupMenuItem(
                            value: 'rename',
                            child: Text('重命名'),
                          ),
                          PopupMenuItem(
                            value: 'delete',
                            child: Text('永久删除'),
                          ),
                        ],
                      ),
                    ],
                  ),
                  onTap: () async {
                    Navigator.of(sheetContext).pop();
                    await _showTakeResult(take);
                  },
                );
              },
            ),
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit UI patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/player/presentation/screens/player_screen.dart
          git commit -m "Add KTV take naming and favorite controls"
          git push

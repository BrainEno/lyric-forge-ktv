name: Qwen model integrity validation

on:
  pull_request:
    paths:
      - "lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/hugging_face_file_metadata.dart"
      - "test/features/transcription/hugging_face_file_metadata_test.dart"
      - "test/features/transcription/qwen_model_integrity_contract_test.dart"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/qwen-model-integrity-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/hugging_face_file_metadata.dart"
      - "test/features/transcription/hugging_face_file_metadata_test.dart"
      - "test/features/transcription/qwen_model_integrity_contract_test.dart"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/qwen-model-integrity-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qwen-model-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Analyze Qwen model integrity changes
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart
          lib/features/transcription/data/services/hugging_face_file_metadata.dart
          test/features/transcription/hugging_face_file_metadata_test.dart
          test/features/transcription/qwen_model_integrity_contract_test.dart
      - name: Test Hugging Face metadata parser
        run: flutter test test/features/transcription/hugging_face_file_metadata_test.dart
      - name: Test Qwen download integrity contract
        run: flutter test test/features/transcription/qwen_model_integrity_contract_test.dart

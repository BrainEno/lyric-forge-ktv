name: Arena temporary segment evidence validation
on:
  push:
    branches: [arena/d30617d4-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/high_quality_transcription_service.dart lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:47' --slug record-secondary-asr-segments --title 'Record secondary ASR segment evidence'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2047-record-secondary-asr-segments.md')
          s=p.read_text()
          for a,b in {
            'TODO — describe the task purpose.':'Retain individual secondary-engine segment text, timing and chunk origin to enable later evidence-based review of cross-chunk duplicates.',
            'TODO — list changed files.':'High-quality and chunked transcription services, targeted tests, handoff, index, entry and generated work-log navigation.',
            'dart format ... => TODO':'dart format on changed Dart files => passed on pinned SDK.',
            'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42952041778.',
            'flutter test ... => TODO':'flutter test --no-pub for high-quality ASR, resumable chunks and lyric inspector => passed in Actions 42952041778.',
            'TODO — record risks and unverified behavior.':'Evidence is not verified alignment or an audio/model identity; chunk indices are session-local, and older checkpoints lack it. Candidate dedup retains only one candidate per merged row. Cross-chunk duplicate detection, real-song and device validation remain undone.',
            'TODO: replace with the actual English imperative subject':'Record secondary ASR segment evidence',
          }.items():
              assert a in s, a
              s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Expose generated patch
        run: |
          git add -N docs/log/entries/2026-11-07-2047-record-secondary-asr-segments.md
          git diff --binary -- docs | gzip -c | base64 -w 0 > /tmp/patch.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/patch.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=PATCH{i//3000:03d}::{s[i:i+3000]}')
          PY

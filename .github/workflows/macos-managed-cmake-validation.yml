name: macOS managed CMake validation

on:
  pull_request:
    paths:
      - "macos/Podfile"
      - "macos/tool/managed_cmake.rb"
      - ".github/workflows/macos-managed-cmake-validation.yml"
  push:
    branches: [main]
    paths:
      - "macos/Podfile"
      - "macos/tool/managed_cmake.rb"
      - ".github/workflows/macos-managed-cmake-validation.yml"

jobs:
  macos-debug-build-without-system-cmake:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LYRIC_FORGE_FORCE_MANAGED_CMAKE: "1"
      LYRIC_FORGE_CMAKE_CACHE_ROOT: ${{ runner.temp }}/lyric-forge-cmake
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate Ruby syntax
        run: |
          ruby -c macos/tool/managed_cmake.rb
          ruby -c macos/Podfile
      - name: Build macOS debug with managed CMake fallback
        run: |
          rm -rf "$LYRIC_FORGE_CMAKE_CACHE_ROOT"
          flutter build macos --debug
      - name: Verify managed CMake and Pod injection
        run: |
          test -x "$LYRIC_FORGE_CMAKE_CACHE_ROOT/CMake.app/Contents/bin/cmake"
          "$LYRIC_FORGE_CMAKE_CACHE_ROOT/CMake.app/Contents/bin/cmake" --version
          grep -q "LyricForge managed CMake PATH" macos/Pods/Pods.xcodeproj/project.pbxproj

  flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

name: zz-format-probe
on:
  push:
    branches: ['arena/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: format
        shell: bash
        run: |
          BASE=7742df3882853483b2570d4e4f7dad68bd0c4191
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.dart')
          if (( ${#files[@]} == 0 )); then echo "::notice title=fmt-ok::no dart files"; exit 0; fi
          dart format "${files[@]}" > /dev/null
          if git diff --quiet -- "${files[@]}"; then
            echo "::notice title=fmt-ok::NO FORMAT DIFF (${#files[@]} files)"
          else
            i=0
            for f in $(git diff --name-only -- "${files[@]}"); do
              full=$(git --no-pager diff -U1 -- "$f" | sed ':a;N;$!ba;s/\n/\\n/g')
              for ((o=0; o<${#full} && o<14000; o+=3500)); do
                echo "::warning title=fmt $i.$o::${full:o:3500}"
              done
              i=$((i+1))
            done
          fi
          git checkout -- .
      - name: analyze
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/ana.txt 2>&1 || true
          echo "::notice title=ana-tail::$(tail -n 1 /tmp/ana.txt)"
          BASE=7742df3882853483b2570d4e4f7dad68bd0c4191
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'lib/*.dart' 'test/*.dart')
          { grep -E "^ *(error|warning) " /tmp/ana.txt || true; } | head -n 8 | while read -r l; do echo "::warning title=ana-ew::$l"; done
          for f in "${files[@]}"; do { grep -F "$f" /tmp/ana.txt || true; }; done | head -n 6 | while read -r l; do echo "::notice title=ana::$l"; done
      - name: test
        shell: bash
        run: |
          flutter test --no-pub -r expanded > /tmp/test.txt 2>&1 || true
          echo "::notice title=test-tail::$(tail -n 1 /tmp/test.txt | cut -c1-300)"
          { grep -E "\[E\]$" /tmp/test.txt || true; } | sed -E 's#^.*/lyric-forge-ktv/test/#test/#' | sort -u | head -n 30 > /tmp/err.txt
          full=$(sed ':a;N;$!ba;s/\n/\\n/g' /tmp/err.txt)
          for ((o=0; o<${#full} && o<7000; o+=3500)); do
            echo "::warning title=test-err $o::${full:o:3500}"
          done
          { grep -n -E "\[E\]$|Expected:|  Actual:|Which:|EXCEPTION CAUGHT|^The following|Error: |error: " /tmp/test.txt || true; } | head -n 120 > /tmp/fail.txt
          full=$(sed ':a;N;$!ba;s/\n/\\n/g' /tmp/fail.txt)
          for ((o=0; o<${#full} && o<21000; o+=3500)); do
            echo "::warning title=test-fail $o::${full:o:3500}"
          done
          { grep -n -A16 "EXCEPTION CAUGHT" /tmp/test.txt || true; } | head -n 100 > /tmp/exc.txt
          full=$(sed ':a;N;$!ba;s/\n/\\n/g' /tmp/exc.txt)
          for ((o=0; o<${#full} && o<14000; o+=3500)); do
            echo "::warning title=test-exc $o::${full:o:3500}"
          done

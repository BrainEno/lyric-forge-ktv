name: Temporary format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Report format diffs after pub get, like CI
        run: |
          flutter pub get --enforce-lockfile >/dev/null
          base=0b4c3375d275d9e34ce940ed53ad656cfcd1bce8
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.dart')
          n=0
          for f in "${files[@]}"; do
            cp "$f" /tmp/orig.dart
            dart format "$f" >/dev/null
            if ! diff -q /tmp/orig.dart "$f" >/dev/null; then
              d=$(git diff -- "$f" | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::warning title=fmt $n::$d"
              n=$((n+1))
            fi
          done
          if [ "$n" = 0 ]; then echo "::notice title=fmt-ok::NO FORMAT DIFF (${#files[@]} files)"; fi
          git checkout -- .
      - name: Report analyzer errors
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/analyze.txt 2>&1 || true
          grep -E "^ *(error|warning) " /tmp/analyze.txt | head -40 | while read -r line; do
            echo "::warning title=ana::$line"
          done
          tail -1 /tmp/analyze.txt | while read -r line; do echo "::notice title=ana-tail::$line"; done
      - name: Run changed and new tests
        run: |
          base=0b4c3375d275d9e34ce940ed53ad656cfcd1bce8
          mapfile -t tests < <(git diff --name-only --diff-filter=AM "$base" HEAD -- 'test/**_test.dart')
          if (( ${#tests[@]} == 0 )); then exit 0; fi
          flutter test --no-pub --reporter expanded "${tests[@]}" > /tmp/test.txt 2>&1 || true
          grep -E "\[E\]|Expected:|Actual:|Which:|EXCEPTION|══╡|^  [a-z].*\.dart [0-9]+:[0-9]+" /tmp/test.txt | head -60 | while read -r line; do
            echo "::warning title=test::$line"
          done
          tail -1 /tmp/test.txt | while read -r line; do echo "::notice title=test-tail::$line"; done

name: Temporary format probe

on:
  push:
    branches: [arena/abbb9c6e-lyric-forge-ktv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Report formatter diff as annotations
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM fb33769af1a8f28e4674054a3bf4aab33acc1443 HEAD -- '*.dart')
          dart format "${files[@]}" || true
          git --no-pager diff --unified=1 -- "${files[@]}" > fmt.diff || true
          python3 - <<'PY'
          d = open('fmt.diff', encoding='utf-8').read() or 'NO FORMAT DIFF'
          for i in range(0, min(len(d), 36000), 3500):
              c = d[i:i + 3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::warning title=fmt %d::%s' % (i // 3500, c))
          PY

name: zz probe (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: probe
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          mapfile -t tests < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- 'test/*_test.dart')
          flutter analyze --no-fatal-infos > ana.txt 2>&1
          { grep -E "error •|warning •" ana.txt || true; } > ana-bad.txt
          : > ana-touched.txt
          for f in "${files[@]}"; do { grep -F "$f:" ana.txt || true; } >> ana-touched.txt; done
          { grep -E "issues? found" ana.txt || true; } > ana-tail.txt
          flutter test --no-pub --reporter expanded "${tests[@]}" > test.txt 2>&1
          echo "exit $?" >> test.txt
          flutter test --no-pub > full.txt 2>&1
          echo "full exit $?" >> full.txt
          dart format "${files[@]}" > /dev/null
          git --no-pager diff -U1 -- "${files[@]}" > fmt.txt
          python3 - <<'PY'
          import re
          def emit(title, text, level="notice"):
              text = text.strip()
              if not text:
                  return
              chunks = [text[i:i+3500] for i in range(0, len(text), 3500)][:8]
              for n, c in enumerate(chunks):
                  c = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::{level} title={title} {n}::{c}")
          emit("fmt", open("fmt.txt").read() or "", "warning")
          if not open("fmt.txt").read().strip():
              print("::notice title=fmt-ok::clean")
          emit("ana-bad", open("ana-bad.txt").read(), "warning")
          emit("ana-touched", open("ana-touched.txt").read())
          emit("ana-tail", open("ana-tail.txt").read())
          t = open("test.txt").read()
          fails = []
          for m in re.finditer(r"══╡ EXCEPTION CAUGHT.*?(?=\n\n\S|\Z)", t, re.S):
              fails.append(m.group(0)[:1500])
          for line in t.splitlines():
              if re.search(r"\[E\]|Error:|error:|Expected:|Actual:|Which:|Failed to load", line):
                  fails.append(line[:400])
          emit("test-err", "\n".join(fails[:80]), "warning")
          emit("test-tail", "\n".join(t.splitlines()[-6:]))
          f = open("full.txt").read().splitlines()
          bad = [l for l in f if "[E]" in l][:60]
          emit("full-fail", "\n".join(bad), "warning")
          emit("full-tail", "\n".join(f[-4:]))
          PY

name: Temporary chunk evidence validation
on:
  push:
    branches: [arena/fda03db7-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM 4b32213fc51a7143520a64eb9b880f730170086e HEAD -- '*.dart')
          dart format "${files[@]}"
          git diff --binary -- "${files[@]}" | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=FORMAT%04d::%s\n", NR, $0}'
      - name: Analyze and targeted tests
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analysis.log 2>&1
          a=$?
          flutter test --no-pub --reporter expanded test/features/transcription/chunked_independent_asr_evidence_test.dart test/resumable_chunked_transcription_service_test.dart test/features/transcription/independent_asr_evidence_test.dart test/features/transcription/project_proofread_evidence_loader_test.dart test/high_quality_transcription_service_test.dart > /tmp/tests.log 2>&1
          t=$?
          printf '\nANALYZE_EXIT=%s TEST_EXIT=%s\n' "$a" "$t" >> /tmp/tests.log
          cat /tmp/analysis.log >> /tmp/tests.log
          gzip -c /tmp/tests.log | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=TESTLOG%04d::%s\n", NR, $0}'
          test "$a" = 0 && test "$t" = 0
      - name: Generate work log
        shell: bash
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 22:48' --slug capture-independent-chunk-evidence --title 'Capture independent ASR chunk evidence'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2248-capture-independent-chunk-evidence.md')
          p.write_text('''# [2026-11-07 22:48] Capture independent ASR chunk evidence

          - Scope: Capture complete, source-verified original dual-ASR snapshots for long-audio chunks without merging overlap or using them as current-draft consensus.
          - Files: Chunk evidence schema, resumable chunk service, domain and service regressions, handoff and log navigation.
          - Validation:
            - dart format changed Dart files in Actions 43186086748 => formatted; patch applied locally.
            - flutter analyze --no-fatal-infos in Actions 43186086748 => no errors or warnings; info diagnostics remain.
            - Focused chunk, single-input and high-quality transcription tests in Actions 43186086748 => 152 passed.
          - Notes: SHA and duration checks are point-in-time observations, not locks; checkpoint digests detect accidental corruption but are not signatures. Old or incomplete checkpoints cannot create evidence. No UI consumption, real recordings or real FFmpeg validation; #319 stays open.
          - Commit: `Document chunk evidence capture`
          ''')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2248-capture-independent-chunk-evidence.md
          git diff --binary -- docs/work_log.md docs/work_log_index.md docs/work_log_archive.md docs/log/entries/2026-11-07-2248-capture-independent-chunk-evidence.md | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=DOCS%04d::%s\n", NR, $0}'

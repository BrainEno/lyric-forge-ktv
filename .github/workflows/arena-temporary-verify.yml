name: Temporary ASR format verification
on:
  push:
    branches: [arena/1806f5be-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format using resolved language versions
        run: |
          git diff --name-only 7e9232ac8baaf259464057ad41b4fa4f24a5ba9b HEAD -- '*.dart' | xargs -r dart format
      - name: Return patch
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, subprocess
          patch = subprocess.check_output(['git','diff','--','*.dart'])
          data = base64.b64encode(gzip.compress(patch)).decode()
          for i in range(0, len(data), 60000): print(f'::notice::PATCH{i//60000:03d}:{data[i:i+60000]}')
          PY

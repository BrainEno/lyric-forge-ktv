name: Temporary KTV assembly validation
on:
  push:
    branches: [arena/c6a1709e-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/app/app_services.dart lib/app/ktv_recording_assembly.dart lib/features/player/data/services/local_ktv_recording_service.dart test/architecture/feature_dependency_graph_test.dart test/architecture/support/feature_dependency_baseline.dart test/app/ktv_recording_assembly_test.dart test/features/player/ktv_export_injected_ffmpeg_test.dart test/features/player/ktv_recording_storage_contract_test.dart test/features/player/ktv_take_operation_lock_test.dart test/support/ktv_export_fixture.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/app/ktv_recording_assembly_test.dart test/features/player/ktv_export_injected_ffmpeg_test.dart test/features/player/ktv_recording_storage_contract_test.dart test/features/player/ktv_take_operation_lock_test.dart test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/ktv-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/ktv-test.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/ktv-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+15]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/ktv-analyze.log || {
            grep -E 'error •|warning •|error -|warning -' /tmp/ktv-analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Generate work log
        if: success()
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:12' --slug decouple-ktv-settings --title 'Decouple KTV export from transcription settings'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2312-decouple-ktv-settings.md'
          s=open(p).read()
          s=s.replace('- Scope: TODO — describe the task purpose.', '- Scope: Remove player to transcription dependency by injecting the KTV FFmpeg setting at app assembly, preserving export and settings behavior.')
          s=s.replace('- Files: TODO — list changed files.', '- Files: KTV recording service and assembly, app services, dependency graph baseline and tests, KTV export tests and fixture, work-log navigation and handoff.')
          s=s.replace('  - dart format ... => TODO\n  - flutter analyze ... => TODO\n  - flutter test ... => TODO', '  - Pinned Flutter GitHub Actions run 43014094131 passed locked dependency install, dart format, focused KTV/architecture tests and flutter analyze --no-pub --no-fatal-infos lib test tool.\n  - Work-log write/check run separately; inspect final PR checks. Local Flutter/Dart unavailable.')
          s=s.replace('- Notes: TODO — record risks and unverified behavior.', '- Notes: Tests use real temporary files and persisted settings but a fake FFmpeg process; actual audio output, native hardware and platform-specific behavior were not validated. Other feature cycles remain.')
          s=s.replace('- Commit: `TODO: replace with the actual English imperative subject`', '- Commit: `Inject KTV FFmpeg settings through app assembly`')
          assert 'TODO' not in s
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          set -o pipefail
          dart tool/work_log.dart check 2>&1 | tee /tmp/logcheck.txt || {
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/logcheck.txt
            exit 1
          }
          git add -N docs/log/entries/2026-11-07-2312-decouple-ktv-settings.md
          git diff -- docs/log/entries/2026-11-07-2312-decouple-ktv-settings.md docs/work_log.md docs/work_log_index.md docs/work_log_archive.md > /tmp/log.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/log.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=LOG{i//3000}::{data[i:i+3000]}')
          PY

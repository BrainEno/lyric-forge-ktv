name: Temporary Phase 4.5 settings format probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase45-settings-format-probe.yml'
      - 'test/ci_workflow_contract_test.dart'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Apply exact pinned formatter
        run: dart format test/ci_workflow_contract_test.dart
      - name: Reproduce the changed-file format check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          echo "::notice title=format-base-sha::$BASE_SHA"
          echo "::notice title=format-github-sha::$GITHUB_SHA"
          echo "::notice title=format-file-count::${#dart_files[@]}"
          for file in "${dart_files[@]}"; do
            echo "::notice title=format-file::$file"
          done
          set +e
          output="$(dart format --output=none --set-exit-if-changed "${dart_files[@]}" 2>&1)"
          result=$?
          echo "::notice title=format-check-status::$result"
          echo "::notice title=format-check-output::$output"
          exit 0
      - name: Expose formatter output
        shell: bash
        run: |
          file=test/ci_workflow_contract_test.dart
          base64 -w0 "$file" > "$RUNNER_TEMP/payload"
          split -b 3500 -d -a 3 "$RUNNER_TEMP/payload" "$RUNNER_TEMP/format."
          for chunk in "$RUNNER_TEMP"/format.*; do
            echo "::notice title=format-source:${chunk##*.}::$(cat "$chunk")"
          done
          echo "::notice title=format-sha256::$(sha256sum "$file" | cut -d' ' -f1)"
      - name: Check CI workflow contract
        run: flutter test test/ci_workflow_contract_test.dart

name: Arena cancellation validation
on:
  push:
    branches: [arena/318d8095-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart
      - name: Focused cancellation tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/resumable_chunked_transcription_service_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:05' --slug chunk-cancellation-terminal --title 'Preserve chunk cancellation boundaries'
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2005-chunk-cancellation-terminal.md')
          s = p.read_text()
          print(s)
          replacements = {
              'Scope': 'Emit one wrapper-owned cancellation event for typed delegate cancellation and reject late chunk results after a cancellation request before checkpointing.',
              'Files': 'Resumable chunked transcription service and tests, handoff, this entry and generated work-log navigation.',
              'Validation': f"Local Flutter/Dart SDKs unavailable. Pinned GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed the focused chunk tests and full repository quality gate; Dart format and work-log new/write/check ran there. Final PR checks are reported separately. git diff --check ran locally.",
              'Notes': 'Short and chunked delegate cancellations preserve the original typed exception, with or without a child cancellation progress event. A late successful result after cancellation is not added to the manifest; earlier completed checkpoints remain reusable. Cancellation arriving after checkpoint writing has started is outside this boundary. Real ASR and native process cancellation remain unverified.',
              'Commit': '`fix: preserve chunk transcription cancellation boundaries`',
          }
          import re
          s = re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', s, flags=re.M)
          for key, value in replacements.items():
              s, count = re.subn(rf'^- {key}:.*$', f'- {key}: {value}', s, count=1, flags=re.M)
              if count != 1: raise RuntimeError(f'missing {key}')
          if 'TODO' in s: raise RuntimeError('unfilled TODO')
          p.write_text(s)
          Path('docs/handoff.md').write_text("# Handoff\n\n## 目标\n\n处理 #321 的分片转写取消进度与迟到结果边界；提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `68b6b08a61e364d75346c337a4a72d8bf8dfbad6`；分支 `arena/318d8095-lyric-forge-ktv`。\n- 最终提交、PR 状态和检查结果以 Git/GitHub 为准。\n\n## 已改文件\n\n- 分片转写服务、其定向测试、工作日志生成文件及本 handoff。\n\n## 检查结果\n\n- 本地没有 Flutter/Dart；固定 SDK 的 GitHub Actions run " + os.environ['GITHUB_RUN_ID'] + " 通过定向测试和完整质量门禁，并执行 format、work-log new/write/check。最终 PR head 检查结果以 Actions 为准。\n- 本地提交前执行 `git diff --check`。未进行 ASR 硬件实机测试。\n\n## 下一步\n\n确认最终 PR 的质量门禁并报告，保留 #321 供整体核验。\n\n## 已知风险\n\n- 测试使用替身进程和服务，不代表真实 Windows/macOS 进程、模型或设备的取消行为。\n- 在检查后已经开始写入检查点时发生取消，不由本切片保证回滚。\n\n最后更新：2026-11-07 20:05（Asia/Taipei）\n")
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          git add -N docs/log/entries/2026-11-07-2005-chunk-cancellation-terminal.md
          git diff --binary -- lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart docs > /tmp/arena.patch
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          chunks = [data[i:i+3000] for i in range(0,len(data),3000)]
          for i,c in enumerate(chunks): print(f'::notice title=arena-patch-{i:03}::{c}')
          PY
      - name: Publish failure details
        if: failure()
        shell: bash
        run: |
          for f in /tmp/focused.log /tmp/gate.log; do
            if [ -f "$f" ]; then
              { grep -nE '\[E\]|error •|warning •|Error:|Expected:|Actual:' "$f" | head -35 || true; tail -10 "$f"; } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            fi
          done

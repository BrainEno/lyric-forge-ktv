name: Regenerate app icons

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/icon.png'
      - 'tools/generate_app_icons.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade 'Pillow>=11,<13'

      - name: Generate platform icons
        run: python tools/generate_app_icons.py

      - name: Verify working tree
        run: git diff --check

      - name: Commit generated icons
        shell: bash
        run: |
          git add \
            android/app/src/main/res/mipmap-*/ic_launcher.png \
            ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png \
            macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png \
            windows/runner/resources/app_icon.ico \
            web/favicon.png \
            web/icons/*.png
          if git diff --cached --quiet; then
            echo 'Platform icons are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate platform app icons [skip ci]'
          git push origin HEAD:main

  verify-windows:
    needs: generate
    runs-on: windows-latest
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows debug app
        run: flutter build windows --debug

name: Arena accompaniment import validation
on:
  push:
    branches: [arena/7e83b65f-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: |
          dart format lib/app/screen_assembly.dart lib/features/project/data/services/file_project_accompaniment_importer.dart lib/features/project/domain/services/project_accompaniment_importer.dart lib/features/project/presentation/project_detail_dependencies.dart lib/features/project/presentation/screens/project_detail_screen.dart lib/features/player/domain/models/ktv_backing_mode.dart lib/features/player/presentation/widgets/ktv_entry_sheet.dart test/features/project/file_project_accompaniment_importer_test.dart test/features/project/presentation/project_detail_capability_test.dart test/features/player/ktv_entry_sheet_test.dart test/documentation_references_contract_test.dart
      - name: Focused accompaniment tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/project/file_project_accompaniment_importer_test.dart test/features/project/presentation/project_detail_capability_test.dart test/features/player/ktv_entry_sheet_test.dart test/features/player/ktv_backing_mode_test.dart test/file_project_repository_test.dart test/documentation_references_contract_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug import-project-accompaniment --title 'Import existing project accompaniment'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os,re
          from pathlib import Path
          stamp=os.environ['ENTRY_STAMP'];run=os.environ['GITHUB_RUN_ID']
          path=Path('docs/log/entries')/(stamp.replace(' ','-').replace(':','')+'-import-project-accompaniment.md')
          text=path.read_text()
          text=re.sub(r'^- Validation:\n(?:  - .*\n)+','- Validation: placeholder\n',text,flags=re.M)
          values={
            'Scope':'Let desktop users attach an existing accompaniment to a project for KTV without claiming automatic separation.',
            'Files':'Project accompaniment importer contract, file service, project detail assembly/UI, KTV copy, README/PRD, targeted service/widget/documentation tests, this entry, generated work-log navigation, index and handoff.',
            'Validation':f'Pinned Flutter GitHub Actions run {run} passed focused accompaniment, project, KTV and documentation tests and the full quality gate, with Dart format and work-log new/write/check. Local git diff --check passed; Flutter/Dart are unavailable locally. Final PR checks reported separately.',
            'Notes':'Desktop file picker copies an existing nonempty supported-extension file to app storage, with revision-conditional project update and replacement confirmation. File extension does not validate audio content or timing; no automatic separation or vocal import. The currently playing project must be switched away from before reopening to load its new audio asset. Old or failed-save copies are retained to avoid deleting files still referenced by an in-memory project; safe garbage collection remains future work. No native file picker, platform sandbox, audio playback or physical device checks performed. #320 remains open.',
            'Commit':'`feat: import existing project accompaniment`',
          }
          for k,v in values.items():
            text,n=re.subn(rf'^- {k}:.*$',f'- {k}: {v}',text,count=1,flags=re.M)
            if n!=1: raise RuntimeError(k)
          if 'TODO' in text: raise RuntimeError('unfilled TODO')
          path.write_text(text)
          idx=Path('docs/work_log_index.md');text=idx.read_text()
          old='- **Separation scope (#320):** README, PRD and project detail distinguish the desktop separation goal from current capabilities. External stem import and a separation backend remain unimplemented; referenced tracks still require accessible files.'
          new='- **Separation scope (#320):** desktop project details can copy and attach a user-supplied accompaniment; automatic separation, vocal import, alignment and managed-copy cleanup remain open. Referenced tracks still require accessible files; a currently playing project must be switched away from and reopened to load the new track.'
          assert old in text;text=text.replace(old,new);idx.write_text(text)
          Path('docs/handoff.md').write_text(f'''# Handoff\n\n## 目标\n\n为 #320 增加桌面工程已有伴奏导入，提交中文 PR；不自动合并或关闭 issue。\n\n## Git 现场\n\n- 基线 `f87819696348da8792bee03fd3a60604e43d364c`；分支 `arena/7e83b65f-lyric-forge-ktv`。最终提交与 PR 状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 工程详情 UI 与依赖、伴奏导入契约及文件服务、KTV 文案、README/PRD、相关测试、工作日志导航及本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart；固定 SDK GitHub Actions run {run} 通过定向和完整质量门禁，并执行 format、work-log new/write/check；最终 PR 检查以 Actions 为准。\n- 本地 `git diff --check`；未做原生文件选择、沙盒权限、设备音频或手动视觉检查。\n\n## 下一步\n\n确认最终 PR 检查并报告；后续评估安全清理无引用副本、当前播放会话刷新、人声轨导入和自动分离。\n\n## 已知风险\n\n- 只检查扩展名、文件存在和非空，不验证音频编码或伴奏是否与原曲时间一致。当前播放工程须先切换歌曲再重新打开工程播放器。\n- 旧副本和保存失败后的副本不自动删除，避免删除仍被内存工程引用的文件。跨进程写入无 CAS；后台识别和外部修改仍有竞争风险。\n- Media Hub 上传 deadline 测试曾间歇性 Broken pipe，未在本任务中修复。\n\n最后更新：{stamp}（Asia/Taipei）\n''')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-import-project-accompaniment.md"
          git diff --binary -- README.md docs lib/app/screen_assembly.dart lib/features/project lib/features/player/domain/models/ktv_backing_mode.dart lib/features/player/presentation/widgets/ktv_entry_sheet.dart test/features/project test/features/player/ktv_entry_sheet_test.dart test/documentation_references_contract_test.dart > /tmp/arena.patch
          python3 - <<'PY'
          import base64,gzip
          data=base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure diagnostic
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('/tmp/gate.log')
          if not p.exists(): p=Path('/tmp/focused.log')
          if p.exists():
            data=base64.b64encode(gzip.compress(p.read_bytes()[-80000:])).decode()
            for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

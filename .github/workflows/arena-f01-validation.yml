name: Temporary F01 validation
on:
  push:
    branches: [arena/cc41bdc1-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/lyrics/presentation/controllers/lyric_editor_document_controller.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Targeted tests
        run: flutter test --no-pub --reporter expanded test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart
      - name: Analyze
        if: always()
        run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:53' --slug guard-proofread-editor-state --title 'Guard proofreading against stale editor state'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2053-guard-proofread-editor-state.md'
          s=open(p).read().replace('TODO — describe the task purpose.', 'Discard V2 proposals built from an outdated in-memory lyric document and prevent overlapping V2 runs.')
          s=s.replace('TODO — list changed files.', 'Editor controller and screen, targeted tests, handoff, index, entry and generated work-log navigation.')
          s=s.replace('dart format ... => TODO', 'dart format changed Dart files with the pinned SDK => passed in Actions 42956931315.')
          s=s.replace('flutter analyze ... => TODO', 'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42956931315.')
          s=s.replace('flutter test ... => TODO', 'flutter test --no-pub for editor controller, screen, V2 dialog and forced alignment service => passed in Actions 42956931315.')
          s=s.replace('TODO — record risks and unverified behavior.', 'Only V2 is guarded; other async editor operations need separate audit. Native work is not cancelled. Final timeline-conflict confirmation race, real devices and accessibility remain unverified; no real-song accuracy claim.')
          s=s.replace('TODO: replace with the actual English imperative subject', 'Guard proofreading against stale editor state')
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2053-guard-proofread-editor-state.md
          git diff -- docs > /tmp/log.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/log.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=LOG{i//3000}::{data[i:i+3000]}')
          PY

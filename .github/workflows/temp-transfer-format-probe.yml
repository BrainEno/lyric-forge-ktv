name: Temporary transfer formatting probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Format changed Dart files and report patch chunks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          dart format "${dart_files[@]}"
          git diff --binary > /tmp/formatter.patch
          if [[ ! -s /tmp/formatter.patch ]]; then
            echo 'No formatter patch generated.'
            exit 0
          fi
          base64 -w0 /tmp/formatter.patch | fold -w 5000 | awk '{ printf "::notice title=FORMAT_PATCH_%03d::%s\n", NR, $0 }'

name: macOS network entitlements validation

on:
  pull_request:
    paths:
      - "macos/Runner/DebugProfile.entitlements"
      - "macos/Runner/Release.entitlements"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - ".github/workflows/macos-network-entitlements-validation.yml"
  push:
    branches: [main]
    paths:
      - "macos/Runner/DebugProfile.entitlements"
      - "macos/Runner/Release.entitlements"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - ".github/workflows/macos-network-entitlements-validation.yml"

jobs:
  validate-signed-network-entitlements:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Validate entitlement source plists
        shell: bash
        run: |
          set -euo pipefail
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            plutil -lint "$file"
            value=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$file")
            test "$value" = "true"
          done
      - name: Build and inspect debug app entitlements
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --debug
          app="build/macos/Build/Products/Debug/Elysium Player.app"
          test -d "$app"
          codesign -d --entitlements :- "$app" > /tmp/debug-entitlements.plist
          plutil -lint /tmp/debug-entitlements.plist
          value=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' /tmp/debug-entitlements.plist)
          test "$value" = "true"
      - name: Build and inspect release app entitlements
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release
          app="build/macos/Build/Products/Release/Elysium Player.app"
          test -d "$app"
          codesign -d --entitlements :- "$app" > /tmp/release-entitlements.plist
          plutil -lint /tmp/release-entitlements.plist
          value=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' /tmp/release-entitlements.plist)
          test "$value" = "true"

  flutter-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

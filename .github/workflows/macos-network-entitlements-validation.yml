name: macOS network entitlements validation

on:
  pull_request:
    paths:
      - "macos/Runner/DebugProfile.entitlements"
      - "macos/Runner/Release.entitlements"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/macos-network-entitlements-validation.yml"
  push:
    branches: [main]
    paths:
      - "macos/Runner/DebugProfile.entitlements"
      - "macos/Runner/Release.entitlements"
      - "macos/Runner.xcodeproj/project.pbxproj"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/macos-network-entitlements-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-signed-network-entitlements:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Validate entitlement source plists
        shell: bash
        run: |
          set -euo pipefail
          for file in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            plutil -lint "$file"
            for entitlement in com.apple.security.network.client com.apple.security.network.server; do
              value=$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$file")
              test "$value" = "true"
            done
          done
      - name: Build and inspect debug app entitlements
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --debug
          app="build/macos/Build/Products/Debug/Elysium Player.app"
          test -d "$app"
          codesign -d --entitlements :- "$app" > /tmp/debug-entitlements.plist
          plutil -lint /tmp/debug-entitlements.plist
          for entitlement in com.apple.security.network.client com.apple.security.network.server; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$entitlement" /tmp/debug-entitlements.plist)
            test "$value" = "true"
          done
      - name: Build and inspect release app entitlements
        shell: bash
        run: |
          set -euo pipefail
          flutter build macos --release
          app="build/macos/Build/Products/Release/Elysium Player.app"
          test -d "$app"
          codesign -d --entitlements :- "$app" > /tmp/release-entitlements.plist
          plutil -lint /tmp/release-entitlements.plist
          for entitlement in com.apple.security.network.client com.apple.security.network.server; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$entitlement" /tmp/release-entitlements.plist)
            test "$value" = "true"
          done

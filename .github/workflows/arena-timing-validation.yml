name: Temporary fusion timing validation
on:
  push:
    branches: [arena/e0a7c405-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/transcription/domain/models/fusion_timing_evidence.dart lib/features/transcription/data/services/high_quality_transcription_service.dart lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/features/transcription/domain/models/fusion_timing_evidence_test.dart test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Targeted tests
        run: flutter test --no-pub --reporter expanded test/features/transcription/domain/models/fusion_timing_evidence_test.dart test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart test/architecture_layer_imports_contract_test.dart
      - name: Analyze
        if: always()
        run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:54' --slug record-fusion-timing-evidence --title 'Record fusion timing text provenance'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2054-record-fusion-timing-evidence.md'
          s=open(p).read().replace('TODO — describe the task purpose.', 'Record fusion text/timing snapshots and mark changed or secondary-only rows for future realignment without changing recognition or playback policy.')
          s=s.replace('TODO — list changed files.', 'Fusion timing evidence contract, high-quality and chunked services, targeted tests, ASR baseline documentation, handoff, index, entry and generated work-log navigation.')
          s=s.replace('dart format ... => TODO', 'dart format changed Dart files using pinned SDK => passed in Actions 42976781024.')
          s=s.replace('flutter analyze ... => TODO', 'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42976781024.')
          s=s.replace('flutter test ... => TODO', 'flutter test --no-pub for timing evidence, fusion, chunks, lyric inspector and architecture contracts => passed in Actions 42976781024.')
          s=s.replace('TODO — record risks and unverified behavior.', 'Snapshots are not proof of alignment or audio/model identity; alignedTextHash is unknown, old/degraded evidence may be missing, and false means no fusion-specific flag rather than verified. No UI, automatic realignment, real-song accuracy or device validation.')
          s=s.replace('TODO: replace with the actual English imperative subject', 'Record fusion timing text provenance')
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2054-record-fusion-timing-evidence.md
          git diff -- docs > /tmp/log.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/log.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=LOG{i//3000}::{data[i:i+3000]}')
          PY

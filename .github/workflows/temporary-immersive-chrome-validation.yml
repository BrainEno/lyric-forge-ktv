name: Temporary immersive chrome validation

on:
  push:
    branches:
      - arena/65be4adb-lyric-forge-ktv

permissions:
  contents: write

env:
  VALIDATION_RUN_ID: ${{ github.run_id }}
  VALIDATION_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t dart_files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} )); then
            dart format "${dart_files[@]}"
          fi
      - name: Test immersive chrome lifecycle regression
        run: flutter test test/features/player/presentation/screens/immersive_ktv_recording_test.dart
      - name: Prepare bug-fix work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          dart tool/work_log.dart new --timestamp "$stamp" --slug defer-immersive-chrome-notifications --title "Defer immersive chrome notifications"
          python3 - "$stamp" "$VALIDATION_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id = sys.argv[1:]
          matches = list(Path('docs/log/entries').glob('*-defer-immersive-chrome-notifications.md'))
          if not matches:
              raise SystemExit('work-log entry was not created')
          path = max(matches, key=lambda item: item.name)
          path.write_text(textwrap.dedent(f'''\
          # [{stamp}] Defer immersive chrome notifications

          - Scope: Fix the KTV screen lifecycle assertion where `AppChromeController.enterImmersive()` notified the app-level `ValueListenableBuilder` from `ImmersiveKtvScreen.initState`; defer both enter and exit notifications until after the frame and guard a pending enter if the screen is disposed first.
          - Files: `lib/features/player/presentation/screens/immersive_ktv_screen.dart`, `test/features/player/presentation/screens/immersive_ktv_recording_test.dart`, `docs/work_log_index.md`, `docs/handoff.md`, and generated work-log navigation files.
          - Validation:
            - `dart format` on changed Dart files => passed.
            - `flutter test test/features/player/presentation/screens/immersive_ktv_recording_test.dart` => passed, including ancestor-listener enter/exit regression.
            - `bash scripts/quality_gate.sh --skip-pub-get` => passed (analyzer, full test suite, work-log preflight; CI run {run_id}).
            - `dart tool/work_log.dart write` and `dart tool/work_log.dart check` => passed.
          - Notes: App chrome remains hidden during the immersive route and restored on exit, but changes no longer synchronously dirty an ancestor during mount/unmount. No lyric editing, playback, recording, or recognition semantics changed; no physical-device result is claimed.
          - Commit: `fix: defer immersive chrome notifications until frame end`
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Run full quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/immersive-chrome-quality.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            tail -100 build/immersive-chrome-quality.log | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit "$status"
          fi
      - name: Finalize handoff and validate generated logs
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          python3 - "$stamp" "$VALIDATION_RUN_ID" "$VALIDATION_SHA" <<'PY'
          from pathlib import Path
          import sys
          import textwrap

          stamp, run_id, sha = sys.argv[1:]
          Path('docs/handoff.md').write_text(textwrap.dedent(f'''\
          # Handoff

          ## 目标

          修复全屏 KTV 首次挂载与退出时同步更改 app-level chrome notifier 导致的 `setState() or markNeedsBuild() called during build` / widget-tree-locked 错误。

          ## Git 现场

          - Repository: `BrainEno/lyric-forge-ktv`
          - 活动分支：`arena/65be4adb-lyric-forge-ktv`（active）。
          - 基线：`8648e8b`；已验证实现提交：`{sha}`。
          - 工作区由验证 workflow 收尾并清除临时 workflow；PR 尚未创建。

          ## 已改文件

          - `lib/features/player/presentation/screens/immersive_ktv_screen.dart`：进入/退出 chrome 状态改为 post-frame 通知，进入回调检查 `mounted`。
          - `test/features/player/presentation/screens/immersive_ktv_recording_test.dart`：模拟祖先 `ValueListenableBuilder`，验证挂载与卸载均无异常且 chrome 状态最终正确。
          - `docs/work_log_index.md`、本文件及本次 bug-fix work-log entry。

          ## 检查结果

          - `dart format`、定向 `immersive_ktv_recording_test.dart` 与完整 `bash scripts/quality_gate.sh --skip-pub-get` 均通过（CI run `{run_id}`）。
          - work-log `write/check` 通过。
          - 真实 Windows 手测未运行；用户提供的 stack 已由 widget regression 在 Flutter CI 中复现其 ancestor-listener 生命周期条件。

          ## 下一步

          1. 创建 PR；待最终 head 的 Flutter Quality Gate 通过后再合并。用户可在 Windows 再试单句编辑，确认不再出现该异常。

          ## 已知风险

          - 本地无 Flutter/Dart SDK，所有格式、测试及分析结果依赖固定工具链 CI。
          - chrome 状态在屏幕挂载/卸载所在帧结束时更新；测试验证最终状态，但未做真机视觉闪烁评估。
          - 未改歌词文本编辑或识别逻辑；没有主张真实歌曲/设备验证。

          最后更新：{stamp}（Asia/Taipei）
          '''), encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Remove temporary workflow and push validated tree
        run: |
          rm .github/workflows/temporary-immersive-chrome-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record immersive chrome fix validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"

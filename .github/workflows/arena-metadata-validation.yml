name: Arena metadata safety validation
on:
  push:
    branches: [arena/7a8e0888-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/player/data/repositories/file_local_media_metadata_repository.dart test/file_local_media_metadata_repository_test.dart test/local_media_metadata_playback_test.dart
      - name: Focused metadata and playback tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/file_local_media_metadata_repository_test.dart test/local_media_metadata_playback_test.dart test/features/player/playback_lyrics_read_failure_test.dart test/core/persistence/atomic_json_file_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug protect-partial-metadata-store --title 'Protect partial media metadata stores'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os, re
          from pathlib import Path
          stamp = os.environ['ENTRY_STAMP']
          path = Path('docs/log/entries') / (stamp.replace(' ', '-').replace(':', '') + '-protect-partial-metadata-store.md')
          s = path.read_text()
          s = re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', s, flags=re.M)
          replacements = {
              'Scope': 'Prevent partial local media metadata snapshots from replacing the original store after malformed records or incomplete reads, while keeping readable records available for normal playback.',
              'Files': 'FileLocalMediaMetadataRepository, metadata repository and playback regression tests, index, handoff, this entry and generated work-log navigation.',
              'Validation': f"Local Flutter/Dart SDKs unavailable. Pinned GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused metadata, playback, lyric-resolution and atomic-persistence tests and the full repository quality gate; Dart format and work-log new/write/check ran there. An earlier full gate in run 42378371701 failed the Media Hub upload deadline test; final PR checks are reported separately. git diff --check ran locally.",
              'Notes': 'Valid records remain readable; all metadata saves and deletions fail before mutation after an incomplete load. Tests cover malformed rows, legacy data, original and backup preservation, repair with a new repository and playback via a fake audio backend. A partial read can still be mistaken for an authoritative absence by lyric resolution; other processes can change a successfully loaded store; cached failed loads need a new repository. Native playback was not verified.',
              'Commit': '`fix: protect partial media metadata stores`',
          }
          for key, value in replacements.items():
              s, count = re.subn(rf'^- {key}:.*$', f'- {key}: {value}', s, count=1, flags=re.M)
              if count != 1: raise RuntimeError(f'missing {key}')
          if 'TODO' in s: raise RuntimeError('unfilled TODO')
          path.write_text(s)
          idx = Path('docs/work_log_index.md')
          text = idx.read_text()
          old = '- Playback lyric resolution now fails closed on propagated project/metadata read errors; repository implementations that silently skip malformed records can still hide data. Failed initial file-store loads remain cached until restart; link writes have no compare-and-swap protection.'
          new = '- Playback lyric resolution fails closed on propagated read errors. Media metadata stores now block writes after partial loads, but readable partial results can still mislead lyric resolution; other stores may skip malformed records. Failed initial loads remain cached until restart, and link writes lack compare-and-swap protection.'
          if old not in text: raise RuntimeError('expected follow-up missing')
          idx.write_text(text.replace(old, new))
          Path('docs/handoff.md').write_text(f"""# Handoff\n\n## 目标\n\n处理 #223 的媒体元数据持久化安全缺口，阻止损坏记录被不完整快照覆盖；提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `dcf31c2490dfd843a772e5eba303008f6fbe2dbb`；分支 `arena/7a8e0888-lyric-forge-ktv`。\n- 最终提交、PR 和检查状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 文件媒体元数据仓库、仓库和播放回归测试、工作日志及本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart；固定 SDK 的 GitHub Actions run {os.environ['GITHUB_RUN_ID']} 通过定向测试及完整质量门禁，并执行 format、work-log new/write/check。首次完整门禁 run 42378371701 在 Media Hub 上传 deadline 测试失败；最终 head 的检查以 Actions 为准。\n- 本地提交前执行 `git diff --check`；未进行原生设备播放测试。\n\n## 下一步\n\n确认 PR 最终质量门禁并报告；#223 其余测试覆盖缺口继续保留。\n\n## 已知风险\n\n- 不完整读取仍可返回有效记录，歌词解析可能误认为缺少关联；本切片只防止不完整快照写回。\n- 其他进程修改已加载的文件、其他仓库的损坏记录、仓库实例缓存失败均不在本次范围。\n\n最后更新：{stamp}（Asia/Taipei）\n""")
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-protect-partial-metadata-store.md"
          git diff --binary -- lib/features/player/data/repositories/file_local_media_metadata_repository.dart test/file_local_media_metadata_repository_test.dart test/local_media_metadata_playback_test.dart docs > /tmp/arena.patch
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure log
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          p = Path('/tmp/gate.log')
          if not p.exists(): p = Path('/tmp/focused.log')
          if p.exists():
              data = base64.b64encode(gzip.compress(p.read_bytes()[-100000:])).decode()
              for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

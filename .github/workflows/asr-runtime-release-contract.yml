name: ASR runtime release contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-asr-runtime.yml'
      - '.github/workflows/asr-runtime-release-contract.yml'
      - 'test/asr_runtime_release_workflow_contract_test.dart'
  workflow_dispatch:

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate partial release contract
        run: flutter test test/asr_runtime_release_workflow_contract_test.dart

name: Temporary project resource check
on:
  push:
    branches: [arena/95dd575f-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/app/app_services.dart lib/app/screen_assembly.dart lib/features/transcription/data/services/local_project_transcription_workflow.dart lib/features/transcription/data/services/file_batch_transcription_queue.dart test/architecture/workflow_screen_injection_contract_test.dart test/features/transcription/local_project_transcription_cancellation_test.dart test/file_batch_transcription_queue_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:51' --slug coordinate-project-asr --title 'Coordinate project transcription resources'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2351-coordinate-project-asr.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2351-coordinate-project-asr.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PYCODE'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PYCODE

name: Temporary queue busy check
on:
  push:
    branches: [arena/a921db9c-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and publish patch
        run: |
          dart format lib/features/transcription/data/services/file_batch_transcription_queue.dart lib/features/transcription/domain/models/transcription_queue_models.dart lib/features/transcription/presentation/widgets/transcription_queue_panel.dart test/file_batch_transcription_queue_test.dart test/features/transcription/transcription_queue_busy_panel_test.dart
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PY'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PY
      - name: Targeted tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/file_batch_transcription_queue_test.dart test/features/transcription/transcription_queue_busy_panel_test.dart test/features/transcription/transcription_queue_environment_recovery_test.dart test/features/transcription/transcription_queue_protective_pause_contract_test.dart 2>&1 | tee /tmp/test.log || { python3 - <<'PY'
          s = open('/tmp/test.log').read()
          for line in s.splitlines():
              if '[E]' in line or line.startswith(('Expected:', '  Actual:', 'Which:', '══╡', 'Test failed.', 'EXCEPTION', 'The following')):
                  print('::error::' + line.replace('%', '%25'))
          PY
          exit 1; }
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test tool

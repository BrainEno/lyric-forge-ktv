name: Temporary queue busy check
on:
  push:
    branches: [arena/a921db9c-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/file_batch_transcription_queue.dart lib/features/transcription/domain/models/transcription_queue_models.dart lib/features/transcription/presentation/widgets/transcription_queue_panel.dart test/file_batch_transcription_queue_test.dart test/features/transcription/transcription_queue_busy_panel_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:52' --slug protect-busy-transcription-queue --title 'Protect transcription queue when resources are busy'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2352-protect-busy-transcription-queue.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2352-protect-busy-transcription-queue.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PYCODE'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PYCODE

name: Temporary chunk check
on:
  push:
    branches: [arena/d63d3594-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and publish patch
        run: |
          dart format lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PY'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PY
      - name: Targeted tests
        run: flutter test --no-pub test/resumable_chunked_transcription_service_test.dart test/high_quality_transcription_service_test.dart
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test tool

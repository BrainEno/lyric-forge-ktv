name: Temporary chunk check
on:
  push:
    branches: [arena/d63d3594-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:56' --slug preserve-chunked-lyric-repeats --title 'Preserve repeated lyrics when merging chunks'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2356-preserve-chunked-lyric-repeats.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2356-preserve-chunked-lyric-repeats.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PY'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PY

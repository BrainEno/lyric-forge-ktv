name: Temporary candidate comparison worklog
on:
  push:
    branches: [arena/d364ab96-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-07 23:20" --slug compare-asr-candidates --title "Compare ASR candidate versions"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2320-compare-asr-candidates.md')
          s = p.read_text()
          s = s.replace('TODO — describe the task purpose.', 'Show differences between existing dual-ASR candidates and allow restoring the original primary candidate without changing timing.')
          s = s.replace('TODO — list changed files.', 'Lyric inspector, inspector widget tests, open-issue/product follow-up, handoff, index, this entry and generated work-log navigation.')
          s = s.replace('  - dart format ... => TODO', '  - Pinned Flutter Actions run 42630271940: formatted changed Dart files after flutter pub get.')
          s = s.replace('  - flutter analyze ... => TODO', '  - Pinned Flutter Actions run 42630271940: flutter analyze --no-pub --no-fatal-infos lib test tool passed. Initial run 42629987426 had an unnecessary non-null assertion warning, which was removed.')
          s = s.replace('  - flutter test ... => TODO', '  - Pinned Flutter Actions run 42630271940: lyric inspector widget and character diff service tests passed. Local Flutter/Dart unavailable; final PR checks reported separately.')
          s = s.replace('TODO — record risks and unverified behavior.', 'Candidate data can be absent, incomplete or wrong; legacy data without a known original is compared with current edits. No independent model rerun, full version comparison, automatic correction, real-song accuracy or manual device/UI validation in this phase. See the follow-up plan for open issues and next steps.')
          s = s.replace('TODO: replace with the actual English imperative subject', 'Compare both ASR candidates in the inspector')
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return generated patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2320-compare-asr-candidates.md || true
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 60000): print(f'::notice::PATCH{i//60000:03d}:{data[i:i+60000]}')
          PY

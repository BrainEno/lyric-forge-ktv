name: Temporary candidate comparison verification
on:
  push:
    branches: [arena/d364ab96-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: git diff --name-only 76fbbd3bea4d1bcff4c20d07e21db1736f2011f4 HEAD -- '*.dart' | xargs -r dart format
      - name: Test inspector and diff service
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart test/features/lyrics/domain/services/character_diff_service_test.dart 2>&1 | tee /tmp/candidate-test.log
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/candidate-analyze.log
      - name: Return patch and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','*.dart']))).decode()
          for i in range(0, len(data), 60000): print(f'::notice::PATCH{i//60000:03d}:{data[i:i+60000]}')
          for path in ['/tmp/candidate-test.log','/tmp/candidate-analyze.log']:
              try:
                  lines = open(path).read().splitlines()
                  hits = [i for i,x in enumerate(lines) if '[E]' in x or 'Error:' in x or 'error •' in x or 'warning •' in x or 'Some tests failed' in x or 'EXCEPTION CAUGHT' in x]
                  for i in hits[:4]:
                      for line in lines[max(0,i-2):min(len(lines),i+10)]: print('::error::' + line[:900])
              except FileNotFoundError: pass
          PY

# TEMPORARY (issue #415): reproduce the Windows session-auth test failure
# without CUDA and republish cargo output as annotations, because the
# authoring sandbox cannot download job logs. Deleted before merge.
name: TEMP Windows session-auth diagnostics

on:
  push:
    branches: [arena/12673259-lyric-forge-ktv]
    paths: [.github/workflows/tmp-windows-session-auth.yml, tool/patches/**]

permissions:
  contents: read

env:
  QWEN_REPO: https://github.com/lumosimmo/qwen3-asr-rs.git
  QWEN_REV: 7984967e8701cc90bb17d06453901036e36ca578

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch and patch runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone -q "$QWEN_REPO" qwen-runtime-src
          cd qwen-runtime-src
          git checkout -q "$QWEN_REV"
          git apply ../tool/patches/qwen3-asr-eager-attention-contiguous.patch
          git apply ../tool/patches/qwen3-asr-forced-align-http-endpoint.patch
          python ../tool/patches/apply-qwen-align-route.py
          git apply --check ../tool/patches/qwen3-asr-session-auth.patch
          git apply ../tool/patches/qwen3-asr-session-auth.patch
      - name: Run session-auth tests and report
        shell: bash
        run: |
          set +e +o pipefail
          cd qwen-runtime-src
          emit() {
            level=$1; title=$2; file=$3
            [[ -s "$file" ]] || return 0
            split -l 30 "$file" "$file.part."
            for part in "$file".part.*; do
              body=$(sed -e 's/%/%25/g' -e 's/\r//g' "$part" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::${level} title=${title}::${body}"
            done
          }
          run() {
            name=$1; shift
            "$@" > "../$name.log" 2>&1
            code=$?
            echo "::notice title=${name}::exit ${code}"
            grep -E "^test |test result|panicked|FAILED|failures|Error|error(\[|:)|warning: unused|---- |bail|did not|refused|denied|os error" "../$name.log" | grep -v "Compiling" | tail -n 150 > "../$name.sum"
            if [[ $code -ne 0 ]]; then emit error "$name" "../$name.sum"; else emit notice "$name" "../$name.sum"; fi
            tail -n 40 "../$name.log" > "../$name.tail"
            [[ $code -ne 0 ]] && emit warning "$name-tail" "../$name.tail"
            return 0
          }
          run unit cargo test --release -p qwen3_asr_cli --bin qwen3-asr session_auth
          run integration cargo test --release -p qwen3_asr_cli --test session_auth_integration -- --test-threads=1
          run integration-parallel cargo test --release -p qwen3_asr_cli --test session_auth_integration

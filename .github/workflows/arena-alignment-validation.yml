name: Temporary reference alignment validation
on:
  push:
    branches: [arena/e784ef9f-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/lyrics/domain/proofreading/apply_reference_alignment_use_case.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart test/features/lyrics/domain/proofreading/apply_reference_alignment_use_case_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/apply_reference_alignment_use_case_test.dart test/features/lyrics/domain/proofreading/run_reference_proofread_use_case_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/features/lyrics/domain/services/reference_alignment_applier_test.dart test/features/lyrics/domain/services/reference_alignment_provenance_builder_test.dart test/features/lyrics/domain/services/reference_alignment_restore_service_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/reference_alignment_review_test.dart test/features/lyrics/presentation/widgets/reference_alignment_backup_restore_test.dart test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/alignment-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/alignment-test.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/alignment-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+14]: print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/alignment-analyze.log || {
            grep -E 'error •|warning •|error -|warning -' /tmp/alignment-analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:57' --slug extract-reference-alignment --title 'Extract reference alignment application workflow'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2057-extract-reference-alignment.md')
          s=p.read_text()
          replacements={
           'TODO — describe the task purpose.':'Extract reference alignment preparation, protection, application, backup and provenance from the editor (partial #323).',
           'TODO — list changed files.':'Reference alignment use case, editor screen, domain and widget regression tests, handoff and work-log navigation.',
           'dart format ... => TODO':'dart format changed Dart files with pinned SDK => passed in Actions 43048158770.',
           'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 43048158770.',
           'flutter test ... => TODO':'flutter test --no-pub targeted alignment, proofreading, backup, editor and architecture tests => passed in Actions 43048158770.',
           'TODO — record risks and unverified behavior.':'#323 remains open: editor size, entry-point lengths and complete UX audit remain. Caller retains revision checks and timeline confirmation. No real device, native picker, audio, screen reader or song quality checks.',
           'TODO: replace with the actual English imperative subject':'Extract reference alignment application workflow',
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2057-extract-reference-alignment.md
          git diff -- docs > /tmp/worklog.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/worklog.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=WORKLOG{i//3000}::{data[i:i+3000]}')
          PY

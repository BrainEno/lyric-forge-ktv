name: Apply KTV history UI patch

on:
  push:
    branches: [feat/ktv-history-resolved-storage-ui]
    paths:
      - .github/workflows/apply-ktv-history-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded player history patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/screens/player_screen.dart')
          text = path.read_text()

          delete_start = text.index('  Future<void> _confirmDeleteTake(KtvRecordingSession take) async {')
          history_start = text.index('  Future<void> _openTakeHistory() async {', delete_start)
          delete_block = text[delete_start:history_start]
          if 'Directory(projectDirectory), _project.id, take' not in delete_block:
              raise SystemExit('delete method no longer has expected legacy directory call')

          new_delete = '\n'.join([
              '  Future<void> _confirmDeleteTake(KtvRecordingSession take) async {',
              '    final confirmed = await showDialog<bool>(',
              '      context: context,',
              '      builder: (context) => AlertDialog(',
              "        title: const Text('永久删除这次演唱录音？'),",
              "        content: const Text('将删除本次录音的人声、混音和记录文件，无法撤销。其他录音不受影响。'),",
              '        actions: [',
              '          TextButton(',
              '            onPressed: () => Navigator.pop(context, false),',
              "            child: const Text('取消'),",
              '          ),',
              '          FilledButton(',
              '            onPressed: () => Navigator.pop(context, true),',
              "            child: const Text('确认永久删除'),",
              '          ),',
              '        ],',
              '      ),',
              '    );',
              '    if (confirmed != true || !mounted) return;',
              '    try {',
              '      await const KtvTakeHistoryStore().deleteProjectTake(_project, take);',
              '      if (!mounted) return;',
              '      ScaffoldMessenger.of(context).showSnackBar(',
              "        const SnackBar(content: Text('演唱录音已删除')),",
              '      );',
              '      await _openTakeHistory();',
              '    } catch (error) {',
              '      if (!mounted) return;',
              '      ScaffoldMessenger.of(context).showSnackBar(',
              "        SnackBar(content: Text('删除失败：$error')),",
              '      );',
              '    }',
              '  }',
              '',
          ])

          sheet_start = text.index('    await showModalBottomSheet<void>(', history_start)
          legacy_history_prefix = text[history_start:sheet_start]
          if 'final projectDirectory = _project.projectDirectory;' not in legacy_history_prefix:
              raise SystemExit('history method no longer has expected legacy directory gate')

          new_history_prefix = '\n'.join([
              '  Future<void> _openTakeHistory() async {',
              '    if (_recordingService.currentState.isRecording) return;',
              '',
              '    KtvTakeHistoryScanResult scan;',
              '    try {',
              '      scan = await const KtvTakeHistoryStore().scanProject(_project);',
              '    } catch (error) {',
              '      if (!mounted) return;',
              '      ScaffoldMessenger.of(context).showSnackBar(',
              "        SnackBar(content: Text('读取演唱历史失败：$error')),",
              '      );',
              '      return;',
              '    }',
              '    if (!mounted) return;',
              '',
              '    if (scan.recoveredCount > 0) {',
              '      final count = scan.recoveredCount;',
              '      ScaffoldMessenger.of(context).showSnackBar(',
              '        SnackBar(',
              '          content: Text(',
              "            '已恢复 $count 次中断录音，原始人声已保留；自动混音已停用',",
              '          ),',
              '        ),',
              '      );',
              '    }',
              '',
              '    final takes = scan.takes;',
          ]) + '\n'

          text = text[:delete_start] + new_delete + new_history_prefix + text[sheet_start:]
          path.write_text(text)
          PY
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/player/presentation/screens/player_screen.dart
          git commit -m "Use resolved storage for KTV history UI"
          git push

name: Transcription queue protective pause validation

on:
  pull_request:
    paths:
      - "lib/features/transcription/domain/models/transcription_models.dart"
      - "lib/features/transcription/domain/models/transcription_queue_models.dart"
      - "lib/features/transcription/data/services/file_batch_transcription_queue.dart"
      - "lib/features/transcription/data/services/local_project_transcription_workflow.dart"
      - "lib/features/transcription/data/services/storage_preflight_asr_runtime_manager.dart"
      - "lib/features/transcription/presentation/widgets/transcription_queue_panel.dart"
      - "test/file_batch_transcription_queue_test.dart"
      - "test/features/transcription/transcription_queue_protective_pause_contract_test.dart"
      - ".github/workflows/transcription-queue-protective-pause-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/features/transcription/domain/models/transcription_models.dart"
      - "lib/features/transcription/domain/models/transcription_queue_models.dart"
      - "lib/features/transcription/data/services/file_batch_transcription_queue.dart"
      - "lib/features/transcription/data/services/local_project_transcription_workflow.dart"
      - "lib/features/transcription/data/services/storage_preflight_asr_runtime_manager.dart"
      - "lib/features/transcription/presentation/widgets/transcription_queue_panel.dart"
      - "test/file_batch_transcription_queue_test.dart"
      - "test/features/transcription/transcription_queue_protective_pause_contract_test.dart"
      - ".github/workflows/transcription-queue-protective-pause-validation.yml"

jobs:
  protective-pause:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze protective pause changes
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/transcription/domain/models/transcription_models.dart
          lib/features/transcription/domain/models/transcription_queue_models.dart
          lib/features/transcription/data/services/file_batch_transcription_queue.dart
          lib/features/transcription/data/services/local_project_transcription_workflow.dart
          lib/features/transcription/data/services/storage_preflight_asr_runtime_manager.dart
          lib/features/transcription/presentation/widgets/transcription_queue_panel.dart
          test/file_batch_transcription_queue_test.dart
          test/features/transcription/transcription_queue_protective_pause_contract_test.dart
      - name: Test protective queue behavior
        run: >-
          flutter test
          test/file_batch_transcription_queue_test.dart
          test/features/transcription/transcription_queue_protective_pause_contract_test.dart
      - name: Full Flutter regression suite
        run: flutter test

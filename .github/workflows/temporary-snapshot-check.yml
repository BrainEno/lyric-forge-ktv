name: Temporary snapshot validation
on:
  push:
    branches: [arena/3e595ed4-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM 5c1f9442a472192108a5a33644dc63abbee53fa8 HEAD -- '*.dart')
          dart format "${files[@]}"
          git diff --binary -- "${files[@]}" | gzip -c > /tmp/formatted.diff.gz
          base64 -w0 /tmp/formatted.diff.gz | fold -w 3000 | awk '{printf "::notice title=FORMAT%04d::%s\n", NR, $0}'
      - name: Analyze and targeted tests
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analysis.log 2>&1
          a=$?
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/independent_snapshot_comparison_test.dart test/features/transcription/project_proofread_evidence_loader_test.dart test/features/lyrics/presentation/widgets/project_asr_snapshot_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart > /tmp/tests.log 2>&1
          t=$?
          printf '\nANALYZE_EXIT=%s TEST_EXIT=%s\n' "$a" "$t" >> /tmp/tests.log
          cat /tmp/analysis.log >> /tmp/tests.log
          gzip -c /tmp/tests.log | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=TESTLOG%04d::%s\n", NR, $0}'
          test "$a" = 0 && test "$t" = 0

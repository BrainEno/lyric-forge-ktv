name: Temporary snapshot validation
on:
  push:
    branches: [arena/3e595ed4-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format changed files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM 5c1f9442a472192108a5a33644dc63abbee53fa8 HEAD -- '*.dart')
          dart format "${files[@]}"
          git diff --binary -- "${files[@]}" | gzip -c > /tmp/formatted.diff.gz
          base64 -w0 /tmp/formatted.diff.gz | fold -w 3000 | awk '{printf "::notice title=FORMAT%04d::%s\n", NR, $0}'
      - name: Analyze and targeted tests
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analysis.log 2>&1
          a=$?
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/independent_snapshot_comparison_test.dart test/features/transcription/project_proofread_evidence_loader_test.dart test/features/lyrics/presentation/widgets/project_asr_snapshot_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart > /tmp/tests.log 2>&1
          t=$?
          printf '\nANALYZE_EXIT=%s TEST_EXIT=%s\n' "$a" "$t" >> /tmp/tests.log
          cat /tmp/analysis.log >> /tmp/tests.log
          gzip -c /tmp/tests.log | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=TESTLOG%04d::%s\n", NR, $0}'
          test "$a" = 0 && test "$t" = 0
      - name: Generate work log
        shell: bash
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 22:47' --slug inspect-original-asr-snapshots --title 'Inspect verified original ASR snapshots'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2247-inspect-original-asr-snapshots.md')
          p.write_text('''# [2026-11-07 22:47] Inspect verified original ASR snapshots

          - Scope: Enable read-only inspection of verified original dual-ASR snapshots when a fused or edited draft no longer matches the primary transcript.
          - Files: Independent snapshot comparison, project evidence model and loader, editor and snapshot dialog, focused domain/data/widget tests, handoff and log navigation.
          - Validation:
            - dart format changed Dart files in Actions 43177242146 => formatted; patch applied locally.
            - flutter analyze --no-fatal-infos in Actions 43177242146 => no errors or warnings; info diagnostics remain.
            - Focused snapshot, loader, dialog and editor tests in Actions 43177242146 => 105 passed.
          - Notes: Comparison is read-only and restricted to original single-input transcripts; ambiguous overlaps never count as agreement. Audio hashes and revisions are point-in-time checks. Chunk evidence, real recordings and native accessibility remain unverified; #319 stays open.
          - Commit: `Document snapshot inspection`
          ''')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2247-inspect-original-asr-snapshots.md
          git diff --binary -- docs/work_log.md docs/work_log_index.md docs/work_log_archive.md docs/log/entries/2026-11-07-2247-inspect-original-asr-snapshots.md | gzip -c | base64 -w0 | fold -w 3000 | awk '{printf "::notice title=DOCS%04d::%s\n", NR, $0}'

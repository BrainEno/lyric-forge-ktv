name: Arena proofreading refactor validation

on:
  push:
    branches: [arena/687794f2-lyric-forge-ktv]

permissions:
  contents: read

jobs:
  validate:
    name: Refactor format, analyze, and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          else
            dart_files=(
              lib/features/lyrics/presentation/controllers/lyric_editor_proofreading_coordinator.dart
              lib/features/lyrics/presentation/screens/lyric_editor_screen.dart
              lib/features/lyrics/presentation/widgets/lyric_editor_content.dart
              test/features/lyrics/presentation/screens/lyric_editor_orchestration_contract_test.dart
            )
          fi
          dart format "${dart_files[@]}"
          git diff --check

      - name: Analyze app and tests
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test tool > /tmp/flutter-analyze.log 2>&1
          result=$?
          cat /tmp/flutter-analyze.log
          if (( result != 0 )); then
            python3 - <<'PY'
          from pathlib import Path

          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          for line in Path('/tmp/flutter-analyze.log').read_text().splitlines():
              if line.strip():
                  print(f'::error title=Flutter analyzer::{escape(line)}')
          PY
            cat /tmp/flutter-analyze.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Run proofreading and editor regression tests
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded \
            test/features/lyrics/presentation/screens/lyric_editor_orchestration_contract_test.dart \
            test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart \
            test/features/lyrics/presentation/screens/chunk_project_editor_review_integration_test.dart \
            test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart \
            test/features/lyrics/domain/proofreading/run_reference_proofread_use_case_test.dart \
            test/features/lyrics/domain/proofreading/apply_reference_alignment_use_case_test.dart \
            test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart \
            test/features/lyrics/presentation/widgets/reference_alignment_review_test.dart \
            test/features/lyrics/presentation/widgets/reference_alignment_timing_selection_test.dart \
            > /tmp/flutter-tests.log 2>&1
          result=$?
          cat /tmp/flutter-tests.log
          if (( result != 0 )); then
            python3 - <<'PY'
          from pathlib import Path

          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          for line in Path('/tmp/flutter-tests.log').read_text().splitlines()[-100:]:
              if line.strip():
                  print(f'::error title=Flutter test failure::{escape(line)}')
          PY
            cat /tmp/flutter-tests.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Generate and verify work-log navigation
        shell: bash
        run: |
          dart tool/work_log.dart new \
            --timestamp "2026-11-07 23:51" \
            --slug extract-lyric-editor-proofreading-flows \
            --title "Extract lyric editor proofreading flows"
          python3 - <<'PY'
          from pathlib import Path

          entry = Path('docs/log/entries/2026-11-07-2351-extract-lyric-editor-proofreading-flows.md')
          text = entry.read_text()
          text = text.replace(
              '- Scope: TODO — describe the task purpose.',
              '- Scope: Move the editor body and three proofreading interaction flows out of LyricEditorScreen while keeping domain proposal rules and editor state ownership unchanged.',
          )
          text = text.replace(
              '- Files: TODO — list changed files.',
              '- Files: lyric_editor_screen.dart, lyric_editor_content.dart, lyric_editor_proofreading_coordinator.dart, lyric_editor_orchestration_contract_test.dart, lyric_proofreading_ux_review.md, handoff and generated work-log navigation.',
          )
          text = text.replace(
              '  - dart format ... => TODO',
              '  - dart format changed Dart files => passed in the pinned Flutter Actions run.',
          )
          text = text.replace(
              '  - flutter analyze ... => TODO',
              '  - flutter analyze --no-pub --no-fatal-infos lib test tool => passed; info-level diagnostics are permitted by the repository gate.',
          )
          text = text.replace(
              '  - flutter test ... => TODO',
              '  - Focused V2, reference, editor, integration, dialog and orchestration contract tests => passed.',
          )
          text = text.replace(
              '- Notes: TODO — record risks and unverified behavior.',
              '- Notes: Screen is below 1200 lines and all three entry methods remain below 40 lines; proposal decisions remain in domain use cases. Physical-device, real-audio and screen-reader behavior were not tested.',
          )
          text = text.replace(
              '- Commit: `TODO: replace with the actual English imperative subject`',
              '- Commit: `Extract lyric editor proofreading flows`',
          )
          if 'TODO' in text:
              raise SystemExit(f'Unfilled work-log TODO in {entry}')
          entry.write_text(text)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check

      - name: Publish generated patches for the workspace
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import subprocess
          from pathlib import Path

          def emit(title, payload):
              encoded = base64.b64encode(gzip.compress(payload.encode(), mtime=0)).decode()
              for index in range(0, len(encoded), 5000):
                  part = encoded[index:index + 5000]
                  print(f'::{"notice"} title={title}{index // 5000:04d}::{part}')

          dart_paths = subprocess.run(
              ['git', 'diff', '--name-only', '--', '*.dart'],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          if dart_paths:
              format_patch = subprocess.run(
                  ['git', 'diff', '--', *dart_paths],
                  check=True, capture_output=True, text=True,
              ).stdout
              if format_patch:
                  emit('FORMATPATCH', format_patch)
              else:
                  print('::notice title=FORMATPATCH_NONE::No formatter changes were produced.')

          entry_path = Path('docs/log/entries/2026-11-07-2351-extract-lyric-editor-proofreading-flows.md')
          if entry_path.exists():
              docs_patch = subprocess.run(
                  ['git', 'diff', '--', 'docs/work_log.md', 'docs/work_log_index.md', 'docs/work_log_archive.md'],
                  check=True, capture_output=True, text=True,
              ).stdout
              emit('DOCSPATCH', '===ENTRY===\n' + entry_path.read_text() + '===DIFF===\n' + docs_patch)
          PY

name: Apply awaited repair fix

on:
  push:
    branches:
      - feat/qwen-model-integrity
    paths:
      - ".github/workflows/apply-await-repair-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-model-integrity
          fetch-depth: 0
      - name: Await repair before cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart')
          text = path.read_text(encoding='utf-8')
          old = '      return repair(installed);'
          new = '      return await repair(installed);'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source fix and remove one-shot workflow
        run: |
          git rm .github/workflows/apply-await-repair-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart
          git commit -m "Await model repair before install cleanup"
          git push origin HEAD:feat/qwen-model-integrity

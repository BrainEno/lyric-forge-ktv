name: Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: helpers
        run: |
          cat > /tmp/emit.sh <<'SH'
          # emit TITLE FILE: split FILE into chunks and publish them, rotating levels.
          emit() {
            local title="$1" file="$2" size="${3:-3000}"
            [[ -s "$file" ]] || { echo "::notice title=$title::empty"; return; }
            split -C "$size" -d -a 3 "$file" /tmp/chunk_
            local i=0 level
            for c in /tmp/chunk_*; do
              case $((i / 10)) in 0) level=error;; 1) level=warning;; 2) level=notice;; *) break;; esac
              body=$(sed -e 's/%/%25/g' "$c" | sed -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
              echo "::$level title=$title $i::$body"
              i=$((i+1))
            done
            rm -f /tmp/chunk_*
          }
          SH
      - name: format
        continue-on-error: true
        run: |
          source /tmp/emit.sh
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.dart')
          dart format "${files[@]}" > /dev/null
          dart run tool/work_log.dart write > /dev/null || true
          git diff > /tmp/fmt.patch
          echo "lines: $(wc -l < /tmp/fmt.patch)"
          emit fmt /tmp/fmt.patch
          git checkout -- .
      - name: analyze
        continue-on-error: true
        run: |
          source /tmp/emit.sh
          flutter analyze --no-fatal-infos > /tmp/ana.txt 2>&1 || true
          grep -E "error •|warning •" /tmp/ana.txt > /tmp/ana-bad.txt || true
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.dart')
          : > /tmp/ana-touched.txt
          for f in "${files[@]}"; do grep -F "$f" /tmp/ana.txt >> /tmp/ana-touched.txt || true; done
          tail -3 /tmp/ana.txt > /tmp/ana-tail.txt
          emit ana-bad /tmp/ana-bad.txt
          emit ana-touched /tmp/ana-touched.txt
          emit ana-tail /tmp/ana-tail.txt
      - name: touched tests
        continue-on-error: true
        run: |
          source /tmp/emit.sh
          mapfile -t tests < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'test/**_test.dart')
          tests+=(test/architecture test/features/lyrics/presentation/widgets)
          flutter test --no-pub --reporter expanded "${tests[@]}" > /tmp/t.txt 2>&1 || true
          grep -n -B2 -A25 "EXCEPTION CAUGHT\|\[E\]\|Expected:\|Error:" /tmp/t.txt | head -c 60000 > /tmp/t-err.txt || true
          tail -4 /tmp/t.txt > /tmp/t-tail.txt
          emit test-err /tmp/t-err.txt
          emit test-tail /tmp/t-tail.txt
      - name: full suite
        continue-on-error: true
        run: |
          source /tmp/emit.sh
          flutter test --no-pub --reporter expanded > /tmp/f.txt 2>&1 || true
          grep -n "\[E\]" /tmp/f.txt | head -c 30000 > /tmp/f-err.txt || true
          tail -4 /tmp/f.txt > /tmp/f-tail.txt
          emit full-err /tmp/f-err.txt
          emit full-tail /tmp/f-tail.txt

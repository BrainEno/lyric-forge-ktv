name: Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Emit helper
        shell: bash
        run: |
          cat > /tmp/emit.py <<'PY'
          import sys
          title, path = sys.argv[1], sys.argv[2]
          try:
              text = open(path, encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              text = ''
          if not text.strip():
              print(f"::notice title={title} 0::(empty)")
              sys.exit(0)
          chunks = [text[i:i+3500] for i in range(0, len(text), 3500)][:30]
          levels = ['notice', 'warning', 'error']
          for n, c in enumerate(chunks):
              c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::{levels[n // 10]} title={title} {n}::{c}")
          PY
          flutter pub get --enforce-lockfile > /tmp/pub.txt 2>&1 || cat /tmp/pub.txt
      - name: Format
        shell: bash
        run: |
          mapfile -t am < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- '*.dart')
          if (( ${#am[@]} > 0 )); then
            dart format "${am[@]}" > /dev/null 2>&1
            git --no-pager diff -U1 -- "${am[@]}" > /tmp/fmt.txt
            if [[ -s /tmp/fmt.txt ]]; then python3 /tmp/emit.py fmt /tmp/fmt.txt; else echo "::notice title=fmt-ok::clean"; fi
            git checkout -- .
          fi
      - name: Analyze
        shell: bash
        run: |
          set +e
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AMR "$BASE_SHA" HEAD -- '*.dart')
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test tool > /tmp/ana.txt 2>&1
          grep -E "error •|warning •" /tmp/ana.txt > /tmp/ana-bad.txt
          : > /tmp/ana-touched.txt
          for f in "${dart_files[@]}"; do grep -F "$f:" /tmp/ana.txt >> /tmp/ana-touched.txt; done
          tail -3 /tmp/ana.txt > /tmp/ana-tail.txt
          python3 /tmp/emit.py ana-bad /tmp/ana-bad.txt
          python3 /tmp/emit.py ana-touched /tmp/ana-touched.txt
          python3 /tmp/emit.py ana-tail /tmp/ana-tail.txt
          exit 0
      - name: Changed tests
        shell: bash
        run: |
          set +e
          mapfile -t tests < <(git diff --name-only --diff-filter=AMR "$BASE_SHA" HEAD -- '*.dart' | grep '^test/.*_test\.dart$')
          if (( ${#tests[@]} > 0 )); then
            flutter test --no-pub "${tests[@]}" > /tmp/test.txt 2>&1
            echo "exit $?" >> /tmp/test.txt
            grep -n -B2 -A25 "\[E\]\|EXCEPTION CAUGHT\|Expected:\|Error:" /tmp/test.txt | head -300 > /tmp/test-err.txt
            tail -6 /tmp/test.txt > /tmp/test-tail.txt
            python3 /tmp/emit.py test-err /tmp/test-err.txt
            python3 /tmp/emit.py test-tail /tmp/test-tail.txt
          fi
          exit 0
      - name: Full tests
        shell: bash
        run: |
          set +e
          flutter test --no-pub > /tmp/full.txt 2>&1
          echo "full exit $?" >> /tmp/full.txt
          grep -n "\[E\]" /tmp/full.txt | head -40 > /tmp/full-err.txt
          grep -n -A30 "EXCEPTION CAUGHT\|Expected:" /tmp/full.txt | head -200 >> /tmp/full-err.txt
          tail -4 /tmp/full.txt > /tmp/full-tail.txt
          python3 /tmp/emit.py full-err /tmp/full-err.txt
          python3 /tmp/emit.py full-tail /tmp/full-tail.txt
          exit 0

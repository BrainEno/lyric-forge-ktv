name: Temporary probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Emit helper
        run: |
          cat > /tmp/emit.py <<'PY'
          import sys
          title, path = sys.argv[1], sys.argv[2]
          text = open(path, encoding='utf-8', errors='replace').read()
          if not text.strip():
              text = '(empty)'
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][:27]
          levels = ['notice', 'warning', 'error']
          for n, chunk in enumerate(chunks):
              body = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              name = f'{title} {n}' if len(chunks) > 1 or title == 'fmt' else title
              print(f'::{levels[n % 3]} title={name}::{body}')
          PY
      - run: flutter pub get --enforce-lockfile
      - name: Format and work log
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          if (( ${#files[@]} )); then dart format "${files[@]}" > /dev/null; fi
          dart run tool/work_log.dart write > /dev/null || true
          git diff > /tmp/fmt.patch
          python3 /tmp/emit.py fmt /tmp/fmt.patch
          git checkout -- .
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos > /tmp/ana.txt 2>&1 || true
          grep -E '^ *(error|warning) ' /tmp/ana.txt > /tmp/ana-bad.txt || true
          grep -E 'asr_runtime_setup|asr_setup_fakes|asr_install_experience_contract|asr_managed_storage_contract|asr_storage_preflight_contract' /tmp/ana.txt > /tmp/ana-touched.txt || true
          tail -n 5 /tmp/ana.txt > /tmp/ana-tail.txt
          python3 /tmp/emit.py ana-bad /tmp/ana-bad.txt
          python3 /tmp/emit.py ana-touched /tmp/ana-touched.txt
          python3 /tmp/emit.py ana-tail /tmp/ana-tail.txt
      - name: Touched tests
        run: |
          flutter test --no-pub \
            test/features/transcription/presentation/asr_runtime_setup_controller_test.dart \
            test/features/transcription/presentation/asr_runtime_setup_text_test.dart \
            test/features/transcription/presentation/asr_runtime_setup_dialog_test.dart \
            test/features/transcription/asr_install_experience_contract_test.dart \
            test/features/transcription/asr_managed_storage_contract_test.dart \
            test/features/transcription/asr_storage_preflight_contract_test.dart \
            test/architecture \
            > /tmp/test.txt 2>&1 || true
          grep -n -E -A25 '\[E\]|EXCEPTION CAUGHT|Error:|Expected:' /tmp/test.txt | head -c 30000 > /tmp/test-err.txt || true
          tail -n 15 /tmp/test.txt > /tmp/test-tail.txt
          python3 /tmp/emit.py test-err /tmp/test-err.txt
          python3 /tmp/emit.py test-tail /tmp/test-tail.txt
      - name: Full suite
        run: |
          flutter test --no-pub > /tmp/full.txt 2>&1 || true
          grep -n -E -B2 -A20 '\[E\]$|\[E\] ' /tmp/full.txt | head -c 20000 > /tmp/full-err.txt || true
          tail -n 8 /tmp/full.txt > /tmp/full-tail.txt
          python3 /tmp/emit.py full-err /tmp/full-err.txt
          python3 /tmp/emit.py full-tail /tmp/full-tail.txt

name: Temporary architecture validation
on:
  push:
    branches: [arena/8d81bdb2-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format test/architecture/feature_dependency_graph_test.dart test/architecture/state_management_documentation_test.dart test/architecture/support/feature_dependency_graph.dart test/architecture/support/feature_dependency_baseline.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/architecture.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/architecture.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/architecture.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+16]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: flutter analyze --no-pub --no-fatal-infos lib test tool

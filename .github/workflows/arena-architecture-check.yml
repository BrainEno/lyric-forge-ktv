name: Temporary architecture validation
on:
  push:
    branches: [arena/8d81bdb2-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format test/architecture/feature_dependency_graph_test.dart test/architecture/state_management_documentation_test.dart test/architecture/support/feature_dependency_graph.dart test/architecture/support/feature_dependency_baseline.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/architecture.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/architecture.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/architecture.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+16]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Generate work log
        if: success()
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:11' --slug feature-dependency-ratchet --title 'Track feature dependencies and state ownership'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2311-feature-dependency-ratchet.md'
          s=open(p).read()
          s=s.replace('- Scope: TODO — describe the task purpose.', '- Scope: Add a shrinking baseline for feature dependency cycles and presentation imports; document state ownership and app assembly conventions.')
          s=s.replace('- Files: TODO — list changed files.', '- Files: Feature dependency graph, baseline and focused architecture tests; state management decision and architecture documentation; work-log navigation and handoff.')
          s=s.replace('  - dart format ... => TODO\n  - flutter analyze ... => TODO\n  - flutter test ... => TODO', '  - Pinned Flutter Actions run 43007492716 passed dependency install, format, architecture tests and scoped analysis; inspect final PR checks for the final head.\n  - Work-log write/check run separately. Local Flutter/Dart unavailable.')
          s=s.replace('- Notes: TODO — record risks and unverified behavior.', '- Notes: #327 remains open: no existing cyclic edge was removed. Static import scanning does not prove runtime behavior; unsupported directive syntax requires explicit handling. #235 documentation is completed pending merge.')
          s=s.replace('- Commit: `TODO: replace with the actual English imperative subject`', '- Commit: `Track cross-feature dependency cycles`')
          assert 'TODO' not in s
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write 2>&1 | tee /tmp/worklog-write.txt
          set -o pipefail
          dart tool/work_log.dart check 2>&1 | tee /tmp/worklog-check.txt || {
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/worklog-check.txt
            exit 1
          }
          git add -N docs/log/entries/2026-11-07-2311-feature-dependency-ratchet.md
          git diff -- docs/log/entries/2026-11-07-2311-feature-dependency-ratchet.md docs/work_log.md docs/work_log_index.md docs/work_log_archive.md > /tmp/log.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/log.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=LOG{i//3000}::{data[i:i+3000]}')
          PY

name: Root widget validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/main.dart'
      - 'lib/core/layout/app_responsive.dart'
      - 'lib/core/navigation/app_chrome_controller.dart'
      - 'test/widget_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/widget-root-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  widget-root:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - run: flutter analyze lib/main.dart test/widget_test.dart
      - run: flutter test test/widget_test.dart
      - run: >-
          flutter test test/widget_test.dart
          --plain-name 'mobile root renders Navigator child without desktop overlay'

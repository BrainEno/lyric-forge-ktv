name: Arena reference alignment planner
on:
  workflow_dispatch:
  push:
    branches: [arena/009f50f7-lyric-forge-ktv]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and publish patch
        run: |
          dart format lib/features/lyrics/domain/proofreading/reference_forced_alignment_planner.dart test/features/lyrics/domain/proofreading/reference_forced_alignment_planner_test.dart
          git diff > /tmp/format.patch
          gzip -c /tmp/format.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=FORMAT" NR "::" $0}'
      - run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - run: flutter test --no-pub test/features/lyrics/domain/proofreading/reference_forced_alignment_planner_test.dart test/features/lyrics/domain/proofreading/reference_first_pipeline_test.dart test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/architecture_layer_imports_contract_test.dart test/architecture/feature_dependency_graph_test.dart

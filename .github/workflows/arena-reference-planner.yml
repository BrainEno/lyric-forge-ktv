name: Arena reference alignment planner
on:
  workflow_dispatch:
  push:
    branches: [arena/009f50f7-lyric-forge-ktv]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and publish patch
        run: |
          dart format lib/features/lyrics/domain/proofreading/reference_forced_alignment_planner.dart test/features/lyrics/domain/proofreading/reference_forced_alignment_planner_test.dart
          git diff > /tmp/format.patch
          gzip -c /tmp/format.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=FORMAT" NR "::" $0}'
      - run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Targeted tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/reference_forced_alignment_planner_test.dart test/features/lyrics/domain/proofreading/reference_first_pipeline_test.dart test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/architecture_layer_imports_contract_test.dart test/architecture/feature_dependency_graph_test.dart > /tmp/tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            gzip -c /tmp/tests.log | base64 -w0 | fold -w 4000 | awk '{print "::notice title=TESTLOG" NR "::" $0}'
          fi
          exit "$status"
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-07 23:48" --slug plan-reference-forced-alignment --title "Plan reference forced alignment timings"
          python3 -c "from pathlib import Path; p=Path('docs/log/entries/2026-11-07-2348-plan-reference-forced-alignment.md'); s=p.read_text(); s=s.replace('TODO — describe the task purpose.', 'Prepare complete reference-text forced alignment timing candidates without changing project lyrics.').replace('TODO — list changed files.', 'Reference alignment planner and service, domain tests, product follow-up, handoff and generated work-log navigation.').replace('dart format ... => TODO', 'dart format changed Dart files => passed in Actions 43158132183.').replace('flutter analyze ... => TODO', 'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 43158132183.').replace('flutter test ... => TODO', 'Targeted planner, existing reference and alignment pipelines, orchestration and architecture tests => passed in Actions 43158132183.').replace('TODO — record risks and unverified behavior.', 'Domain only, no production UI or persistence; strict matching can reject real aligner output. No real audio, device or screen-reader validation. Matching does not establish accuracy or authorize application.').replace('TODO: replace with the actual English imperative subject', 'Plan conservative reference alignment timings'); p.write_text(s)"
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2348-plan-reference-forced-alignment.md
          git diff -- docs > /tmp/worklog.patch
          gzip -c /tmp/worklog.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=WORKLOG" NR "::" $0}'

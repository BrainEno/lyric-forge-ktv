name: Temporary vocal import validation
on:
  push:
    branches: [arena/5e9bca3d-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/app/screen_assembly.dart lib/features/project/data/services/file_project_accompaniment_importer.dart lib/features/project/domain/services/project_vocal_importer.dart lib/features/project/presentation/project_detail_dependencies.dart lib/features/project/presentation/screens/project_detail_screen.dart test/documentation_references_contract_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/project/file_project_vocal_importer_test.dart test/features/project/presentation/project_detail_capability_test.dart test/features/transcription/local_project_transcription_cancellation_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/project/file_project_accompaniment_importer_test.dart test/features/project/file_project_vocal_importer_test.dart test/features/project/presentation/project_detail_capability_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/transcription/local_project_transcription_cancellation_test.dart test/documentation_references_contract_test.dart test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/vocal-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/vocal-test.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/vocal-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+15]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/vocal-analyze.log || {
            grep -E 'error •|warning •|error -|warning -' /tmp/vocal-analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

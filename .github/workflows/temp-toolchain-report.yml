name: Temp toolchain report

# Temporary: runs the pinned Flutter toolchain in CI to format the new tool and
# capture analyze/test output as committable report files. Deleted before the
# pull request is merged.

on:
  push:
    branches:
      - 'arena/b3b7e45e-lyric-forge-ktv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-toolchain-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Format target files
        run: |
          mkdir -p .ci-report
          set +e
          dart format tool/asr_quality_report.dart \
            test/tool/asr_quality_report_test.dart \
            > .ci-report/format.txt 2>&1
          echo "format exit: $?" >> .ci-report/format.txt
          cat .ci-report/format.txt

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test \
            > .ci-report/analyze.txt 2>&1
          echo "analyze exit: $?" >> .ci-report/analyze.txt
          tail -60 .ci-report/analyze.txt

      - name: Test new tool
        run: |
          set +e
          flutter test --no-pub --reporter expanded \
            test/tool/asr_quality_report_test.dart \
            > .ci-report/test.txt 2>&1
          echo "test exit: $?" >> .ci-report/test.txt
          tail -100 .ci-report/test.txt

      - name: CLI smoke test
        run: |
          set +e
          rm -rf /tmp/quality-smoke && mkdir -p /tmp/quality-smoke/song-01
          cat > /tmp/quality-smoke/song-01/reference.lrc <<'LRC'
          [ti:smoke]
          [00:10.00]we are dancing through the night
          [00:15.00]sing a little song
          [00:20.00]until the morning light
          LRC
          cat > /tmp/quality-smoke/song-01/fused.lrc <<'LRC'
          [00:10.00]we are dancing through the night
          [00:10.50]dancing
          [00:15.00]sing a little song
          [00:20.30]until the morning light
          LRC
          cat > /tmp/quality-smoke/corpus.json <<'JSON'
          {
            "schemaVersion": 1,
            "songs": [
              {
                "id": "song-01",
                "language": "en",
                "reference": { "path": "song-01/reference.lrc", "reviewed": true },
                "candidates": [
                  { "engine": "fused", "path": "song-01/fused.lrc" }
                ]
              }
            ]
          }
          JSON
          {
            echo '--- single pair ---'
            dart run tool/asr_quality_report.dart               --reference /tmp/quality-smoke/song-01/reference.lrc               --hypothesis /tmp/quality-smoke/song-01/fused.lrc               --engine fused
            echo "pair exit: $?"
            echo '--- corpus + json baseline ---'
            dart run tool/asr_quality_report.dart               --corpus /tmp/quality-smoke/corpus.json               --output /tmp/quality-smoke/baseline.json
            echo "corpus exit: $?"
            python3 -c "import json;d=json.load(open('/tmp/quality-smoke/baseline.json'));print('json ok, duplicate rate:', d['overallByEngine']['fused']['duplicateLineRate'])"
            echo '--- regression gate must fail ---'
            dart run tool/asr_quality_report.dart               --corpus /tmp/quality-smoke/corpus.json               --baseline /tmp/quality-smoke/baseline.json               --fail-on-regression > /dev/null
            echo "same-run exit (expect 0): $?"
            python3 - <<'PY'
          import json
          p='/tmp/quality-smoke/baseline.json'
          d=json.load(open(p))
          d['overallByEngine']['fused']['duplicateLineRate'] = 0.0
          json.dump(d, open('/tmp/quality-smoke/fake-better.json','w'))
          PY
            dart run tool/asr_quality_report.dart               --corpus /tmp/quality-smoke/corpus.json               --baseline /tmp/quality-smoke/fake-better.json               --fail-on-regression > /dev/null 2>&1
            echo "regressed exit (expect 1): $?"
            echo '--- bad input must exit 2 ---'
            dart run tool/asr_quality_report.dart --corpus /tmp/missing.json >/dev/null 2>&1
            echo "missing corpus exit (expect 2): $?"
          } > .ci-report/cli.txt 2>&1
          cat .ci-report/cli.txt

      - name: Full test suite
        run: |
          set +e
          flutter test --no-pub --reporter compact             > .ci-report/full-test.txt 2>&1
          echo "full test exit: $?" >> .ci-report/full-test.txt
          tail -25 .ci-report/full-test.txt

      - name: Publish report back to the branch
        run: |
          set -euo pipefail
          git config user.name 'ci-toolchain-report'
          git config user.email 'ci-toolchain-report@users.noreply.github.com'
          git add -A -- .ci-report tool test lib docs .gitignore
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git commit -m 'chore: ci toolchain report [skip ci]'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

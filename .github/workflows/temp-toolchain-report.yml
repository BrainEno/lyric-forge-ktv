name: Temp toolchain report

# Temporary: runs the pinned Flutter toolchain in CI to format the new tool and
# capture analyze/test output as committable report files. Deleted before the
# pull request is merged.

on:
  push:
    branches:
      - 'arena/b3b7e45e-lyric-forge-ktv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-toolchain-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Format target files
        run: |
          mkdir -p .ci-report
          set +e
          dart format tool/asr_quality_report.dart \
            test/tool/asr_quality_report_test.dart \
            > .ci-report/format.txt 2>&1
          echo "format exit: $?" >> .ci-report/format.txt
          cat .ci-report/format.txt

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test \
            > .ci-report/analyze.txt 2>&1
          code=$?
          echo "analyze exit: $code" >> .ci-report/analyze.txt
          set -e
          tail -60 .ci-report/analyze.txt
          exit $code

      - name: Test new tool
        run: |
          set +e
          flutter test --no-pub --reporter expanded \
            test/tool/asr_quality_report_test.dart \
            > .ci-report/test.txt 2>&1
          code=$?
          echo "test exit: $code" >> .ci-report/test.txt
          set -e
          tail -100 .ci-report/test.txt
          exit $code

      - name: CLI smoke test
        run: |
          mkdir -p .ci-report
          exec > >(tee .ci-report/cli.txt) 2>&1
          set -euo pipefail
          rm -rf /tmp/quality-smoke && mkdir -p /tmp/quality-smoke/song-01
          cat > /tmp/quality-smoke/song-01/reference.lrc <<'LRC'
          [ti:smoke]
          [00:10.00]we are dancing through the night
          [00:15.00]sing a little song
          [00:20.00]until the morning light
          LRC
          cat > /tmp/quality-smoke/song-01/fused.lrc <<'LRC'
          [00:10.00]we are dancing through the night
          [00:10.50]dancing
          [00:15.00]sing a little song
          [00:20.30]until the morning light
          LRC
          cat > /tmp/quality-smoke/corpus.json <<'JSON'
          {
            "schemaVersion": 1,
            "songs": [
              {
                "id": "song-01",
                "language": "en",
                "reference": { "path": "song-01/reference.lrc", "reviewed": true },
                "candidates": [
                  { "engine": "fused", "path": "song-01/fused.lrc" }
                ]
              }
            ]
          }
          JSON

          check() {
            local expected="$1" actual="$2" label="$3" log="${4:-}"
            if [ "$expected" != "$actual" ]; then
              echo "FAILED: $label expected exit $expected, got $actual"
              if [ -n "$log" ]; then
                echo "--- $log ---"
                cat "$log"
                echo '--- end ---'
              fi
              exit 1
            fi
            echo "ok: $label (exit $expected)"
          }

          echo '--- generated inputs ---'
          ls -l /tmp/quality-smoke/song-01
          head -4 /tmp/quality-smoke/song-01/reference.lrc
          head -4 /tmp/quality-smoke/song-01/fused.lrc

          set +e
          dart run tool/asr_quality_report.dart \
            --reference /tmp/quality-smoke/song-01/reference.lrc \
            --hypothesis /tmp/quality-smoke/song-01/fused.lrc \
            --engine fused > /tmp/quality-smoke/pair.txt 2>&1
          check 0 $? 'single pair' /tmp/quality-smoke/pair.txt
          cat /tmp/quality-smoke/pair.txt

          dart run tool/asr_quality_report.dart \
            --corpus /tmp/quality-smoke/corpus.json \
            --output /tmp/quality-smoke/baseline.json > /tmp/quality-smoke/corpus.txt 2>&1
          check 0 $? 'corpus report' /tmp/quality-smoke/corpus.txt
          cat /tmp/quality-smoke/corpus.txt

          dart run tool/asr_quality_report.dart \
            --corpus /tmp/quality-smoke/corpus.json \
            --baseline /tmp/quality-smoke/baseline.json \
            --fail-on-regression > /tmp/quality-smoke/same.txt 2>&1
          check 0 $? 'unchanged run passes the gate' /tmp/quality-smoke/same.txt

          python3 - <<'PY'
          import json
          path = '/tmp/quality-smoke/baseline.json'
          report = json.load(open(path))
          fused = report['overallByEngine']['fused']
          assert fused['duplicateLineCount'] == 1, fused
          assert abs(fused['duplicateLineRate'] - 1 / 4) < 1e-9, fused
          assert abs(fused['lineCountRatio'] - 4 / 3) < 1e-9, fused
          assert abs(fused['lineRecall'] - 1.0) < 1e-9, fused
          print('metric assertions ok:', {
              'duplicateLineRate': fused['duplicateLineRate'],
              'lineCountRatio': fused['lineCountRatio'],
              'lineRecall': fused['lineRecall'],
              'startTimeMaeMs': fused['startTimeMaeMs'],
          })
          fused['duplicateLineRate'] = 0.0
          json.dump(report, open('/tmp/quality-smoke/optimistic.json', 'w'))
          PY

          dart run tool/asr_quality_report.dart \
            --corpus /tmp/quality-smoke/corpus.json \
            --baseline /tmp/quality-smoke/optimistic.json \
            --fail-on-regression > /tmp/quality-smoke/regress.txt 2>&1
          check 1 $? 'regression gate fails the build' /tmp/quality-smoke/regress.txt
          grep -q 'REGRESSION fused duplicateLineRate' /tmp/quality-smoke/regress.txt
          echo "ok: regression named in the report"

          dart run tool/asr_quality_report.dart \
            --corpus /tmp/quality-smoke/missing.json > /dev/null 2>&1
          check 2 $? 'missing corpus exits 2'

          dart run tool/asr_quality_report.dart --bogus-option > /dev/null 2>&1
          check 2 $? 'unknown option exits 2'

          set -e

      - name: Full test suite
        run: |
          set +e
          flutter test --no-pub --reporter compact > .ci-report/full-test.txt 2>&1
          code=$?
          echo "full test exit: $code" >> .ci-report/full-test.txt
          set -e
          tail -25 .ci-report/full-test.txt
          exit $code

      - name: Publish report back to the branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ci-toolchain-report'
          git config user.email 'ci-toolchain-report@users.noreply.github.com'
          git add -A -- .ci-report tool test lib docs .gitignore
          if git diff --cached --quiet; then
            echo 'Nothing to publish.'
            exit 0
          fi
          git commit -m 'chore: ci toolchain report [skip ci]'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

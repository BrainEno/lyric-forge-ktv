name: Arena reference timing validation
on:
  push:
    branches: ['arena/b0dee6eb-lyric-forge-ktv']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and report patch
        run: |
          dart format $(git diff --name-only 12b89758629b9f784792ec187d55cef3e19bbfd2 -- lib test | grep "[.]dart$")
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=FORMAT{i//4000}::{s[i:i+4000]}')
          PY
      - name: Analyze and test
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/check.log 2>&1
          a=$?
          flutter test test/features/lyrics/domain/proofreading test/features/lyrics/domain/services/lyric_timeline_validator_test.dart test/features/transcription/reference_alignment_audio_guard_test.dart test/features/lyrics/presentation/widgets/reference_alignment_evidence_accessibility_test.dart test/features/lyrics/presentation/widgets/reference_alignment_timing_selection_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart >> /tmp/check.log 2>&1
          b=$?
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/check.log','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=TESTLOG{i//4000}::{s[i:i+4000]}')
          PY
          exit $((a || b))
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 22:45' --slug 'apply-reference-alignment-timing' --title 'Apply reference alignment timing by explicit row choice'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2245-apply-reference-alignment-timing.md'
          s=open(p).read()
          replacements={
            'TODO — describe the task purpose.': 'Allow independently selected reference ForcedAligner timing with guarded composition, provenance and undo.',
            'TODO — list changed files.': 'V2 composer, timing and audio guards, editor review and assembly, timeline validation, domain and widget tests, work log index and handoff.',
            'dart format ... => TODO': 'dart format on changed Dart files via Actions 43165097913 => formatted; patch applied locally.',
            'flutter analyze ... => TODO': 'flutter analyze --no-fatal-infos via Actions 43165097913 => no errors or warnings; info diagnostics remain.',
            'flutter test ... => TODO': 'Focused domain, audio guard, editor, widget and timeline tests via Actions 43165097913 => 379 passed.',
            'TODO — record risks and unverified behavior.': 'Audio hashes and revisions are point-in-time checks, not locks or accuracy guarantees. Real recordings and native assistive technology are unverified; #319 remains open.',
            'TODO: replace with the actual English imperative subject': 'Document reference timing review',
          }
          for old,new in replacements.items():
            if old not in s: raise RuntimeError(old)
            s=s.replace(old,new)
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2245-apply-reference-alignment-timing.md
          git diff -- docs > /tmp/docs.patch
          python3 - <<'PY'
          import gzip,base64
          s=base64.b64encode(gzip.compress(open('/tmp/docs.patch','rb').read())).decode()
          for i in range(0,len(s),4000): print(f'::notice title=DOCS{i//4000}::{s[i:i+4000]}')
          PY

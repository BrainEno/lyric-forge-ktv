name: Fix ASR storage icon

on:
  push:
    branches:
      - feat/asr-managed-storage-location
    paths:
      - ".github/workflows/fix-asr-storage-icon.yml"
      - "tools/fix_asr_storage_icon.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asr-managed-storage-location
      - run: python tools/fix_asr_storage_icon.py
      - run: |
          rm tools/fix_asr_storage_icon.py
          rm .github/workflows/fix-asr-storage-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use supported folder icon for ASR storage"
          git push

name: Temporary ASR copy formatter

on:
  push:
    branches:
      - fix/asr-fusion-recall-confidence-20261026

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
      - name: Match the quality-gate formatter context
        run: flutter pub get
      - name: Format the modified settings card and commit
        run: |
          dart format lib/features/settings/presentation/widgets/asr_end_to_end_smoke_test_card.dart
          if git diff --quiet; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/settings/presentation/widgets/asr_end_to_end_smoke_test_card.dart
          git commit -m "style: format ASR smoke-test clarification"
          git push origin "HEAD:${GITHUB_REF_NAME}"

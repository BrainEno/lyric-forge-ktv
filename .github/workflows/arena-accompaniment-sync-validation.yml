name: Arena accompaniment sync validation
on:
  push:
    branches: [arena/3e0eb0be-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: dart format lib/app/screen_assembly.dart lib/features/project/presentation/project_detail_dependencies.dart lib/features/project/presentation/screens/project_detail_screen.dart test/features/project/presentation/project_detail_capability_test.dart
      - name: Focused session tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/project/presentation/project_detail_capability_test.dart test/features/player/project_audio_session_update_test.dart test/features/project/file_project_accompaniment_importer_test.dart test/architecture/workflow_screen_injection_contract_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp='2026-11-07 18:05'
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug sync-imported-accompaniment --title 'Synchronize imported accompaniment with playback'
          ENTRY_STAMP="$stamp" python3 - <<'PYCODE'
          import os,re
          from pathlib import Path
          stamp=os.environ['ENTRY_STAMP'];run=os.environ['GITHUB_RUN_ID']
          path=Path('docs/log/entries')/(stamp.replace(' ','-').replace(':','')+'-sync-imported-accompaniment.md')
          text=path.read_text();text=re.sub(r'^- Validation:\n(?:  - .*\n)+','- Validation: placeholder\n',text,flags=re.M)
          values={
            'Scope':'Connect desktop accompaniment import to the guarded active playback session update without reloading audio.',
            'Files':'Project detail dependencies, application screen assembly, project detail screen, widget tests, this entry, generated work-log navigation, index and handoff.',
            'Validation':f'Pinned Flutter GitHub Actions run {run} ran Dart format, targeted widget/session/importer tests, the full quality gate, and work-log new/write/check. Local git diff --check passed. Local Flutter/Dart unavailable; final PR checks reported separately.',
            'Notes':'A successful import attempts the session update even after the screen closes. Stale or unsupported sessions, active backing source changes, and sync errors retain the switch-song/reopen fallback; import success is not reported as failure. Widget tests use fake collaborators; native audio and manual UI are unverified. Automatic separation, vocal import and managed-copy cleanup remain open.',
            'Commit':'`feat: sync imported accompaniment with playback`',
          }
          for key,value in values.items():
            text,n=re.subn(rf'^- {key}:.*$',f'- {key}: {value}',text,count=1,flags=re.M)
            if n!=1: raise RuntimeError(key)
          if 'TODO' in text: raise RuntimeError('unfilled TODO')
          path.write_text(text)
          idx=Path('docs/work_log_index.md');text=idx.read_text();old='a currently playing project must be switched away from and reopened to load the new track. Guarded source-update capabilities exist in the audio and session layers, but are not yet wired to the UI.';new='project details attempts a guarded playback-session update after import; rejected or unsupported updates still require switching away and reopening. Real-device playback remains unverified.';assert old in text;idx.write_text(text.replace(old,new))
          handoff=[
            '# Handoff', '', '## 目标', '', '为 #320 在导入已有伴奏后尝试安全同步播放会话。', '',
            '## Git 现场', '', '- 基线 `8b1a741e135f3595e477bc20fd3fe76c63b5fbad`；分支 `arena/3e0eb0be-lyric-forge-ktv`。最终状态以 Git/GitHub 为准。', '',
            '## 已改文件', '', '- 工程详情依赖和界面、应用组装、widget 测试、工作日志与导航。', '',
            '## 检查结果', '', f'- 固定 SDK Actions run {run} 通过定向测试、完整门禁及工作日志检查；本地无 Flutter/Dart。', '- 未进行原生设备播放或手动 UI 检查。', '',
            '## 下一步', '', '- 在真实设备上验证正在播放、暂停、替换正在使用的伴奏、切歌竞争和窗口关闭；核验回退提示后再考虑放宽限制。', '',
            '## 已知风险', '', '- UI 回归使用 fake；会话能力基于同 isolate 路径快照，不检查文件内容或跨进程写入；持久化为 best-effort。', '- 自动分离、人声导入、旧副本清理尚未完成；Media Hub 上传 deadline 测试历史上间歇失败。', '',
            f'最后更新：{stamp}（Asia/Taipei）', ''
          ]
          Path('docs/handoff.md').write_text(chr(10).join(handoff))
          PYCODE
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-sync-imported-accompaniment.md"
          git diff --binary -- docs lib/app/screen_assembly.dart lib/features/project/presentation/project_detail_dependencies.dart lib/features/project/presentation/screens/project_detail_screen.dart test/features/project/presentation/project_detail_capability_test.dart > /tmp/arena.patch
          python3 - <<'PY'
          import base64,gzip
          data=base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure diagnostic
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('/tmp/gate.log')
          if not p.exists(): p=Path('/tmp/focused.log')
          if p.exists():
            lines=p.read_text(errors='replace').splitlines(); hits=[i for i,line in enumerate(lines) if '[E]' in line or 'error -' in line]; selected='\n'.join('\n'.join(lines[max(0,i-2):i+22]) for i in hits); selected += '\n=== LOG TAIL ===\n' + '\n'.join(lines[-30:]); data=base64.b64encode(gzip.compress(selected.encode())).decode()
            for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

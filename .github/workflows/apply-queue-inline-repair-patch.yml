name: Apply queue inline repair patch

on:
  push:
    branches:
      - feat/queue-inline-environment-repair
    paths:
      - ".github/workflows/apply-queue-inline-repair-patch.yml"
      - "tools/apply_queue_inline_repair_patch.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/queue-inline-environment-repair
      - run: python tools/apply_queue_inline_repair_patch.py
      - run: |
          rm tools/apply_queue_inline_repair_patch.py
          rm .github/workflows/apply-queue-inline-repair-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close the queue environment repair loop"
          git push

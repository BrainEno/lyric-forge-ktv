name: Temporary macOS managed CMake branch validation

on:
  push:
    branches: [fix/macos-soloud-no-cmake]

jobs:
  macos-debug-build-without-system-cmake:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      LYRIC_FORGE_FORCE_MANAGED_CMAKE: "1"
      LYRIC_FORGE_CMAKE_CACHE_ROOT: /tmp/lyric-forge-cmake-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Validate Ruby syntax
        run: |
          ruby -c macos/tool/managed_cmake.rb
          ruby -c macos/Podfile
      - name: Build macOS debug with no pre-existing managed CMake
        run: |
          rm -rf "$LYRIC_FORGE_CMAKE_CACHE_ROOT"
          flutter build macos --debug
      - name: Verify fallback and CocoaPods injection
        run: |
          test -x "$LYRIC_FORGE_CMAKE_CACHE_ROOT/CMake.app/Contents/bin/cmake"
          "$LYRIC_FORGE_CMAKE_CACHE_ROOT/CMake.app/Contents/bin/cmake" --version
          grep -q "LyricForge managed CMake PATH" macos/Pods/Pods.xcodeproj/project.pbxproj

# This file is intentionally temporary and is removed after the branch-only
# macOS build proves the managed fallback on Flutter 3.41.9.

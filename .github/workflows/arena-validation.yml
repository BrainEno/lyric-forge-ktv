name: Arena temporary validation
on:
  push:
    branches: [arena/0f11c2d9-lyric-forge-ktv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies and format
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/features/lyrics/presentation/widgets/lyric_list_pane.dart lib/features/transcription/data/services/high_quality_transcription_service.dart lib/features/transcription/data/services/resumable_chunked_transcription_service.dart lib/features/transcription/presentation/widgets/transcription_config_dialog.dart test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_list_pane_test.dart
      - name: Focused tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_list_pane_test.dart 2>&1 | tee /tmp/focused.log
      - name: Quality gate
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 17:40' --slug preserve-disagreement-evidence --title 'Preserve disagreement evidence beyond highlight limit'
          python3 - <<'PYLOG'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-1740-preserve-disagreement-evidence.md')
          s = p.read_text()
          s = s.replace('TODO — describe the task purpose.', 'Keep all dual-engine candidates and apply replacements independently of the editor highlight limit (#333).')
          s = s.replace('TODO — list changed files.', 'High-quality and resumable transcription services, transcription configuration dialog, lyric list pane, their tests, work-log documents, and handoff.')
          s = s.replace('dart format ... => TODO', 'dart format changed Dart files after dependency resolution => passed in temporary GitHub Actions validation.')
          s = s.replace('flutter analyze ... => TODO', 'bash scripts/quality_gate.sh --skip-pub-get => passed in temporary GitHub Actions validation, including analyzer and full suite.')
          s = s.replace('flutter test ... => TODO', 'flutter test --no-pub --reporter expanded for both transcription services and lyric list => passed in temporary GitHub Actions validation.')
          s = s.replace('TODO — record risks and unverified behavior.', 'Older projects cannot recover previously truncated candidates without re-recognition; old chunk checkpoints are invalidated. Candidate evidence still uses row indices and structural editing clears it. Real-device responsive checks were not performed.')
          s = s.replace('TODO: replace with the actual English imperative subject', 'Preserve all engine disagreement candidates')
          assert 'TODO' not in s
          p.write_text(s)
          PYLOG
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-1740-preserve-disagreement-evidence.md
      - name: Export diagnostics and formatting patch
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess, gzip, base64, pathlib
          patch = subprocess.check_output(['git','diff','--binary'])
          if patch:
            b = base64.b64encode(gzip.compress(patch)).decode()
            for i in range(0,len(b),3000): print(f'::warning title=ARENA_PATCH_{i//3000:04d}::{b[i:i+3000]}')
          for f in ['/tmp/focused.log', '/tmp/gate.log']:
            p=pathlib.Path(f)
            if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              for i,line in enumerate(lines):
                if '[E]' in line or 'Error:' in line or 'Expected:' in line or 'Actual:' in line or 'exception was thrown' in line or 'error •' in line or 'warning •' in line or 'The following assertion was thrown' in line:
                  for msg in lines[i:i+7]: print('::error::'+msg[:800].replace('%','%25'))
          PY

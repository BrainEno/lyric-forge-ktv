name: Arena temporary validation
on:
  push:
    branches: [arena/081929b8-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve dependencies and format
        run: |
          flutter pub get --enforce-lockfile
          dart format lib/features/lyrics/domain/proofreading/proofread_constants.dart lib/features/lyrics/domain/proofreading/proofread_strategy_selector.dart lib/features/lyrics/domain/proofreading/reference_token_aligner.dart test/features/lyrics/domain/proofreading/proofread_constants_contract_test.dart
      - name: Focused tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading 2>&1 | tee /tmp/focused.log
      - name: Quality gate
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 18:43' --slug remove-dead-proofread-constants --title 'Remove unused proofreading constants'
          python3 - <<'PYLOG'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-1843-remove-dead-proofread-constants.md')
          s = p.read_text()
          s = s.replace('TODO — describe the task purpose.', 'Remove unconsumed proofreading constants, clarify ratio versus percentage units, and guard retained constants against losing all production readers (#326).')
          s = s.replace('TODO — list changed files.', 'Proofread constants, token aligner and strategy selector, liveness contract test, proofreading v2 plan, work-log navigation and handoff.')
          s = s.replace('dart format ... => TODO', 'dart format changed Dart files after dependency resolution => passed in temporary GitHub Actions validation.')
          s = s.replace('flutter analyze ... => TODO', 'bash scripts/quality_gate.sh --skip-pub-get => passed in temporary GitHub Actions validation, including analyzer and full suite.')
          s = s.replace('flutter test ... => TODO', 'flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading => passed in temporary GitHub Actions validation.')
          s = s.replace('TODO — record risks and unverified behavior.', 'The lexical liveness contract ignores comments and strings and is not a semantic Dart parser. Prior full-gate run 42364982248 failed on an unrelated intermittent Media Hub TLS Broken pipe; targeted proofreading tests passed. Algorithm values are unchanged.')
          s = s.replace('TODO: replace with the actual English imperative subject', 'Remove unused proofreading constants')
          assert 'TODO' not in s
          p.write_text(s)
          PYLOG
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-1843-remove-dead-proofread-constants.md
      - name: Export diagnostics and formatting patch
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess, gzip, base64, pathlib
          patch = subprocess.check_output(['git','diff','--binary'])
          if patch:
            b = base64.b64encode(gzip.compress(patch)).decode()
            for i in range(0,len(b),3000): print(f'::warning title=ARENA_PATCH_{i//3000:04d}::{b[i:i+3000]}')
          for f in ['/tmp/focused.log', '/tmp/gate.log']:
            p=pathlib.Path(f)
            if p.exists():
              lines=p.read_text(errors='replace').splitlines()
              for i,line in enumerate(lines):
                if '[E]' in line or 'Error:' in line or 'Expected:' in line or 'Actual:' in line or 'exception was thrown' in line or 'error •' in line or 'warning •' in line or 'The following assertion was thrown' in line:
                  for msg in lines[i:i+8]: print('::error::'+msg[:800].replace('%','%25'))
          PY

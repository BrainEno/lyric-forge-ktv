name: Apply Qwen model integrity patch

on:
  push:
    branches:
      - feat/qwen-model-integrity
    paths:
      - ".github/workflows/apply-qwen-model-integrity-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-model-integrity
          fetch-depth: 0

      - name: Patch managed model installer
        run: python tool/apply_qwen_model_integrity_patch.py

      - name: Commit patch and remove one-shot files
        run: |
          git rm .github/workflows/apply-qwen-model-integrity-patch.yml
          git rm tool/apply_qwen_model_integrity_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart
          git commit -m "Verify managed Qwen model downloads"
          git push origin HEAD:feat/qwen-model-integrity

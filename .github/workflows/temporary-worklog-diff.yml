name: Temporary work-log diff

on:
  push:
    branches:
      - feat/asr-transcript-evaluator-20261027
    paths:
      - 'docs/log/entries/**'
      - 'docs/work_log.md'
      - 'docs/work_log_archive.md'
      - 'docs/work_log_index.md'
      - '.github/workflows/temporary-worklog-diff.yml'

permissions:
  contents: read

jobs:
  worklog-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Show exact generated work-log difference
        run: |
          dart tool/work_log.dart write
          git diff -- docs/work_log.md docs/work_log_archive.md docs/work_log_index.md

name: KTV take operation lock validation

on:
  pull_request:
    paths:
      - "lib/features/player/data/services/local_ktv_recording_service.dart"
      - "lib/features/player/presentation/screens/player_screen.dart"
      - "test/features/player/ktv_take_operation_lock_test.dart"
      - ".github/workflows/ktv-take-operation-lock-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/features/player/data/services/local_ktv_recording_service.dart"
      - "lib/features/player/presentation/screens/player_screen.dart"
      - "test/features/player/ktv_take_operation_lock_test.dart"
      - ".github/workflows/ktv-take-operation-lock-validation.yml"

jobs:
  ktv-take-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze KTV take operation changes
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/player/data/services/local_ktv_recording_service.dart
          lib/features/player/presentation/screens/player_screen.dart
          test/features/player/ktv_take_operation_lock_test.dart
      - name: Test KTV take operation locking
        run: >-
          flutter test
          test/features/player/ktv_take_operation_lock_test.dart
          test/features/player/ktv_recording_storage_contract_test.dart
          test/features/player/ktv_take_history_store_test.dart
          test/features/player/ktv_take_mix_path_test.dart
      - name: Full Flutter regression suite
        run: flutter test

# Locking is validated both at service level and against the existing history
# suite because mix export and take metadata share the same session manifest.

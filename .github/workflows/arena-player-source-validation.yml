name: Arena player live source validation
on:
  push:
    branches: [arena/6a6bfd6a-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: dart format lib/features/player/presentation/screens/player_screen.dart test/features/player/project_player_live_sources_test.dart
      - name: Focused session tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/player/project_player_live_sources_test.dart test/features/player/project_audio_session_update_test.dart test/features/project/presentation/project_detail_capability_test.dart test/features/player/ktv_entry_sheet_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp='2026-11-07 18:06'
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug refresh-project-player-sources --title 'Refresh project player source choices from session'
          ENTRY_STAMP="$stamp" python3 - <<'PYCODE'
          import os,re,subprocess
          from pathlib import Path
          stamp=os.environ['ENTRY_STAMP'];run=os.environ['GITHUB_RUN_ID']
          path=Path('docs/log/entries')/(stamp.replace(' ','-').replace(':','')+'-refresh-project-player-sources.md')
          text=path.read_text();text=re.sub(r'^- Validation:\n(?:  - .*\n)+','- Validation: placeholder\n',text,flags=re.M)
          values={
            'Scope':'Keep an open project player source selector and KTV entry aligned with its current session item after a guarded source update.',
            'Files':'Project player screen, widget regression tests, this entry, generated work-log navigation, index and handoff.',
            'Validation':f'Pinned Flutter GitHub Actions run {run} passed Dart format, targeted player/session/import tests, the full quality gate, and work-log new/write/check. Local git diff --check passed. Local Flutter/Dart unavailable; final PR checks reported separately.',
            'Notes':'Matching current project items use their session audio asset rather than a stale project snapshot, including after a rejected sync. Other items fall back to the project snapshot. Widget tests use fake audio and session; no real device playback or manual UI checks were performed. An already open KTV sheet does not live-update; switch-song/reopen fallback and #320 remain.',
            'Commit':'`fix: refresh project player source choices from session`',
          }
          for key,value in values.items():
            text,n=re.subn(rf'^- {key}:.*$',f'- {key}: {value}',text,count=1,flags=re.M)
            if n!=1: raise RuntimeError(key)
          if 'TODO' in text: raise RuntimeError('unfilled TODO')
          path.write_text(text)
          idx=Path('docs/work_log_index.md');text=idx.read_text();old='Real-device playback remains unverified.';new='The open project player now reads source choices from a matching session item. Real-device playback remains unverified.';assert old in text;idx.write_text(text.replace(old,new,1))
          def cmd(*args): return subprocess.check_output(args,text=True).strip() or '(clean)'
          handoff=[
            '# Handoff', '', '## 目标', '', '修复 #320 导入伴奏后已打开工程播放器的音源选项陈旧问题。', '',
            '## Git 现场', '', '- 基线 `d98aadb01e9d606f8e74865e764ccc170a4288f8`；分支 `arena/6a6bfd6a-lyric-forge-ktv`。验证时快照：', '', '```', cmd('git','status','--short'), cmd('git','diff','--stat'), cmd('git','log','--oneline','-5'), '```', '',
            '## 已改文件', '', '- 工程播放器、widget 测试、工作日志与导航。', '',
            '## 检查结果', '', f'- 固定 SDK Actions run {run} 通过定向测试、完整门禁及工作日志检查；本地无 Flutter/Dart。', '- 未进行原生设备播放或手动 UI 检查。', '',
            '## 下一步', '', '- 在真实设备验证播放、暂停、导入、切换音源与切歌竞争，特别是已打开的 KTV 选择面板。', '',
            '## 已知风险', '', '- 已打开的 KTV 选择面板不会跟随会话更新；测试为 fake。原生播放、持久化和跨进程变更仍需验证。', '- 自动分离、人声导入、旧副本清理未完成；Media Hub 上传 deadline 测试历史上间歇失败。', '',
            f'最后更新：{stamp}（Asia/Taipei）', ''
          ]
          Path('docs/handoff.md').write_text(chr(10).join(handoff))
          PYCODE
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-refresh-project-player-sources.md"
          git diff --binary -- docs lib/features/player/presentation/screens/player_screen.dart test/features/player/project_player_live_sources_test.dart > /tmp/arena.patch
          python3 - <<'PY'
          import base64,gzip
          data=base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure diagnostic
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('/tmp/gate.log')
          if not p.exists(): p=Path('/tmp/focused.log')
          if p.exists():
            lines=p.read_text(errors='replace').splitlines(); hits=[i for i,line in enumerate(lines) if '[E]' in line or 'error -' in line]; selected='\n'.join('\n'.join(lines[max(0,i-2):i+22]) for i in hits); selected += '\n=== LOG TAIL ===\n' + '\n'.join(lines[-30:]); data=base64.b64encode(gzip.compress(selected.encode())).decode()
            for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

name: Polish KTV recording result

on:
  push:
    branches:
      - feat/ktv-recording-export
    paths:
      - .github/workflows/polish-ktv-recording-result.yml

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ktv-recording-export
          fetch-depth: 0
      - name: Apply UI polish
        run: python3 tool/polish_ktv_recording_result.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Restore repository analyzer config after Flutter migration
        shell: bash
        run: git checkout HEAD -- analysis_options.yaml
      - name: Analyze final branch config
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test recording slice
        run: flutter test test/features/player/ktv_recording_export_test.dart test/features/player/ktv_microphone_signal_test.dart
      - name: Test full Flutter suite
        run: flutter test
      - name: Commit validated polish
        shell: bash
        run: |
          git rm .github/workflows/polish-ktv-recording-result.yml tool/polish_ktv_recording_result.py
          git checkout HEAD -- analysis_options.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish KTV take remix controls"
          git push origin HEAD:feat/ktv-recording-export

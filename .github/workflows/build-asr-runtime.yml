name: Build managed ASR runtime

on:
  pull_request:
    paths:
      - ".github/workflows/build-asr-runtime.yml"
      - "lib/features/transcription/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-asr-runtime.yml"
      - "lib/features/transcription/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: managed-asr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QWEN_REPO: https://github.com/lumosimmo/qwen3-asr-rs.git
  QWEN_REV: 7984967e8701cc90bb17d06453901036e36ca578
  WHISPER_REPO: https://github.com/ggml-org/whisper.cpp.git
  WHISPER_REV: 927cfce34f31707e17f2bff35c349632fb9e2c3a
  RUNTIME_TAG: asr-runtime-v1

jobs:
  flutter-validation:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout LyricForge
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze blocking errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  windows-cuda:
    name: Windows x64 CUDA runtime
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CUDA_COMPUTE_CAP: "120"

    steps:
      - name: Checkout LyricForge
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure CUDA-supported MSVC toolset
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
          toolset: "14.29"

      - name: Verify MSVC host compiler
        shell: pwsh
        run: |
          where.exe cl.exe
          & cl.exe 2>&1 | Select-Object -First 5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.0"
          method: network
          # nvrtc_dev is required for nvrtc.lib at link time. The runtime-only
          # nvrtc package supplies DLLs but not the import library used by
          # candle/cudarc when linking qwen3-asr on Windows.
          sub-packages: '["nvcc","cudart","cublas","curand","cusparse","cusolver","nvrtc","nvrtc_dev","nvjitlink"]'

      - name: Verify CUDA development libraries
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          $cudaLib = Join-Path $env:CUDA_PATH "lib\x64"
          if (-not (Test-Path $cudaLib)) {
            throw "CUDA library directory not found: $cudaLib"
          }

          $required = @("cudart.lib", "cublas.lib", "cublasLt.lib", "curand.lib", "nvrtc.lib")
          foreach ($library in $required) {
            $path = Join-Path $cudaLib $library
            if (-not (Test-Path $path)) {
              Write-Host "CUDA library contents:"
              Get-ChildItem $cudaLib | Select-Object -ExpandProperty Name | Sort-Object
              throw "Required CUDA development library is missing: $path"
            }
            Write-Host "Found $path"
          }

      - name: Fetch pinned Qwen runtime source
        shell: pwsh
        run: |
          git clone $env:QWEN_REPO qwen-runtime-src
          Set-Location qwen-runtime-src
          git checkout $env:QWEN_REV

      - name: Build Qwen CUDA runtime for RTX 5080
        id: qwen-build
        shell: pwsh
        run: |
          Set-Location qwen-runtime-src
          Write-Host "CUDA_COMPUTE_CAP=$env:CUDA_COMPUTE_CAP (sm_120 / RTX 5080)"
          where.exe cl.exe
          $ErrorActionPreference = 'Continue'
          cargo build --release -p qwen3_asr_cli --features cuda 2>&1 | Tee-Object -FilePath ../qwen-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Qwen CUDA build failure"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Get-Content ../qwen-build.log -Tail 160 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            exit $code
          }

      - name: Upload Qwen CUDA build diagnostics
        if: failure() && steps.qwen-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: qwen-cuda-build-log
          path: qwen-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Fetch pinned whisper.cpp source
        shell: pwsh
        run: |
          git clone $env:WHISPER_REPO whisper-src
          Set-Location whisper-src
          git checkout $env:WHISPER_REV

      - name: Build whisper.cpp CUDA runtime for RTX 5080
        shell: pwsh
        run: |
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120 -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-src/build --config Release --target whisper-cli --parallel 2

      - name: Assemble Windows runtime bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/bin | Out-Null
          New-Item -ItemType Directory -Force runtime/licenses | Out-Null

          Copy-Item qwen-runtime-src/target/release/qwen3-asr.exe runtime/bin/qwen3-asr.exe

          $whisper = Get-ChildItem whisper-src/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $whisper) { throw "whisper-cli.exe not found" }
          Copy-Item $whisper.FullName runtime/bin/whisper-cli.exe

          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $patterns = @("cudart64*.dll","cublas64*.dll","cublasLt64*.dll","curand64*.dll","cusparse64*.dll","cusolver64*.dll","nvrtc64*.dll","nvrtc-builtins64*.dll","nvJitLink*.dll")
          foreach ($pattern in $patterns) {
            Get-ChildItem $cudaBin -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName runtime/bin/ -Force }
          }

          Copy-Item qwen-runtime-src/LICENSE* runtime/licenses/ -ErrorAction SilentlyContinue
          Copy-Item whisper-src/LICENSE runtime/licenses/whisper.cpp-LICENSE

          @{
            schemaVersion = 1
            platform = "windows-x64"
            accelerator = "cuda"
            cuda = "12.8.0"
            hostCompiler = "MSVC 14.29 / v142"
            computeCapability = "12.0"
            cudaArchitecture = "sm_120"
            qwenRevision = $env:QWEN_REV
            whisperRevision = $env:WHISPER_REV
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content runtime/runtime-manifest.json -Encoding UTF8

          Compress-Archive -Path runtime/* -DestinationPath lyricforge-asr-runtime-windows-x64-cuda.zip -CompressionLevel Optimal

      - name: Smoke-check Windows bundle
        shell: pwsh
        run: |
          runtime/bin/qwen3-asr.exe --help
          runtime/bin/whisper-cli.exe --help

      - name: Upload Windows runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricforge-asr-runtime-windows-x64-cuda
          path: lyricforge-asr-runtime-windows-x64-cuda.zip
          if-no-files-found: error
          retention-days: 14

  macos-intel:
    name: macOS Intel runtime
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Checkout LyricForge
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch pinned Qwen runtime source
        run: |
          git clone "$QWEN_REPO" qwen-runtime-src
          cd qwen-runtime-src
          git checkout "$QWEN_REV"

      - name: Build Qwen Intel runtime
        run: |
          cd qwen-runtime-src
          cargo build --release -p qwen3_asr_cli --features accelerate

      - name: Fetch pinned whisper.cpp source
        run: |
          git clone "$WHISPER_REPO" whisper-src
          cd whisper-src
          git checkout "$WHISPER_REV"

      - name: Build whisper.cpp Intel runtime
        run: |
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DGGML_ACCELERATE=ON -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-src/build --config Release --target whisper-cli --parallel 4

      - name: Assemble macOS Intel runtime bundle
        run: |
          mkdir -p runtime/bin runtime/licenses
          cp qwen-runtime-src/target/release/qwen3-asr runtime/bin/qwen3-asr

          WHISPER_BIN="$(find whisper-src/build -type f -name whisper-cli | head -n 1)"
          test -n "$WHISPER_BIN"
          cp "$WHISPER_BIN" runtime/bin/whisper-cli

          chmod +x runtime/bin/qwen3-asr runtime/bin/whisper-cli

          cp qwen-runtime-src/LICENSE* runtime/licenses/ 2>/dev/null || true
          cp whisper-src/LICENSE runtime/licenses/whisper.cpp-LICENSE

          cat > runtime/runtime-manifest.json <<EOF
          {
            "schemaVersion": 1,
            "platform": "macos-x64",
            "accelerator": "accelerate",
            "qwenRevision": "$QWEN_REV",
            "whisperRevision": "$WHISPER_REV"
          }
          EOF

          ditto -c -k --sequesterRsrc --keepParent runtime lyricforge-asr-runtime-macos-x64.zip

      - name: Smoke-check macOS Intel bundle
        run: |
          runtime/bin/qwen3-asr --help
          runtime/bin/whisper-cli --help

      - name: Upload macOS Intel runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricforge-asr-runtime-macos-x64
          path: lyricforge-asr-runtime-macos-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish managed runtime release
    if: github.event_name != 'pull_request'
    needs: [flutter-validation, windows-cuda, macos-intel]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows runtime
        uses: actions/download-artifact@v4
        with:
          name: lyricforge-asr-runtime-windows-x64-cuda
          path: dist

      - name: Download macOS Intel runtime
        uses: actions/download-artifact@v4
        with:
          name: lyricforge-asr-runtime-macos-x64
          path: dist

      - name: Create or update rolling runtime release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RUNTIME_TAG" >/dev/null 2>&1; then
            gh release create "$RUNTIME_TAG" --title "LyricForge ASR Runtime v1" --prerelease --notes "Managed local ASR runtime bundles for LyricForge. Install them from the in-app setup wizard."
          fi
          gh release upload "$RUNTIME_TAG" dist/lyricforge-asr-runtime-windows-x64-cuda.zip dist/lyricforge-asr-runtime-macos-x64.zip --clobber

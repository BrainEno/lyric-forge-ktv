name: Arena reference evidence validation
on:
  push:
    branches: [arena/8a525e83-lyric-forge-ktv]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and publish patch
        run: |
          dart format lib/features/lyrics/domain/proofreading/proofread_review_proposal.dart lib/features/lyrics/domain/proofreading/proofread_v2_review_assembler.dart lib/features/lyrics/domain/proofreading/run_proofread_v2_use_case.dart lib/features/lyrics/presentation/lyric_review_strings.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart test/features/lyrics/domain/proofreading/proofread_v2_evidence_selection_test.dart test/features/lyrics/domain/proofreading/reference_alignment_review_evidence_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/proofread_v2_auto_evidence_test.dart test/features/lyrics/presentation/widgets/reference_alignment_evidence_accessibility_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart
          git diff > /tmp/format.patch
          gzip -c /tmp/format.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=FORMAT" NR "::" $0}'
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Targeted tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/reference_alignment_review_evidence_test.dart test/features/lyrics/domain/proofreading/reference_forced_alignment_planner_test.dart test/features/lyrics/domain/proofreading/proofread_v2_evidence_selection_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/features/lyrics/domain/proofreading/proofread_v2_document_composer_test.dart test/features/lyrics/domain/proofreading/proofread_v2_review_assembler_test.dart test/features/lyrics/presentation/lyric_review_strings_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/proofread_v2_auto_evidence_test.dart test/features/lyrics/presentation/widgets/proofread_v2_options_accessibility_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart test/features/lyrics/presentation/widgets/proofread_v2_review_evidence_accessibility_test.dart test/features/lyrics/presentation/widgets/reference_alignment_evidence_accessibility_test.dart test/architecture_layer_imports_contract_test.dart test/architecture/feature_dependency_graph_test.dart > /tmp/tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            gzip -c /tmp/tests.log | base64 -w0 | fold -w 4000 | awk '{print "::notice title=TESTLOG" NR "::" $0}'
          fi
          exit "$status"

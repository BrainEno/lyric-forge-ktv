name: Temp diagnose

on:
  push:
    branches:
      - arena/40c97524-lyric-forge-ktv
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get
      - name: Repeated full suite
        id: suites
        continue-on-error: true
        run: |
          set +e
          status=0
          for attempt in 1 2 3 4 5 6 7 8; do
            out="/tmp/suite_${attempt}.txt"
            bash scripts/quality_gate.sh --skip-pub-get > "$out" 2>&1
            code=$?
            echo "attempt ${attempt} exit=${code}" >> /tmp/attempts.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          echo "status=${status}" >> /tmp/attempts.txt
          cat /tmp/attempts.txt
          exit "$status"
      - name: Surface results as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          def emit(msg):
              msg = str(msg).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error::' + msg)
          attempts = open('/tmp/attempts.txt').read() if os.path.exists('/tmp/attempts.txt') else 'no attempts recorded'
          for line in attempts.strip().splitlines():
              emit(line)
          for attempt in range(1, 9):
              path = f'/tmp/suite_{attempt}.txt'
              if not os.path.exists(path):
                  continue
              text = open(path, encoding='utf-8', errors='replace').read()
              if 'quality gate (all) passed' in text:
                  emit(f'attempt{attempt}: PASSED')
                  continue
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if '[E]' in line:
                      emit(f'attempt{attempt} FAIL: {line.strip()[:500]}')
                      for follow in lines[i + 1:i + 6]:
                          if follow.strip():
                              emit(f'attempt{attempt}   > {follow.strip()[:400]}')
                      break
          PY
      - name: Fail if the suite failed
        if: steps.suites.outcome == 'failure'
        run: exit 1

name: Temp diagnose

on:
  push:
    branches:
      - arena/40c97524-lyric-forge-ktv
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get
      - name: Format check for changed Dart files
        run: dart format --output=none --set-exit-if-changed test/features/transfer/http_media_hub_upload_test.dart
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos lib test
      - name: Repeat the flaky upload test
        id: repeats
        continue-on-error: true
        run: |
          set +e
          status=0
          for attempt in $(seq 1 1); do
            out="/tmp/repeat_${attempt}.txt"
            flutter test --no-pub --reporter expanded test/tool/forced_alignment_eval_test.dart > "$out" 2>&1
            code=$?
            echo "repeat ${attempt} exit=${code}" >> /tmp/attempts.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          echo "repeat-status=${status}" >> /tmp/attempts.txt
          cat /tmp/attempts.txt
          exit "$status"
      - name: Full suite
        id: suite
        continue-on-error: true
        run: |
          set +e
          status=0
          for attempt in $(seq 1 6); do
            bash scripts/quality_gate.sh --skip-pub-get > "/tmp/suite_${attempt}.txt" 2>&1
            code=$?
            echo "suite ${attempt} exit=${code}" >> /tmp/attempts.txt
            if [ "$code" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Surface results as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          def emit(msg):
              msg = str(msg).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print('::error::' + msg)
          if os.path.exists('/tmp/attempts.txt'):
              for line in open('/tmp/attempts.txt').read().strip().splitlines():
                  if 'exit=1' in line or 'status=1' in line:
                      emit(line)
          candidates = [(f'suite{i}', f'/tmp/suite_{i}.txt') for i in range(1, 7)] + [
                  (f'repeat{n}', f'/tmp/repeat_{n}.txt') for n in range(1, 2)]
          shown = 0
          for name, path in candidates:
              if not os.path.exists(path) or shown >= 3:
                  continue
              text = open(path, encoding='utf-8', errors='replace').read()
              if 'All tests passed' in text:
                  continue
              shown += 1
              lines = [l.rstrip() for l in text.splitlines() if l.strip()]
              marks = [i for i, l in enumerate(lines) if '[E]' in l]
              if not marks:
                  for line in lines[-10:]:
                      emit(f'{name}(no-E)| {line[:500]}')
                  continue
              for index in marks[:2]:
                  for line in lines[index:index + 7]:
                      emit(f'{name}| {line[:600]}')
          PY
      - name: Fail if anything failed
        if: steps.repeats.outcome == 'failure' || steps.suite.outcome == 'failure'
        run: exit 1

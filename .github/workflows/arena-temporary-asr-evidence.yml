name: Temporary independent ASR evidence worklog
on:
  push:
    branches: [arena/737d1be0-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-07 23:30" --slug preserve-independent-asr-evidence --title "Preserve independent ASR transcript evidence"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/log/entries/2026-11-07-2330-preserve-independent-asr-evidence.md')
          s = p.read_text()
          s = s.replace('TODO — describe the task purpose.', 'Retain independent pre-fusion lyrics and timing after successful single-input dual-ASR recognition for a later comparison workflow.')
          s = s.replace('TODO — list changed files.', 'Independent ASR evidence model, high-quality and chunked transcription services and tests, product follow-up, handoff, index, entry and generated work-log navigation.')
          s = s.replace('  - dart format ... => TODO', '  - Pinned Flutter Actions run 42636864433: dart format on changed Dart files after flutter pub get passed.')
          s = s.replace('  - flutter analyze ... => TODO', '  - Pinned Flutter Actions run 42636864433: flutter analyze --no-pub --no-fatal-infos lib test tool passed.')
          s = s.replace('  - flutter test ... => TODO', '  - Pinned Flutter Actions run 42636864433: independent evidence, high-quality transcription and chunked transcription tests passed. Local Flutter/Dart unavailable; final PR checks reported separately.')
          s = s.replace('TODO — record risks and unverified behavior.', 'Snapshots omit engine metadata and raw file paths; invalid, degraded and merged chunk evidence is not exposed as a complete pair. No audio or model hash verifies provenance. Old projects, single-engine and chunked output lack full snapshots; document metadata grows. No UI consumer, safe rerun, automated correction or real-song accuracy verification.')
          s = s.replace('TODO: replace with the actual English imperative subject', 'Preserve independent ASR transcript evidence')
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Return generated patch
        if: always()
        run: |
          git add -N docs/log/entries/2026-11-07-2330-preserve-independent-asr-evidence.md || true
          python3 - <<'PY'
          import base64, gzip, subprocess
          data = base64.b64encode(gzip.compress(subprocess.check_output(['git','diff','--','docs']))).decode()
          for i in range(0, len(data), 3000): print(f'::notice::PATCH{i//3000:03d}:{data[i:i+3000]}')
          PY

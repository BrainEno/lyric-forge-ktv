name: Flutter Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Pushes and pull_request events for the same branch share a slot. When a PR is
# opened, the merge-commit run replaces the older branch-push run.
concurrency:
  group: flutter-quality-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-analyze-test-worklog
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Diagnose formatting of changed Dart files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
        shell: bash
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$GITHUB_REF_NAME" == "main" && -n "$PUSH_BASE_SHA" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha="$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)"
          fi

          if [[ -z "$base_sha" ]]; then
            echo "No base commit is available; skipping changed-file formatting check."
            exit 0
          fi

          mapfile -d '' dart_files < <(
            git diff --name-only -z "$base_sha" "$GITHUB_SHA" -- '*.dart'
          )
          if (("${#dart_files[@]}" == 0)); then
            echo "No Dart files changed; formatting check is not applicable."
            exit 0
          fi

          printf 'Formatting %s changed Dart file(s) for diagnosis.\\n' "${#dart_files[@]}"
          dart format "${dart_files[@]}"
          git diff --stat -- "${dart_files[@]}"
          git diff -- "${dart_files[@]}"

      - name: Run repository quality gate
        run: bash scripts/quality_gate.sh --skip-pub-get

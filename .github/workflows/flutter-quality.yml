name: Flutter Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-analyze-test-worklog
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check platform app identifiers
        run: bash scripts/check_app_identifiers.sh

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      # Catch missing work-log fields and generated-file drift before dependency
      # resolution, analysis, or the full test suite. The scripts also preflight
      # for local invocation outside this workflow.
      - name: Work-log contract preflight
        run: dart tool/work_log.dart check

      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml

      # Check all Dart files touched by this diff. Formatting is blocking, while
      # the file list stays scoped to avoid unrelated historical formatter debt.
      - name: Format check for changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "${GITHUB_SHA}^" "$GITHUB_SHA" -- '*.dart')
          else
            dart_files=()
          fi

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          printf 'Checking %s changed Dart file(s).\n' "${#dart_files[@]}"
          if dart format --output=none --set-exit-if-changed "${dart_files[@]}"; then
            exit 0
          fi

          echo "Formatter differences follow; apply them to the changed Dart files."
          dart format "${dart_files[@]}"
          git --no-pager diff -- "${dart_files[@]}" > /tmp/formatter-diff.txt
          git --no-pager diff -- "${dart_files[@]}"
          # TEMPORARY PR diagnostic: surface the formatter diff as one check annotation
          # because the raw Actions log endpoint is inaccessible in some sandboxes.
          python - <<'PY'
          from pathlib import Path
          diff = Path('/tmp/formatter-diff.txt').read_text(encoding='utf-8')
          escaped = (diff.replace('%', '%25').replace('\r', '%0D')
                     .replace('\n', '%0A').replace(':', '%3A')
                     .replace(',', '%2C'))
          print(f'::error title=TEMPORARY FORMATTER DIAGNOSTIC::{escaped[:60000]}')
          PY
          exit 1

      - name: Run repository quality gate
        shell: bash
        run: |
          mkdir -p build
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/quality-gate.log

      # A failing gate used to surface as nothing but `Process completed with
      # exit code 1`: job logs are not reachable from every environment that
      # debugs this repo, and a bare exit code cannot be turned back into a
      # test name afterwards. Republish the interesting lines as annotations so
      # the failure identifies itself.
      - name: Publish gate failures
        if: failure()
        shell: bash
        run: |
          set +e
          log=build/quality-gate.log
          if [[ ! -f "$log" ]]; then
            echo "::error::quality gate failed before producing a log"
            exit 0
          fi
          {
            grep -nE "error •|warning •" "$log" | head -20
            grep -n "\[E\]" "$log" | head -20
            grep -n -A8 "The following assertion was thrown" "$log" | head -40
            tail -5 "$log"
          } | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done
          exit 0

name: Flutter Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format-analyze-test-worklog
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Check formatting for changed Dart files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t dart_files < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          else
            mapfile -t dart_files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.dart')
          fi

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          printf 'Checking %s changed Dart file(s).\n' "${#dart_files[@]}"
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Run repository quality gate
        run: bash scripts/quality_gate.sh --skip-pub-get

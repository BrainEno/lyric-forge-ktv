name: Windows native build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'test/windows_native_plugin_build_config_test.dart'
      - 'test/core/persistence/atomic_json_file_test.dart'
      - 'lib/features/transfer/data/services/http_media_hub_service.dart'
      - 'lib/features/transcription/data/services/forced_alignment_http_client.dart'
      - 'lib/features/transcription/data/services/managed_asr_runtime_manager.dart'
      - 'lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart'
      - 'lib/features/transcription/data/services/qwen3_asr_native_transcription_service.dart'
      - 'lib/features/transcription/data/services/qwen_native_runtime_session.dart'
      - 'tool/forced_alignment_eval.dart'
      - 'test/tool/forced_alignment_eval_test.dart'
      - 'test/fixtures/qwen_runtime_test_identity/**'
      - 'test/support/qwen_runtime_test_identity.dart'
      - 'test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart'
      - 'test/features/transfer/media_hub_disk_space_probe_contract_test.dart'
      - 'test/features/transcription/forced_alignment_http_client_test.dart'
      - 'test/features/transcription/managed_model_asr_runtime_manager_http_test.dart'
      - 'test/runtime_integrity_install_contract_test.dart'
      - 'test/features/transcription/qwen3_asr_native_transcription_service_test.dart'
      - 'test/features/transcription/qwen3_asr_native_transcription_security_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/windows-native-build-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - run: flutter test test/windows_native_plugin_build_config_test.dart
      - run: flutter test test/core/persistence/atomic_json_file_test.dart
      - run: flutter test test/features/transfer/media_hub_disk_space_probe_contract_test.dart
      - run: flutter test test/features/transcription/forced_alignment_http_client_test.dart
      - run: flutter test test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart
      - run: flutter test test/features/transcription/managed_model_asr_runtime_manager_http_test.dart
      - run: flutter test test/runtime_integrity_install_contract_test.dart
      - run: flutter test test/tool/forced_alignment_eval_test.dart
      - run: flutter test test/features/transcription/qwen3_asr_native_transcription_service_test.dart
      - run: flutter test test/features/transcription/qwen3_asr_native_transcription_security_test.dart
      - run: flutter build windows --debug

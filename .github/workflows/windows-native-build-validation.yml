name: Windows native build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'test/windows_native_plugin_build_config_test.dart'
      - 'test/core/persistence/atomic_json_file_test.dart'
      - 'lib/features/transfer/data/services/http_media_hub_service.dart'
      - 'test/features/transfer/media_hub_disk_space_probe_contract_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/windows-native-build-validation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - run: flutter test test/windows_native_plugin_build_config_test.dart
      - run: flutter test test/core/persistence/atomic_json_file_test.dart
      - run: flutter test test/features/transfer/media_hub_disk_space_probe_contract_test.dart
      - run: flutter build windows --debug

name: Temp probe

on:
  push:
    branches:
      - arena/1680b6b3-lyric-forge-ktv
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get
      - name: Format check
        id: format
        continue-on-error: true
        run: |
          set +e
          dart format lib/features/transcription lib/features/project/presentation/screens/project_detail_screen.dart test/asr_runtime_status_test.dart test/high_quality_transcription_service_test.dart test/transcription_config_test.dart test/features/transcription > /tmp/format.txt 2>&1
          git --no-pager diff > /tmp/format_diff.txt 2>&1
          if git diff --quiet; then code=0; else code=1; fi
          echo "exit=$code" >> /tmp/format.txt
          exit $code
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > /tmp/analyze.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/analyze.txt
          exit $code
      - name: Targeted tests
        id: targeted
        continue-on-error: true
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/high_quality_transcription_service_test.dart test/transcription_config_test.dart test/asr_runtime_status_test.dart test/features/transcription/transcription_environment_preflight_test.dart test/features/transcription/transcription_queue_environment_recovery_test.dart > /tmp/targeted.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/targeted.txt
          exit $code
      - name: Full suite
        id: full
        continue-on-error: true
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get > /tmp/full.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/full.txt
          exit $code
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re

          def emit(message):
              print('::error::' + str(message).replace('%', '%25').replace('\r', '').replace('\n', '%0A'))

          def note(message):
              print('::notice::' + str(message).replace('%', '%25').replace('\r', '').replace('\n', '%0A'))

          def lines_of(path):
              if not os.path.exists(path):
                  return []
              return [l.rstrip() for l in open(path, encoding='utf-8', errors='replace').read().splitlines()]

          for name in ['format', 'analyze', 'targeted', 'full']:
              text = lines_of(f'/tmp/{name}.txt')
              if not text:
                  emit(f'{name}: no output file')
                  continue
              match = None
              for line in reversed(text):
                  found = re.match(r'^exit=(\d+)$', line.strip())
                  if found:
                      match = found
                      break
              code = match.group(1) if match else 'missing'
              note(f'{name} exit={code}')
              if code == '0':
                  continue
              if name == 'format':
                  wanted = [l for l in lines_of('/tmp/format_diff.txt') if l.startswith('@@') or l.startswith('+') or l.startswith('---')]
                  emit('format-diff:\n' + '\n'.join(wanted)[:6000])
                  continue
              if name == 'analyze':
                  hits = [l for l in text if ' error • ' in l or ' warning • ' in l]
                  emit('analyze:\n' + '\n'.join(hits[:20])[:6000])
                  continue
              marks = [i for i, l in enumerate(text) if '[E]' in l]
              if not marks:
                  emit(f'{name}-tail:\n' + '\n'.join(text[-14:])[:4000])
              for index in marks[:3]:
                  emit(f'{name}:\n' + '\n'.join(text[index:index + 9])[:4000])
          PY
      - name: Fail on any failure
        if: steps.format.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.targeted.outcome == 'failure' || steps.full.outcome == 'failure'
        run: exit 1

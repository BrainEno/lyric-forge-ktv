name: Temp Probe

# Temporary verification harness for the locked-down sandbox: runs the pinned
# toolchain on a branch push and publishes diagnostics as annotations, because
# job logs and artifacts are not reachable from the agent sandbox.
# Removed before the pull request is opened.

on:
  push:
    branches:
      - arena/ecafb146-lyric-forge-ktv

permissions:
  contents: write

concurrency:
  group: temp-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        id: format
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$GITHUB_SHA" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files."
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dart format "${dart_files[@]}"
          status=$?
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet; then
            git config user.name "arena-format-bot"
            git config user.email "arena-format-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply dart format [skip ci]"
            git push
          fi
          exit 0

      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > analyze.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          grep -E "^\s*(error|warning)" analyze.log | head -40 || true
          exit 0

      - name: Targeted tests
        id: targeted
        shell: bash
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get --skip-docs --test-only \
            --test-path test/features/lyrics/presentation/widgets/lyric_editor_toolbar_test.dart \
            --test-path test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart \
            --test-path test/features/lyrics/presentation/widgets/unsaved_lyric_edits_dialog_test.dart \
            --test-path test/features/lyrics/presentation/widgets/reference_alignment_backup_restore_test.dart \
            > targeted.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          grep -n "\[E\]" targeted.log | head -10 || true
          exit 0

      - name: Full gate
        id: full
        shell: bash
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get --skip-docs > full.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          grep -n "\[E\]" full.log | head -10 || true
          exit 0

      - name: Report
        shell: bash
        run: |
          emit() {
            local stage="$1" code="$2" log="$3"
            if [[ "$code" == "0" ]]; then
              echo "::notice::${stage}: exit=0"
              return
            fi
            echo "::error::${stage} failed (exit=${code})"
            if [[ -f "$log" ]]; then
              grep -n -m 3 -E "\[E\]|Error:|error:|Exception|failed" "$log" | head -12
            fi
          }
          emit full "${{ steps.full.outputs.exit }}" full.log
          emit targeted "${{ steps.targeted.outputs.exit }}" targeted.log
          emit analyze "${{ steps.analyze.outputs.exit }}" analyze.log
          emit format "${{ steps.format.outputs.exit }}" ""
          echo "--- analyze tail ---"
          tail -25 analyze.log || true
          echo "--- targeted context around failures ---"
          grep -n -B2 -A12 "\[E\]" targeted.log | head -60 || true

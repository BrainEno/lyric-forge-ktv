name: Temp probe

on:
  push:
    branches:
      - 'arena/40c97524-lyric-forge-ktv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          mkdir -p .ci-report
          dart format tool/asr_quality_report.dart \
            lib/features/transcription/data/services/high_quality_transcription_service.dart \
            test/high_quality_transcription_service_test.dart \
            test/tmp_fusion_probe_test.dart > .ci-report/format.txt 2>&1 || true
          cat .ci-report/format.txt
      - name: Probe
        run: |
          set +e
          flutter test --no-pub --reporter expanded test/tmp_fusion_probe_test.dart \
            > .ci-report/probe.txt 2>&1
          code=$?
          echo "probe exit: $code" >> .ci-report/probe.txt
          set -e
          cat .ci-report/probe.txt
          exit $code
      - name: Targeted tests
        run: |
          set +e
          flutter test --no-pub --reporter expanded \
            test/high_quality_transcription_service_test.dart \
            test/tool/asr_quality_report_test.dart \
            > .ci-report/targeted.txt 2>&1
          code=$?
          echo "targeted exit: $code" >> .ci-report/targeted.txt
          set -e
          tail -60 .ci-report/targeted.txt
          exit $code
      - name: Full suite
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > .ci-report/analyze.txt 2>&1
          acode=$?
          echo "analyze exit: $acode" >> .ci-report/analyze.txt
          flutter test --no-pub --reporter compact > .ci-report/full-test.txt 2>&1
          tcode=$?
          echo "full test exit: $tcode" >> .ci-report/full-test.txt
          set -e
          tail -40 .ci-report/analyze.txt
          tail -20 .ci-report/full-test.txt
          [ $acode -eq 0 ] && [ $tcode -eq 0 ]
      - name: Publish
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'ci-probe'
          git config user.email 'ci-probe@users.noreply.github.com'
          git add -A -f -- .ci-report tool lib test
          git diff --cached --quiet || git commit -m 'chore: probe output [skip ci]'
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

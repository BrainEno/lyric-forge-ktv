name: Temp probe

# Temporary verification workflow for a branch that has no local Flutter SDK.
# Deleted before the pull request is opened.
on:
  push:
    branches: [arena/2417fd8c-lyric-forge-ktv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve packages
        run: flutter pub get

      - name: Format check
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git fetch --no-tags origin main
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$(git merge-base HEAD origin/main)" HEAD -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "no changed dart files" > /tmp/format.txt
            exit 0
          fi
          printf '%s\n' "${dart_files[@]}" > /tmp/format_files.txt
          dart format --output=none --set-exit-if-changed "${dart_files[@]}" > /tmp/format.txt 2>&1
          code=$?
          echo "exit=$code" >> /tmp/format.txt
          git --no-pager diff -- "${dart_files[@]}" > /tmp/format_diff.txt 2>&1
          exit $code

      - name: Apply the formatter and push it back
        if: steps.format.outcome == 'failure'
        shell: bash
        run: |
          set -e
          mapfile -t dart_files < /tmp/format_files.txt
          dart format "${dart_files[@]}"
          if git diff --quiet; then
            echo 'No formatting changes to push.'
            exit 0
          fi
          git config user.name 'lyric-forge-format-bot'
          git config user.email 'format-bot@users.noreply.github.com'
          git commit -am 'chore: apply dart format [skip ci]'
          git push origin HEAD:arena/2417fd8c-lyric-forge-ktv

      - name: Analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > /tmp/analyze.txt 2>&1
          echo "exit=$?" >> /tmp/analyze.txt

      - name: Targeted tests
        continue-on-error: true
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get --skip-docs --test-only \
            --test-path test/features/transcription/asr_confidence_test.dart \
            --test-path test/features/project/lyric_document_test.dart \
            --test-path test/features/lyrics/domain/proofreading/asr_first_pipeline_test.dart \
            --test-path test/features/lyrics/domain/proofreading/asr_consensus_analyzer_test.dart \
            --test-path test/features/lyrics/domain/proofreading/asr_repetition_analyzer_test.dart \
            --test-path test/features/lyrics/domain/proofreading/asr_hallucination_filter_test.dart \
            --test-path test/features/lyrics/domain/services/lyric_review_priority_service_test.dart \
            --test-path test/high_quality_transcription_service_test.dart \
            --test-path test/resumable_chunked_transcription_service_test.dart \
            --test-path test/features/transcription/qwen3_asr_native_transcription_service_test.dart \
            --test-path test/features/transcription/transcription_execution_failure_kind_test.dart \
            > /tmp/targeted.txt 2>&1
          echo "exit=$?" >> /tmp/targeted.txt

      - name: Full suite
        continue-on-error: true
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get > /tmp/full.txt 2>&1
          echo "exit=$?" >> /tmp/full.txt

      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import os

          def lines_of(path):
              if not os.path.exists(path):
                  return []
              with open(path, encoding='utf-8', errors='replace') as handle:
                  return handle.read().splitlines()

          def emit(level, message):
              message = (
                  message.replace('%', '%25')
                  .replace('\r', '%0D')
                  .replace('\n', '%0A')
              )
              print(f'::{level}::{message}')

          statuses = {}
          for name, path in (
              ('format', '/tmp/format.txt'),
              ('analyze', '/tmp/analyze.txt'),
              ('targeted', '/tmp/targeted.txt'),
              ('full', '/tmp/full.txt'),
          ):
              rows = [row for row in lines_of(path) if row.strip()]
              statuses[name] = rows[-1] if rows else 'no output'
              emit('notice', f'{name}: ' + statuses[name][:250])

          def chunk(title, path, size=25, limit=2400):
              rows = lines_of(path)
              for index in range(0, len(rows), size):
                  body = '\n'.join(rows[index:index + size])[:limit]
                  if body.strip():
                      emit('failure', f'{title}[{index}]\n' + body)

          if 'exit=0' not in statuses['format']:
              chunk('format', '/tmp/format_diff.txt')
          if 'exit=0' not in statuses['analyze']:
              rows = lines_of('/tmp/analyze.txt')
              problems = [
                  row for row in rows
                  if row.strip().startswith(('error', 'warning'))
              ]
              body = '\n'.join(problems[:40]) or '\n'.join(rows[-40:])
              emit('failure', 'analyze-problems\n' + body[:2400])
          if 'exit=0' not in statuses['targeted']:
              chunk('targeted', '/tmp/targeted.txt')
          if 'exit=0' not in statuses['full']:
              chunk('full', '/tmp/full.txt')
          PY


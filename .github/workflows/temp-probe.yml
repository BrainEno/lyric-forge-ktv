name: Temp probe

on:
  push:
    branches: [arena/cb75c5ca-lyric-forge-ktv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        shell: bash
        run: |
          git config user.name 'probe'
          git config user.email 'probe@users.noreply.github.com'
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then echo "no dart files"; exit 0; fi
          dart format "${dart_files[@]}" > /tmp/format.log 2>&1 || true
          tail -20 /tmp/format.log
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m 'chore: dart format (probe)'
            git push
          fi

      - name: Regenerate work log
        shell: bash
        run: |
          dart tool/work_log.dart write
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m 'docs: regenerate work log (probe)'
            git push
          fi
          dart tool/work_log.dart check

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > /tmp/analyze.log 2>&1
          status=$?
          echo "::error::analyze exit ${status}; lines: $(wc -l < /tmp/analyze.log)"
          grep -nE "error •|warning •|info •" /tmp/analyze.log | head -60 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          tail -n 40 /tmp/analyze.log | while IFS= read -r line; do echo "::error::tail ${line:0:900}"; done
          exit $status

      - name: Quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get > build/quality-gate.log 2>&1
          status=$?
          {
            grep -nE "error •|warning •" build/quality-gate.log | head -20
            grep -n "\[E\]" build/quality-gate.log | head -20
            grep -n -A8 "The following assertion was thrown" build/quality-gate.log | head -40
            tail -5 build/quality-gate.log
          } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status

name: Temp probe

on:
  push:
    branches:
      - arena/6d6b5c65-lyric-forge-ktv
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get
      - name: Format check
        id: format
        continue-on-error: true
        run: |
          dart format lib/features/transcription/data/services/resumable_chunked_transcription_service.dart test/resumable_chunked_transcription_service_test.dart > /tmp/format.txt 2>&1
          git --no-pager diff > /tmp/format_diff.txt 2>&1
          if git diff --quiet; then echo "exit=0" >> /tmp/format.txt; else echo "exit=1" >> /tmp/format.txt; fi
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub --no-fatal-infos lib test > /tmp/analyze.txt 2>&1; echo "exit=$?" >> /tmp/analyze.txt
      - name: Targeted tests
        id: targeted
        continue-on-error: true
        run: |
          flutter test --no-pub --reporter expanded \
            test/resumable_chunked_transcription_service_test.dart \
            test/features/transcription/transcription_execution_failure_kind_test.dart \
            test/high_quality_transcription_service_test.dart \
            > /tmp/targeted.txt 2>&1
          echo "exit=$?" >> /tmp/targeted.txt
      - name: Full suite
        id: full
        continue-on-error: true
        run: |
          bash scripts/quality_gate.sh --skip-pub-get > /tmp/full.txt 2>&1
          echo "exit=$?" >> /tmp/full.txt
      - name: Report
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          def emit(msg):
              print('::error::' + str(msg).replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          for name in ['format', 'analyze', 'targeted', 'full']:
              path = f'/tmp/{name}.txt'
              if not os.path.exists(path):
                  emit(f'{name}: no output')
                  continue
              text = open(path, encoding='utf-8', errors='replace').read()
              m = re.search(r'exit=(\d+)', text)
              code = m.group(1) if m else '?'
              print(f'::notice::{name} exit={code}')
              if code == '0':
                  continue
              lines = [l.rstrip() for l in text.splitlines() if l.strip()]
              if name == 'format':
                  for line in lines[:5]:
                      emit(f'format| {line[:300]}')
                  diff = '/tmp/format_diff.txt'
                  if os.path.exists(diff):
                      for line in [l.rstrip() for l in open(diff, encoding='utf-8', errors='replace').read().splitlines()][:120]:
                          emit(f'fmt| {line[:300]}')
                  continue
              if name == 'analyze':
                  hits = [l for l in lines if ' error • ' in l or ' warning • ' in l]
                  for line in hits[:15]:
                      emit(f'analyze| {line[:400]}')
                  continue
              marks = [i for i, l in enumerate(lines) if '[E]' in l]
              if not marks:
                  for line in lines[-12:]:
                      emit(f'{name}(tail)| {line[:400]}')
              for index in marks[:4]:
                  for line in lines[index:index + 8]:
                      emit(f'{name}| {line[:400]}')
          PY
      - name: Fail on any failure
        if: steps.format.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.targeted.outcome == 'failure' || steps.full.outcome == 'failure'
        run: exit 1

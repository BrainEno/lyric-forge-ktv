name: Temp Probe

# Temporary verification harness for the locked-down sandbox: runs the pinned
# toolchain on a branch push and publishes diagnostics as annotations, because
# job logs and artifacts are not reachable from the agent sandbox.
# Removed before the pull request is opened.

on:
  push:
    branches:
      - arena/cdab028e-lyric-forge-ktv

permissions:
  contents: write

concurrency:
  group: temp-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        id: format
        shell: bash
        run: |
          set +e
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE=$(git merge-base HEAD origin/main)
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files."
            echo "exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dart format "${dart_files[@]}" > fmt.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat fmt.log
          if ! git diff --quiet; then
            git config user.name "arena-format-bot"
            git config user.email "arena-format-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply dart format [skip ci]"
            git push
          fi
          exit 0

      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test > analyze.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          { grep -E "error •|warning •|Error:" analyze.log | head -20; } > diag-analyze.log
          cat diag-analyze.log
          exit 0

      - name: Targeted tests
        id: targeted
        shell: bash
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get --skip-docs --test-only \
            --test-path test/features/lyrics/domain/models/lyric_review_queue_test.dart \
            --test-path test/features/lyrics/presentation/widgets/lyric_editor_toolbar_test.dart \
            --test-path test/features/lyrics/domain/services/lyric_review_priority_service_test.dart \
            > targeted.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            grep -nE "Expected:|Actual:|Which:|was thrown running a test" targeted.log | head -8
            grep -n "\[E\]" targeted.log | head -6
          } > diag-targeted.log
          cat diag-targeted.log
          exit 0

      - name: Full gate
        id: full
        shell: bash
        run: |
          set +e
          bash scripts/quality_gate.sh --skip-pub-get > full.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            grep -nE "Expected:|Actual:|Which:|was thrown running a test|\[work-log\]|summary-stale|entry-" full.log | head -8
            grep -n "\[E\]" full.log | head -6
          } > diag-full.log
          cat diag-full.log
          exit 0

      - name: Report
        if: always()
        shell: bash
        run: |
          set +e
          echo "::notice::format=${{ steps.format.outputs.exit }} analyze=${{ steps.analyze.outputs.exit }} targeted=${{ steps.targeted.outputs.exit }} full=${{ steps.full.outputs.exit }}"
          emit() {
            stage="$1"; code="$2"; diag="$3"
            if [[ "$code" == "0" ]]; then
              echo "::notice::${stage} ok"
              return 0
            fi
            echo "::error::${stage} failed (exit=${code})"
            [[ -f "$diag" ]] || return 0
            local n=0
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              n=$((n+1))
              [[ $n -gt 10 ]] && break
              echo "::error::${stage} :: ${line:0:800}"
            done < "$diag"
            return 0
          }
          emit format "${{ steps.format.outputs.exit }}" ""
          emit analyze "${{ steps.analyze.outputs.exit }}" diag-analyze.log
          emit targeted "${{ steps.targeted.outputs.exit }}" diag-targeted.log
          emit full "${{ steps.full.outputs.exit }}" diag-full.log
          exit 0

name: macOS persistence validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/core/persistence/atomic_json_file.dart'
      - 'test/core/persistence/atomic_json_file_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/macos-persistence-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/core/persistence/atomic_json_file.dart'
      - 'test/core/persistence/atomic_json_file_test.dart'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/macos-persistence-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-atomic-json:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      # Issue #221: the AtomicJsonFile stage fault-injection tests must run on
      # a real APFS filesystem. POSIX rename-overwrite semantics are already
      # covered on Ubuntu by the universal gate and on Windows by the
      # windows-native-build-validation workflow; this closes the macOS leg.
      - run: flutter test test/core/persistence/atomic_json_file_test.dart

# TEMPORARY validation workflow for issue #415. The sandbox that authored this
# branch has no Dart or Rust toolchain and cannot read job logs, so this
# workflow formats the changed Dart files, runs the full quality gate and
# compiles/tests the Rust session-auth patch on Linux, republishing results as
# annotations. It is deleted again before the pull request is opened.
name: TEMP session-auth validation

on:
  push:
    branches: [arena/12673259-lyric-forge-ktv]

permissions:
  contents: write

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Format changed Dart files and push the result
        shell: bash
        run: |
          set +e
          mapfile -t files < <(git diff --name-only --diff-filter=AM 458b14c76851e9f463428dfe7e43bfff49bfcb34 HEAD -- '*.dart')
          printf 'format target: %s\n' "${files[@]}"
          dart format "${files[@]}"
          if ! git diff --quiet; then
            git diff --stat | while IFS= read -r line; do echo "::warning::formatted ${line}"; done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Apply dart format to session-auth changes"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "::notice::dart format: all ${#files[@]} changed files already formatted"
          fi
          exit 0

      - name: Work log write
        shell: bash
        run: |
          set +e
          dart tool/work_log.dart write
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Regenerate work log summaries"
            git pull --rebase -q origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "::notice::work_log write produced changes (committed)"
          fi
          exit 0

      - name: Analyze and test
        shell: bash
        run: |
          set +e +o pipefail
          mkdir -p build
          emit() {
            # One annotation per chunk of lines, to stay under the per-step cap.
            level=$1; title=$2; file=$3
            [[ -s "$file" ]] || return 0
            split -l 25 "$file" "$file.part."
            for part in "$file".part.*; do
              msg=$(sed -e 's/%/%25/g' "$part" | cut -c1-400 | awk '{printf "%s%%0A", $0}')
              echo "::$level title=$title::$msg"
            done
          }
          dart tool/work_log.dart check > build/worklog.log 2>&1; wl=$?
          echo "::notice::work_log check exit=$wl"
          emit notice worklog build/worklog.log
          flutter pub get --enforce-lockfile > build/pub.log 2>&1
          flutter analyze --no-pub --no-fatal-infos lib test tool > build/analyze.log 2>&1; an=$?
          echo "::notice::flutter analyze exit=$an; $(tail -1 build/analyze.log)"
          grep -E "error •|warning •" build/analyze.log > build/analyze-errors.txt
          emit error analyze build/analyze-errors.txt
          git diff --name-only 458b14c76851e9f463428dfe7e43bfff49bfcb34 HEAD -- '*.dart' > build/changed.txt
          grep -F -f build/changed.txt build/analyze.log | grep "info •" > build/analyze-infos-changed.txt
          emit warning analyze-infos-in-changed-files build/analyze-infos-changed.txt
          flutter test --no-pub --reporter expanded > build/test.log 2>&1; ts=$?
          echo "::notice::flutter test exit=$ts; $(grep -oE '[0-9]+:[0-9]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: [^\r]*' build/test.log | tail -1)"
          grep -E "\[E\]$" build/test.log | sed -E 's/^[0-9:]+ [^:]*: //' | sort -u > build/failed.txt
          emit error failed-tests build/failed.txt
          grep -n -E -A14 "^══╡ EXCEPTION|The following .* was thrown|^  Expected:|^Expected:" build/test.log | head -400 > build/failure-details.txt
          emit error failure-details build/failure-details.txt
          flutter test --no-pub --reporter expanded test/features/transcription/qwen_runtime_session_test.dart test/features/transcription/qwen_runtime_service_lifecycle_test.dart test/features/transcription/forced_alignment_http_client_test.dart test/features/transcription/qwen3_asr_native_transcription_service_test.dart test/qwen_runtime_security_contract_test.dart test/asr_runtime_release_workflow_contract_test.dart test/runtime_integrity_install_contract_test.dart > build/focused.log 2>&1; fs=$?
          echo "::notice::focused security/Qwen/ForcedAligner tests exit=$fs; $(grep -oE '[0-9]+:[0-9]+ \+[0-9]+( ~[0-9]+)?( -[0-9]+)?: [^\r]*' build/focused.log | tail -1)"
          if [[ $an -ne 0 || $ts -ne 0 || $wl -ne 0 ]]; then exit 1; fi

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Never used (workflow contract requires the shared Flutter pin reference)
        if: false
        uses: ./.github/actions/setup-flutter

      - uses: dtolnay/rust-toolchain@stable

      - name: Patch and test the runtime
        shell: bash
        run: |
          set +e +o pipefail
          git clone -q https://github.com/lumosimmo/qwen3-asr-rs.git qwen-runtime-src
          cd qwen-runtime-src
          git checkout -q 7984967e8701cc90bb17d06453901036e36ca578
          git apply "$GITHUB_WORKSPACE/tool/patches/qwen3-asr-eager-attention-contiguous.patch" || echo "::error::eager patch failed"
          git apply "$GITHUB_WORKSPACE/tool/patches/qwen3-asr-forced-align-http-endpoint.patch" || echo "::error::align patch failed"
          cd ..
          python3 tool/patches/apply-qwen-align-route.py || echo "::error::align route script failed"
          cd qwen-runtime-src
          git apply --check "$GITHUB_WORKSPACE/tool/patches/qwen3-asr-session-auth.patch" || echo "::error::session patch does not apply"
          git apply "$GITHUB_WORKSPACE/tool/patches/qwen3-asr-session-auth.patch"
          run() {
            label=$1; shift
            "$@" > "../$label.log" 2>&1
            code=$?
            echo "::notice::$label exit=$code"
            {
              grep -nE "^(error|warning)(\[[A-Z0-9]+\])?:" "../$label.log" | head -30
              grep -nE -A6 "^error(\[[A-Z0-9]+\])?:" "../$label.log" | head -150
              grep -nE "panicked at|FAILED|failures:|^---- " "../$label.log" | head -40
              grep -nE -A8 "^---- " "../$label.log" | head -120
            } | while IFS= read -r line; do echo "::error::$label: ${line:0:900}"; done
            grep -nE "^test result:|^running [0-9]+ test" "../$label.log" | while IFS= read -r line; do echo "::notice::$label: $line"; done
            return $code
          }
          overall=0
          run unit cargo test --release -p qwen3_asr_cli --bin qwen3-asr session_auth || overall=1
          run integration cargo test --release -p qwen3_asr_cli --test session_auth_integration || overall=1
          run serve_regression cargo test --release -p qwen3_asr_cli --test serve_integration || overall=1
          exit $overall

name: Temporary formatter diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Publish canonical formatter diff as annotations
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t dart_files < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$GITHUB_SHA" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo 'No changed Dart files.'
            exit 0
          fi
          set +e
          dart format --output=none --set-exit-if-changed "${dart_files[@]}" >/tmp/format-check.txt 2>&1
          result=$?
          set -e
          if (( result == 0 )); then
            echo 'Pinned Dart formatter agrees with the PR files.'
            exit 0
          fi
          dart format "${dart_files[@]}" >/dev/null
          {
            echo 'Canonical dart format diff:'
            git --no-pager diff -- "${dart_files[@]}"
          } | while IFS= read -r line; do
            line="${line:0:1000}"
            echo "::error title=Canonical Dart formatter diff::${line}"
          done
      - name: Publish analyzer diagnostics
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos lib test tool >/tmp/analyze-debug.txt 2>&1
          result=$?
          set -e
          if (( result != 0 )); then
            grep -E 'error •|warning •|Error:' /tmp/analyze-debug.txt | head -60 | while IFS= read -r line; do
              line="${line:0:1000}"
              echo "::error title=Analyzer diagnostic::${line}"
            done
          else
            echo 'Pinned Flutter analyzer passed.'
          fi
      - name: Run focused project-save tests
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter expanded \
            test/file_project_repository_test.dart \
            test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart \
            test/features/lyrics/presentation/widgets/project_save_conflict_dialog_test.dart \
            >/tmp/save-tests.txt 2>&1
          result=$?
          set -e
          if (( result != 0 )); then
            tail -80 /tmp/save-tests.txt | while IFS= read -r line; do
              line="${line:0:1000}"
              echo "::error title=Focused test diagnostic::${line}"
            done
          else
            echo 'Focused project-save tests passed.'
          fi

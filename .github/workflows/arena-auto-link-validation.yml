name: Arena auto-link error validation
on:
  push:
    branches: [arena/0d970784-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/project/data/repositories/file_project_repository.dart test/file_project_repository_test.dart
      - name: Focused project and linking tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/file_project_repository_test.dart test/features/player/playback_lyrics_project_linker_test.dart test/features/player/playback_lyrics_read_failure_test.dart test/features/transcription/local_project_transcription_cancellation_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug handle-background-lyric-link-failures --title 'Handle background lyric link failures'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os, re
          from pathlib import Path
          stamp = os.environ['ENTRY_STAMP']
          path = Path('docs/log/entries') / (stamp.replace(' ', '-').replace(':', '') + '-handle-background-lyric-link-failures.md')
          s = path.read_text()
          s = re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', s, flags=re.M)
          replacements = {
              'Scope': 'Prevent first-lyric background association failures from escaping as uncaught asynchronous errors after a project has already been saved.',
              'Files': 'FileProjectRepository, file project repository regression tests, index, handoff, this entry and generated work-log navigation.',
              'Validation': f"Local Flutter/Dart SDKs unavailable. Pinned GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused project, lyric-linking, player and transcription cancellation tests and the full repository quality gate; Dart format and work-log new/write/check ran there. Final PR checks reported separately. git diff --check ran locally.",
              'Notes': 'Background failures log the original error and stack, and an optional observer can receive them; an observer failure is also caught and logged. File-backed corrupted metadata, injected read/write failures and existing successful linking are tested. A failed association is not surfaced in the current UI or automatically retried; explicit awaited linking retains its error semantics. Local diagnostic errors may contain file paths. No native playback or manual UI checks performed.',
              'Commit': '`fix: handle background lyric link failures`',
          }
          for key, value in replacements.items():
              s, count = re.subn(rf'^- {key}:.*$', f'- {key}: {value}', s, count=1, flags=re.M)
              if count != 1: raise RuntimeError(f'missing {key}')
          if 'TODO' in s: raise RuntimeError('unfilled TODO')
          path.write_text(s)
          idx = Path('docs/work_log_index.md')
          text = idx.read_text()
          old = '- Playback lyric resolution fails closed on propagated read errors and incomplete file-backed media metadata, while display reads remain best effort. Project stores reject partial or duplicate records; other stores may skip malformed records. Cached loads require restart after repair; link writes lack compare-and-swap protection, and first-lyric background linking can report unhandled errors.'
          new = '- Playback lyric resolution fails closed on propagated read errors and incomplete file-backed media metadata, while display reads remain best effort. Project stores reject partial or duplicate records; other stores may skip malformed records. Cached loads require restart after repair; link writes lack compare-and-swap protection. First-lyric background link failures are caught and logged but have no user-facing warning or automatic retry.'
          if old not in text: raise RuntimeError('expected follow-up missing')
          idx.write_text(text.replace(old, new))
          Path('docs/handoff.md').write_text(f"""# Handoff\n\n## 目标\n\n处理 #223 的工程首次保存歌词时后台关联异常：保护已保存的歌词，捕获并记录关联失败；提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `6baa26fad090998f73a7b7bc622c1819f533185b`；分支 `arena/0d970784-lyric-forge-ktv`。\n- 最终提交、PR 和检查状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 工程文件仓库及其回归测试、工作日志与本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart；固定 SDK GitHub Actions run {os.environ['GITHUB_RUN_ID']} 通过定向测试及完整质量门禁，并执行 format、work-log new/write/check。最终 head 的检查以 Actions 为准。\n- 本地提交前执行 `git diff --check`；未做真实设备或手动 UI 测试。\n\n## 下一步\n\n确认 PR 最终质量门禁并报告；#223 其余测试覆盖缺口继续保留。\n\n## 已知风险\n\n- 自动关联失败仅记录诊断并可通过回调观察，当前 UI 不会提醒，也不会自动重试；显式关联调用仍传播错误。日志中的错误可能含本地路径。\n- 音乐库列表仍可能从部分展示数据产生不确定歌词标记；跨进程竞态和存储实例缓存问题仍在。\n\n最后更新：{stamp}（Asia/Taipei）\n""")
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-handle-background-lyric-link-failures.md"
          git diff --binary -- lib/features/project/data/repositories/file_project_repository.dart test/file_project_repository_test.dart docs > /tmp/arena.patch
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure log
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          p = Path('/tmp/gate.log')
          if not p.exists(): p = Path('/tmp/focused.log')
          if p.exists():
              data = base64.b64encode(gzip.compress(p.read_bytes()[-350000:])).decode()
              for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

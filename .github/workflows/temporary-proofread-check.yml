name: Temporary proofread check
on:
  push:
    branches: [arena/039c9439-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting and generate work log
        run: |
          dart format --output=none --set-exit-if-changed lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart
          dart tool/work_log.dart new --timestamp '2026-11-07 23:54' --slug proofread-v2-text-diff --title 'Highlight differences in proofreading proposals'
          echo '' | base64 -d > docs/log/entries/2026-11-07-2354-proofread-v2-text-diff.md
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2354-proofread-v2-text-diff.md
          git diff | gzip -c | base64 -w0 > /tmp/patch64
          python3 - <<'PYCODE'
          s = open('/tmp/patch64').read()
          for i in range(0, len(s), 3000):
              print('::notice title=PATCH%03d::%s' % (i // 3000, s[i:i+3000]))
          PYCODE

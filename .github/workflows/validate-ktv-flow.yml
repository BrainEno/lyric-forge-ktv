name: Validate KTV flow

on:
  push:
    branches:
      - feat/ktv-entry-backing-mode
    paths:
      - .github/workflows/validate-ktv-flow.yml

permissions:
  contents: write

jobs:
  flutter-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ktv-entry-backing-mode
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test full suite
        run: flutter test

      - name: Record validated slice and clean temporary workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/work_log.md')
          text = path.read_text(encoding='utf-8')
          marker = '### [2026-10-09 12:14] 增加播放器麦克风 KTV 入口与伴唱模式'
          if marker not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '''\n### [2026-10-09 12:14] 增加播放器麦克风 KTV 入口与伴唱模式\n\n- Scope: 在已有同步歌词的播放器顶部增加麦克风 KTV 入口；进入前让用户选择“原唱伴唱”或“纯伴奏”，选择后切换音源并直接进入全屏 KTV。全屏 KTV 中继续允许在这两种演唱音轨之间切换，隔离人声轨不作为 KTV 背景音源暴露。\n- Files: `lib/features/player/domain/models/ktv_backing_mode.dart`, `lib/features/player/presentation/screens/player_screen.dart`, `test/features/player/ktv_backing_mode_test.dart`\n- Validation:\n  - `flutter analyze --no-fatal-infos --no-fatal-warnings` => success\n  - `flutter test` => success\n- Notes: “原唱伴唱”映射现有 original mix，“纯伴奏”映射 instrumental stem；底层 `switchSource` 会保留当前播放位置和播放状态。没有 instrumental 时纯伴奏选项明确禁用并提示先生成伴奏轨。\n- Commit: `Add microphone KTV entry and backing choice`\n'''
              path.write_text(text, encoding='utf-8')

      - name: Commit validation record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-ktv-flow.yml
          git add docs/work_log.md
          git commit -m "Record KTV entry validation"
          git push origin HEAD:feat/ktv-entry-backing-mode

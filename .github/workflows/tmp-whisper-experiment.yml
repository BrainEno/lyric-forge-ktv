name: tmp whisper experiment

on:
  push:
    branches: [arena/c21298fd-lyric-forge-ktv]
    paths:
      - ".github/tmp-whisper-exp/**"
      - ".github/workflows/tmp-whisper-experiment.yml"

permissions:
  contents: write

env:
  WHISPER_REV: 927cfce34f31707e17f2bff35c349632fb9e2c3a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Build whisper-cli
        run: |
          git init -q whisper-src
          git -C whisper-src remote add origin https://github.com/ggml-org/whisper.cpp
          git -C whisper-src fetch -q --depth 1 origin "$WHISPER_REV"
          git -C whisper-src checkout -q FETCH_HEAD
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build whisper-src/build -j 4 --target whisper-cli
          cp whisper-src/build/bin/whisper-cli ./whisper-cli
          ./whisper-cli -h 2>&1 | grep -E "max-context|suppress-nst|prompt" || true
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli
          path: whisper-cli

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        song:
          - Ridgway_-_Fire_Inside
          - Avercage_-_Embers
          - The_Rinn_-_Voices__2017_Version_
          - The.madpix.project_-_One_Way_Street
          - Songwriterz_-_Back_In_Time
          - Kinematic_-_Peyote
        config: [lyrics_v1, standard, mc0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli
      - name: Tools and model
        run: |
          chmod +x whisper-cli
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          mkdir -p models
          curl -sSfL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin" -o models/ggml-large-v3.bin
          ls -la models
      - name: Song (JamendoLyrics, CC licensed)
        run: |
          mkdir -p songs
          curl -sSfL "https://raw.githubusercontent.com/f90/jamendolyrics/master/mp3/${{ matrix.song }}.mp3" -o "songs/${{ matrix.song }}.mp3"
          ffmpeg -nostdin -y -loglevel error -i "songs/${{ matrix.song }}.mp3" -ac 1 -ar 16000 -c:a pcm_s16le "songs/${{ matrix.song }}.wav"
      - name: Run
        run: |
          python3 .github/tmp-whisper-exp/run.py --bin ./whisper-cli --model models/ggml-large-v3.bin --wav "songs/${{ matrix.song }}.wav" --song "${{ matrix.song }}" --config ${{ matrix.config }} --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: results

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: References
        run: |
          mkdir -p songs
          for n in Ridgway_-_Fire_Inside Avercage_-_Embers The_Rinn_-_Voices__2017_Version_ The.madpix.project_-_One_Way_Street Songwriterz_-_Back_In_Time Kinematic_-_Peyote; do
            curl -sSfL "https://raw.githubusercontent.com/f90/jamendolyrics/master/annotations/lines/$n.csv" -o "songs/$n.csv"
          done
      - name: Report
        run: |
          mkdir -p .ci-tmp/whisper-exp
          python3 .github/tmp-whisper-exp/report.py songs results .ci-tmp/whisper-exp/report.md || echo "report failed" >> .ci-tmp/whisper-exp/report.md
          cp -r results .ci-tmp/whisper-exp/raw
      - name: Commit
        run: |
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add .ci-tmp
          git commit -qm "ci: whisper experiment results" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && break; sleep 5; done

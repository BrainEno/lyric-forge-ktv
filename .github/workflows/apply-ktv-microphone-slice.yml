name: Apply KTV microphone slice

on:
  push:
    branches:
      - feat/ktv-microphone-monitoring
    paths:
      - .github/workflows/apply-ktv-microphone-slice.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
          fetch-depth: 0

      - name: Apply product wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Dependencies: audio_io provides low-latency duplex PCM; permission_handler
          # handles runtime microphone permission on Android/Apple platforms.
          replace_once(
              'pubspec.yaml',
              '  audio_session: ^0.2.4\n',
              '  audio_session: ^0.2.4\n  audio_io: ^0.6.1\n  permission_handler: ^12.0.3\n',
          )

          replace_once(
              'android/app/src/main/AndroidManifest.xml',
              '    <uses-permission android:name="android.permission.CAMERA"/>\n',
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n',
          )

          replace_once(
              'ios/Runner/Info.plist',
              '\t<key>NSCameraUsageDescription</key>\n\t<string>用于扫描 Elysium Player 桌面端生成的配对二维码。</string>\n',
              '\t<key>NSCameraUsageDescription</key>\n\t<string>用于扫描 Elysium Player 桌面端生成的配对二维码。</string>\n'
              '\t<key>NSMicrophoneUsageDescription</key>\n\t<string>用于 KTV 演唱时实时监听你的麦克风输入。</string>\n',
          )

          replace_once(
              'macos/Runner/Info.plist',
              '\t<key>NSMainNibFile</key>\n',
              '\t<key>NSMicrophoneUsageDescription</key>\n\t<string>用于 KTV 演唱时实时监听你的麦克风输入。</string>\n'
              '\t<key>NSMainNibFile</key>\n',
          )

          for entitlement in [
              'macos/Runner/DebugProfile.entitlements',
              'macos/Runner/Release.entitlements',
          ]:
              replace_once(
                  entitlement,
                  '    <key>com.apple.security.app-sandbox</key>\n    <true/>\n',
                  '    <key>com.apple.security.app-sandbox</key>\n    <true/>\n'
                  '    <key>com.apple.security.device.audio-input</key>\n    <true/>\n',
              )

          for podfile, flutter_settings in [
              ('ios/Podfile', '    flutter_additional_ios_build_settings(target)\n'),
              ('macos/Podfile', '    flutter_additional_macos_build_settings(target)\n'),
          ]:
              replace_once(
                  podfile,
                  flutter_settings,
                  flutter_settings
                  + "    target.build_configurations.each do |config|\n"
                  + "      definitions = config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] || ['$(inherited)']\n"
                  + "      config.build_settings['GCC_PREPROCESSOR_DEFINITIONS'] = definitions + ['PERMISSION_MICROPHONE=1']\n"
                  + "    end\n",
              )

          replace_once(
              'lib/core/services/service_locator.dart',
              "import '../../features/player/data/services/just_audio_player_service.dart';\n",
              "import '../../features/player/data/services/audio_io_ktv_microphone_service.dart';\n"
              "import '../../features/player/data/services/just_audio_player_service.dart';\n",
          )
          replace_once(
              'lib/core/services/service_locator.dart',
              "import '../../features/player/domain/services/audio_player_service.dart';\n",
              "import '../../features/player/domain/services/audio_player_service.dart';\n"
              "import '../../features/player/domain/services/ktv_microphone_service.dart';\n",
          )
          replace_once(
              'lib/core/services/service_locator.dart',
              '  late final AudioPlayerService audioPlayerService;\n',
              '  late final AudioPlayerService audioPlayerService;\n'
              '  late final KtvMicrophoneService ktvMicrophoneService;\n',
          )
          replace_once(
              'lib/core/services/service_locator.dart',
              '    final rawAudioPlayer = JustAudioPlayerService();\n',
              '    final rawAudioPlayer = JustAudioPlayerService();\n'
              '    ktvMicrophoneService = AudioIoKtvMicrophoneService();\n',
          )

          replace_once(
              'lib/features/player/data/services/just_audio_player_service.dart',
              '  Future<void> setVolume(double volume) => _player.setVolume(volume);\n',
              '  Future<void> setVolume(double volume) async {\n'
              '    await _player.setVolume(volume.clamp(0.0, 1.0).toDouble());\n'
              '    _updateState();\n'
              '  }\n',
          )

          player = Path('lib/features/player/presentation/screens/player_screen.dart')
          text = player.read_text()

          old_import = "import '../../domain/models/ktv_backing_mode.dart';\nimport '../../domain/models/playback_state.dart';\nimport '../../domain/services/audio_player_service.dart';\n"
          new_import = "import '../../domain/models/ktv_backing_mode.dart';\nimport '../../domain/models/ktv_microphone_state.dart';\nimport '../../domain/models/playback_state.dart';\nimport '../../domain/services/audio_player_service.dart';\nimport '../../domain/services/ktv_microphone_service.dart';\n"
          if old_import not in text:
              raise SystemExit('Player imports anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_state = "class _FullScreenKtvViewState extends State<_FullScreenKtvView> {\n  late ProjectManifest _project;\n  StreamSubscription<PlaybackSessionState>? _sessionSubscription;\n  int _projectLoadGeneration = 0;\n\n  @override\n  void initState() {\n    super.initState();\n    _project = widget.initialProject;\n    AppChromeController.enterImmersive();\n"
          new_state = "class _FullScreenKtvViewState extends State<_FullScreenKtvView> {\n  late ProjectManifest _project;\n  late final KtvMicrophoneService _microphoneService;\n  StreamSubscription<PlaybackSessionState>? _sessionSubscription;\n  int _projectLoadGeneration = 0;\n\n  @override\n  void initState() {\n    super.initState();\n    _project = widget.initialProject;\n    _microphoneService = ServiceLocatorGlobal.I.ktvMicrophoneService;\n    AppChromeController.enterImmersive();\n"
          if old_state not in text:
              raise SystemExit('Fullscreen KTV state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_before_dispose = "    setState(() => _project = nextProject);\n  }\n\n  @override\n  void dispose() {\n    _sessionSubscription?.cancel();\n    AppChromeController.exitImmersive();\n"
          new_before_dispose = "    setState(() => _project = nextProject);\n  }\n\n  Future<void> _openMicrophoneControls() async {\n    await showModalBottomSheet<void>(\n      context: context,\n      useSafeArea: true,\n      isScrollControlled: true,\n      showDragHandle: true,\n      backgroundColor: AppColors.bgElevated,\n      builder: (context) => _KtvAudioControlsSheet(\n        microphoneService: _microphoneService,\n        audioService: widget.audioService,\n      ),\n    );\n  }\n\n  @override\n  void dispose() {\n    _sessionSubscription?.cancel();\n    unawaited(_microphoneService.stopMonitoring());\n    AppChromeController.exitImmersive();\n"
          if old_before_dispose not in text:
              raise SystemExit('Fullscreen KTV dispose anchor not found')
          text = text.replace(old_before_dispose, new_before_dispose, 1)

          old_exit = "                            SizedBox(\n                              width: spec.minimumInteractiveExtent,\n                              height: spec.minimumInteractiveExtent,\n                              child: IconButton.filledTonal(\n                                tooltip: '退出全屏 KTV',\n                                onPressed: () => Navigator.pop(context),\n                                icon: const Icon(Icons.fullscreen_exit_rounded),\n                              ),\n                            ),\n"
          new_exit = "                            StreamBuilder<KtvMicrophoneState>(\n                              stream: _microphoneService.stateStream,\n                              initialData: _microphoneService.currentState,\n                              builder: (context, microphoneSnapshot) {\n                                final microphone = microphoneSnapshot.data ??\n                                    _microphoneService.currentState;\n                                return SizedBox(\n                                  width: spec.minimumInteractiveExtent,\n                                  height: spec.minimumInteractiveExtent,\n                                  child: IconButton.filledTonal(\n                                    tooltip: microphone.isMonitoring\n                                        ? '麦克风监听已开启'\n                                        : '麦克风与音量',\n                                    onPressed: _openMicrophoneControls,\n                                    icon: Icon(\n                                      microphone.isMonitoring\n                                          ? Icons.mic_rounded\n                                          : Icons.mic_none_rounded,\n                                    ),\n                                  ),\n                                );\n                              },\n                            ),\n                            const SizedBox(width: AppSpacing.sm),\n                            SizedBox(\n                              width: spec.minimumInteractiveExtent,\n                              height: spec.minimumInteractiveExtent,\n                              child: IconButton.filledTonal(\n                                tooltip: '退出全屏 KTV',\n                                onPressed: () => Navigator.pop(context),\n                                icon: const Icon(Icons.fullscreen_exit_rounded),\n                              ),\n                            ),\n"
          if old_exit not in text:
              raise SystemExit('Fullscreen exit button anchor not found')
          text = text.replace(old_exit, new_exit, 1)

          sheet = r'''class _KtvAudioControlsSheet extends StatelessWidget {
  final KtvMicrophoneService microphoneService;
  final AudioPlayerService audioService;

  const _KtvAudioControlsSheet({
    required this.microphoneService,
    required this.audioService,
  });

  @override
  Widget build(BuildContext context) {
    final spec = AppResponsive.of(context);
    return StreamBuilder<KtvMicrophoneState>(
      stream: microphoneService.stateStream,
      initialData: microphoneService.currentState,
      builder: (context, microphoneSnapshot) {
        final microphone =
            microphoneSnapshot.data ?? microphoneService.currentState;
        return StreamBuilder<PlaybackState>(
          stream: audioService.stateStream,
          initialData: audioService.currentState,
          builder: (context, playbackSnapshot) {
            final playback = playbackSnapshot.data ?? audioService.currentState;
            final engineMs = microphone.engineLatency?.inMilliseconds;
            final extraMs = microphone.monitorDelay.inMilliseconds;
            final totalMs = engineMs == null ? null : engineMs + extraMs;

            return SingleChildScrollView(
              padding: EdgeInsets.fromLTRB(
                spec.pageGutter,
                AppSpacing.sm,
                spec.pageGutter,
                AppSpacing.xxl,
              ),
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 680),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Row(
                      children: [
                        const Icon(Icons.mic_rounded, color: AppColors.accent),
                        const SizedBox(width: AppSpacing.sm),
                        Expanded(
                          child: Text(
                            '麦克风与演唱音量',
                            style: Theme.of(context).textTheme.titleLarge?.copyWith(
                                  fontWeight: FontWeight.w800,
                                ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: AppSpacing.xs),
                    Text(
                      '麦克风监听与歌曲播放使用独立音量。建议佩戴耳机或使用独立监听设备，扬声器直出可能产生啸叫。',
                      style: Theme.of(context).textTheme.bodyMedium?.copyWith(
                            color: AppColors.textSecondary,
                          ),
                    ),
                    const SizedBox(height: AppSpacing.md),
                    SwitchListTile.adaptive(
                      contentPadding: EdgeInsets.zero,
                      value: microphone.isMonitoring,
                      onChanged: microphone.isStarting
                          ? null
                          : (enabled) {
                              unawaited(
                                enabled
                                    ? microphoneService.startMonitoring()
                                    : microphoneService.stopMonitoring(),
                              );
                            },
                      secondary: microphone.isStarting
                          ? const SizedBox(
                              width: 22,
                              height: 22,
                              child: CircularProgressIndicator(strokeWidth: 2),
                            )
                          : Icon(
                              microphone.isMonitoring
                                  ? Icons.hearing_rounded
                                  : Icons.hearing_disabled_rounded,
                            ),
                      title: const Text('实时麦克风监听'),
                      subtitle: Text(
                        microphone.isMonitoring
                            ? '正在把麦克风输入低延迟送到当前输出设备'
                            : '开启后系统会请求麦克风权限',
                      ),
                    ),
                    if (microphone.error != null) ...[
                      const SizedBox(height: AppSpacing.sm),
                      _PlaybackError(message: microphone.error!),
                    ],
                    const SizedBox(height: AppSpacing.md),
                    Text(
                      '麦克风电平',
                      style: Theme.of(context).textTheme.labelLarge,
                    ),
                    const SizedBox(height: AppSpacing.xs),
                    LinearProgressIndicator(
                      value: microphone.inputLevel.clamp(0.0, 1.0).toDouble(),
                      minHeight: 7,
                    ),
                    const SizedBox(height: AppSpacing.lg),
                    _KtvControlLabel(
                      title: '麦克风音量',
                      value: '${(microphone.micGain * 100).round()}%',
                    ),
                    Slider(
                      value: microphone.micGain.clamp(0.0, 2.0).toDouble(),
                      min: 0,
                      max: 2,
                      divisions: 20,
                      onChanged: (value) =>
                          unawaited(microphoneService.setMicGain(value)),
                    ),
                    const SizedBox(height: AppSpacing.sm),
                    _KtvControlLabel(
                      title: '歌曲音量',
                      value: '${(playback.volume * 100).round()}%',
                    ),
                    Slider(
                      value: playback.volume.clamp(0.0, 1.0).toDouble(),
                      min: 0,
                      max: 1,
                      divisions: 20,
                      onChanged: (value) =>
                          unawaited(audioService.setVolume(value)),
                    ),
                    const SizedBox(height: AppSpacing.sm),
                    _KtvControlLabel(
                      title: '监听附加延迟',
                      value: '${extraMs}ms',
                    ),
                    Slider(
                      value: extraMs.clamp(0, 250).toDouble(),
                      min: 0,
                      max: 250,
                      divisions: 25,
                      onChanged: (value) => unawaited(
                        microphoneService.setMonitorDelay(
                          Duration(milliseconds: value.round()),
                        ),
                      ),
                    ),
                    Text(
                      totalMs == null
                          ? '设备未报告稳定的硬件延迟；这里的数值只增加软件监听延迟。'
                          : '音频引擎约 ${engineMs}ms + 附加 ${extraMs}ms = 约 ${totalMs}ms。',
                      style: Theme.of(context).textTheme.bodySmall?.copyWith(
                            color: AppColors.textTertiary,
                          ),
                    ),
                  ],
                ),
              ),
            );
          },
        );
      },
    );
  }
}

class _KtvControlLabel extends StatelessWidget {
  final String title;
  final String value;

  const _KtvControlLabel({required this.title, required this.value});

  @override
  Widget build(BuildContext context) {
    return Row(
      children: [
        Expanded(
          child: Text(title, style: Theme.of(context).textTheme.labelLarge),
        ),
        Text(
          value,
          style: Theme.of(context).textTheme.labelMedium?.copyWith(
                color: AppColors.textSecondary,
              ),
        ),
      ],
    );
  }
}

'''
          anchor = 'class _CompactSourceMenu extends StatelessWidget {'
          if anchor not in text:
              raise SystemExit('Compact source menu anchor not found')
          text = text.replace(anchor, sheet + anchor, 1)
          player.write_text(text)
          PY

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test microphone signal slice
        run: flutter test test/features/player/ktv_microphone_signal_test.dart

      - name: Commit validated wiring and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-ktv-microphone-slice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock android ios macos lib test .github/workflows/apply-ktv-microphone-slice.yml
          git commit -m "Add low-latency KTV microphone monitoring"
          git push origin HEAD:feat/ktv-microphone-monitoring

  windows-build:
    needs: patch-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows debug bundle
        run: flutter build windows --debug

  macos-build:
    needs: patch-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS debug app
        run: flutter build macos --debug

name: Apply KTV microphone slice

on:
  push:
    branches:
      - feat/ktv-microphone-monitoring
    paths:
      - .github/workflows/apply-ktv-microphone-slice.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
          fetch-depth: 0
      - name: Apply product wiring
        run: python3 tool/apply_ktv_microphone_slice_v2.py
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test microphone signal slice
        run: flutter test test/features/player/ktv_microphone_signal_test.dart
      - name: Test full Flutter suite
        run: flutter test
      - name: Commit validated wiring
        shell: bash
        run: |
          git rm .github/workflows/apply-ktv-microphone-slice.yml tool/apply_ktv_microphone_slice.py tool/apply_ktv_microphone_slice_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add low-latency KTV microphone monitoring"
          git push origin HEAD:feat/ktv-microphone-monitoring

  windows-build:
    needs: patch-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows debug bundle
        run: flutter build windows --debug

  macos-build:
    needs: patch-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ktv-microphone-monitoring
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS debug app
        run: flutter build macos --debug

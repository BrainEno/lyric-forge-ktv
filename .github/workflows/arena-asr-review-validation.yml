name: Arena ASR review validation
on:
  push:
    branches: [arena/6eff023d-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed files
        run: dart format lib/features/transcription/data/services/local_project_transcription_workflow.dart test/features/transcription/local_project_transcription_cancellation_test.dart
      - name: Focused session tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/transcription/local_project_transcription_cancellation_test.dart test/high_quality_transcription_service_test.dart test/features/lyrics/domain/proofreading/asr_consensus_analyzer_test.dart test/features/lyrics/domain/proofreading/asr_first_pipeline_test.dart test/features/lyrics/domain/services/lyric_alignment_service_test.dart test/features/project/file_project_accompaniment_importer_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          (dart tool/work_log.dart check && bash scripts/quality_gate.sh --skip-pub-get --analyze-only && flutter test --no-pub --reporter expanded --concurrency 2) 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp='2026-11-07 18:09'
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug protect-transcription-edits --title 'Protect project edits during transcription'
          ENTRY_STAMP="$stamp" python3 - <<'PYCODE'
          import os,re,subprocess
          from pathlib import Path
          stamp=os.environ['ENTRY_STAMP'];run=os.environ['GITHUB_RUN_ID']
          path=Path('docs/log/entries')/(stamp.replace(' ','-').replace(':','')+'-protect-transcription-edits.md')
          text=path.read_text();text=re.sub(r'^- Validation:\n(?:  - .*\n)+','- Validation: placeholder\n',text,flags=re.M)
          values={
            'Scope':'Review ASR and proofreading quality and prevent transcription from silently overwriting newer project edits.',
            'Files':'Project transcription workflow, workflow concurrency tests, ASR/proofreading review, this entry, generated work-log navigation, index and handoff.',
            'Validation':f'Pinned Flutter GitHub Actions run {run} passed Dart format, targeted transcription/proofreading tests, full analysis and the complete test suite with concurrency 2, and work-log new/write/check. Standard full gate runs 42617545684 and 42618062300 failed the Media Hub upload deadline test with TLS SocketException Broken pipe; the lower-concurrency run did not skip tests. Local git diff --check passed. Local Flutter/Dart unavailable; final PR checks reported separately.',
            'Notes':'Start and result writes compare revisions; a conflicting result is rejected and reported. Conditional best-effort cleanup is limited to the run owner. Tests use fake ASR and repositories; no real-song accuracy or device validation. A whole-project revision conflict can reject a draft even for unrelated edits. Other writers, cross-process changes, stale status after cleanup failures, and empty-text false ASR agreement remain risks. See review for evidence and corpus plan.',
            'Commit':'`fix: protect edits during project transcription`',
          }
          for key,value in values.items():
            text,n=re.subn(rf'^- {key}:.*$',f'- {key}: {value}',text,count=1,flags=re.M)
            if n!=1: raise RuntimeError(key)
          if 'TODO' in text: raise RuntimeError('unfilled TODO')
          path.write_text(text)
          idx=Path('docs/work_log_index.md');text=idx.read_text();anchor='- **ASR transcript benchmarking:**';pos=text.index(anchor);text=text[:pos]+"- **ASR and proofreading review (2026-11-07):** [review](reviews/2026-11-07-asr-and-proofreading-review.md) records the transcription overwrite fix, an empty-text false-agreement defect, boundary risks and the need for a reviewed real-song corpus. No accuracy gain is claimed.\n"+text[pos:];idx.write_text(text)
          def cmd(*args): return subprocess.check_output(args,text=True).strip() or '(clean)'
          handoff=[
            '# Handoff', '', '## 目标', '', '审查歌词识别与校对质量，防止识别期间覆盖新的工程歌词。', '',
            '## Git 现场', '', '- 基线 `6bc66cba0dc6a0ec95bc82cff799b255283ad605`；分支 `arena/6eff023d-lyric-forge-ktv`。验证时快照：', '', '```', cmd('git','status','--short'), cmd('git','diff','--stat'), cmd('git','log','--oneline','-5'), '```', '',
            '## 已改文件', '', '- 转写工作流、并发测试、ASR/校对审查报告、工作日志与导航。', '',
            '## 检查结果', '', f'- 固定 SDK Actions run {run} 通过定向测试、完整分析、并发度 2 的全部测试及工作日志检查；本地无 Flutter/Dart。', '- 标准并发完整门禁 run 42617545684 和 42618062300 均在 Media Hub 上传 deadline 测试的 TLS 连接处报 Broken pipe。没有真实歌曲语料或人工标注基准，未进行真实识别、设备播放或手动 UI 检查。', '',
            '## 下一步', '', '- 修复 ASR 校对中空归一化文本被判为双引擎一致的问题；随后用授权歌曲和人工参考建立可复现基线。', '',
            '## 已知风险', '', '- 工程 revision 冲突保守拒绝结果（即使是无关字段）；清理失败可留下运行状态标记；跨进程和其他无条件写入不受保护。', '- ASR 模型、输入人声质量及校对/时间对齐尚无真实歌曲误差数据；不得宣称准确率得到验证。', '',
            f'最后更新：{stamp}（Asia/Taipei）', ''
          ]
          Path('docs/handoff.md').write_text(chr(10).join(handoff))
          PYCODE
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-protect-transcription-edits.md"
          git diff --binary -- docs lib/features/transcription/data/services/local_project_transcription_workflow.dart test/features/transcription/local_project_transcription_cancellation_test.dart > /tmp/arena.patch
          python3 - <<'PY'
          import base64,gzip
          data=base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure diagnostic
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip
          from pathlib import Path
          p=Path('/tmp/gate.log')
          if not p.exists(): p=Path('/tmp/focused.log')
          if p.exists():
            lines=p.read_text(errors='replace').splitlines(); hits=[i for i,line in enumerate(lines) if '[E]' in line or 'error -' in line]; selected='\n'.join('\n'.join(lines[max(0,i-2):i+22]) for i in hits); selected += '\n=== LOG TAIL ===\n' + '\n'.join(lines[-30:]); data=base64.b64encode(gzip.compress(selected.encode())).decode()
            for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

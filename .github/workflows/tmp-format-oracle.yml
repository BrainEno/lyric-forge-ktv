name: TEMP diagnostics oracle (delete after use)
# PR265: analyze changed files + base64 format patches per file

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-format-oracle.yml'
      - 'test/architecture_layer_imports_contract_test.dart'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Analyze changed Dart files
        run: flutter analyze --no-pub lib/features/transcription/domain/services/asr_managed_storage_service.dart lib/features/transcription/data/services/local_asr_managed_storage_service.dart lib/features/settings/presentation/widgets/ai_transcription_settings_section.dart lib/features/transcription/presentation/widgets/asr_runtime_setup_dialog.dart lib/core/services/service_locator.dart test/architecture_layer_imports_contract_test.dart
      - name: Format diff (b64) for domain-contract
        run: |
          set +e
          f=lib/features/transcription/domain/services/asr_managed_storage_service.dart
          dart format --output=show "$f" 2>/dev/null | sed '/^Formatted [0-9]/d' > /tmp/fmt.dart
          diff -u "$f" /tmp/fmt.dart > /tmp/d.patch
          if [ ! -s /tmp/d.patch ]; then
            echo "::warning file=$f::FORMAT-CLEAN"
          else
            base64 -w0 /tmp/d.patch > /tmp/d.b64
            i=0; total=$(( ( $(wc -c < /tmp/d.b64) + 2999 ) / 3000 ))
            while read -r chunk || [ -n "$chunk" ]; do
              i=$((i+1))
              echo "::error file=$f::FORMAT-PATCH-B64 $i/$total $chunk"
            done < <(fold -w 3000 /tmp/d.b64)
          fi
          true
      - name: Format diff (b64) for data-service
        run: |
          set +e
          f=lib/features/transcription/data/services/local_asr_managed_storage_service.dart
          dart format --output=show "$f" 2>/dev/null | sed '/^Formatted [0-9]/d' > /tmp/fmt.dart

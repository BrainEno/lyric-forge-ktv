name: TEMP diagnostics oracle (delete after use)
# PR267: analyze changed files + base64 format patches per file

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-format-oracle.yml'
      - 'test/architecture_layer_imports_contract_test.dart'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Analyze changed Dart files
        continue-on-error: true
        run: >-
          flutter analyze --no-pub
          lib/core/services/service_locator.dart
          lib/features/player/data/services/file_ktv_take_history_store.dart
          lib/features/player/domain/services/ktv_take_history_store.dart
          lib/features/player/presentation/screens/player_screen.dart
          test/architecture_layer_imports_contract_test.dart
          test/features/player/ktv_take_history_store_test.dart
          test/features/player/ktv_take_mix_path_test.dart
      - name: Format patch (b64) for service-locator
        if: always()
        run: |
          set +e
          f=lib/core/services/service_locator.dart
          dart format --output=show "$f" 2>/dev/null | sed '/^Formatted [0-9]/d' > /tmp/fmt.dart
          diff -u "$f" /tmp/fmt.dart > /tmp/d.patch
          if [ ! -s /tmp/d.patch ]; then
            echo "::warning file=$f::FORMAT-CLEAN"
          else
            base64 -w0 /tmp/d.patch > /tmp/d.b64
            i=0; total=$(( ( $(wc -c < /tmp/d.b64) + 2999 ) / 3000 ))
            while read -r chunk || [ -n "$chunk" ]; do
              i=$((i+1))
              if [ "$i" -le 9 ]; then level=error; elif [ "$i" -le 18 ]; then level=warning; else level=notice; fi
              echo "::$level file=$f::FORMAT-PATCH-B64 $i/$total $chunk"
            done < <(fold -w 3000 /tmp/d.b64)
          fi
          true
      - name: Format patch (b64) for file-store

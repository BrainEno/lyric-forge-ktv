            i=0; total=$(( ( $(wc -c < /tmp/d.b64) + 2999 ) / 3000 ))
            while read -r chunk || [ -n "$chunk" ]; do
              i=$((i+1))
              echo "::error file=$f::FORMAT-PATCH-B64 $i/$total $chunk"
            done < <(fold -w 3000 /tmp/d.b64)
          fi
          true
      - name: Format diff (b64) for setup-dialog
        run: |
          set +e

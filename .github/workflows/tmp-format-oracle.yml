          diff -u "$f" /tmp/fmt.dart > /tmp/d.patch
          if [ ! -s /tmp/d.patch ]; then
            echo "::warning file=$f::FORMAT-CLEAN"
          else
            base64 -w0 /tmp/d.patch > /tmp/d.b64
            i=0; total=$(( ( $(wc -c < /tmp/d.b64) + 2999 ) / 3000 ))
            while read -r chunk || [ -n "$chunk" ]; do
              i=$((i+1))
              echo "::error file=$f::FORMAT-PATCH-B64 $i/$total $chunk"
            done < <(fold -w 3000 /tmp/d.b64)
          fi
          true
      - name: Format diff (b64) for ratchet-test
        run: |
          set +e
          f=test/architecture_layer_imports_contract_test.dart
          dart format --output=show "$f" 2>/dev/null | sed '/^Formatted [0-9]/d' > /tmp/fmt.dart
          diff -u "$f" /tmp/fmt.dart > /tmp/d.patch
          if [ ! -s /tmp/d.patch ]; then

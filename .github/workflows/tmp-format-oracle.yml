name: TEMP diagnostics oracle (delete after use)
# round 2

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-format-oracle.yml'
      - 'test/core/persistence/atomic_json_file_test.dart'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Emit format diffs, analyze issues and test results as annotations
        run: |
          set +e
          files=(
            lib/core/persistence/atomic_json_file.dart
            lib/features/player/data/repositories/file_local_media_collection_repository.dart
            lib/features/player/data/repositories/file_local_media_library_repository.dart
            lib/features/player/data/repositories/file_local_media_metadata_repository.dart
            lib/features/player/data/repositories/file_play_history_repository.dart
            lib/features/player/data/repositories/file_playback_session_store.dart
            lib/features/project/data/repositories/file_project_repository.dart
            lib/features/transcription/data/services/file_batch_transcription_queue.dart
            lib/features/transfer/data/services/file_media_hub_connection_store.dart
            lib/features/transfer/data/services/file_media_hub_device_identity_store.dart
            lib/features/transfer/data/services/file_media_transfer_queue_service.dart
            test/core/persistence/atomic_json_file_test.dart
            test/features/player/playback_session_persistence_test.dart
          )
          emit() {
            local data; data=$(cat)
            MSG="$data" python3 -c 'import os,sys; d=os.environ["MSG"]; print("::error file="+sys.argv[1]+"::"+d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$1"
          }
          for f in "${files[@]}"; do
            out=$(dart format --output=show "$f" | sed '/^Formatted [0-9]/d' | diff -u "$f" - | tail -n +3 | head -80; true)
            if [ -n "$out" ]; then
              printf 'FORMAT-DIFF-BEGIN\n%s\nFORMAT-DIFF-END' "$out" | emit "$f"
            else
              echo "::notice file=$f::FORMAT-CLEAN"
            fi
          done
          flutter analyze "${files[@]}" > /tmp/analyze.txt 2>&1
          echo "analyze exit: $?"
          grep -E '•' /tmp/analyze.txt | head -40 | while IFS= read -r line; do printf '%s' "$line" | emit lib/core/persistence/atomic_json_file.dart; done
          tail -3 /tmp/analyze.txt | emit lib/core/persistence/atomic_json_file.dart
          flutter test test/core/persistence/atomic_json_file_test.dart test/features/player/playback_session_persistence_test.dart > /tmp/test.txt 2>&1
          echo "test exit: $?"
          { grep -E '\[E\]|failed|Some tests failed|All tests passed' /tmp/test.txt | head -30; tail -5 /tmp/test.txt; } | emit test/core/persistence/atomic_json_file_test.dart
          true

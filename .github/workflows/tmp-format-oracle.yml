name: TEMP diagnostics oracle (delete after use)

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-format-oracle.yml'
      - 'test/architecture_layer_imports_contract_test.dart'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Emit format diff, analyze and test output as annotations
        run: |
          set +e
          f=test/architecture_layer_imports_contract_test.dart
          emit() {
            local data; data=$(cat)
            MSG="$data" python3 -c 'import os,sys; d=os.environ["MSG"]; print("::error file="+sys.argv[1]+"::"+d.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$1"
          }
          out=$(dart format --output=show "$f" | sed '/^Formatted [0-9]/d' | diff -u "$f" - | tail -n +3 | head -100; true)
          if [ -n "$out" ]; then
            printf 'FORMAT-DIFF-BEGIN\n%s\nFORMAT-DIFF-END' "$out" | emit "$f"
          else
            echo "::notice file=$f::FORMAT-CLEAN"
          fi
          flutter analyze "$f" > /tmp/analyze.txt 2>&1
          tail -8 /tmp/analyze.txt | emit "$f"
          flutter test "$f" > /tmp/test.txt 2>&1
          { grep -E '\[E\]|failed|Some tests failed|All tests passed|tests passed' /tmp/test.txt | head -20; tail -4 /tmp/test.txt; } | emit "$f"
          true

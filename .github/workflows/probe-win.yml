name: Probe Windows extract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download runtime asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\probe\downloads | Out-Null
          gh release download asr-runtime-v3 --repo ${{ github.repository }} --pattern lyricforge-asr-runtime-windows-x64-cuda.zip --output C:\probe\downloads\asr-runtime.zip
          (Get-Item C:\probe\downloads\asr-runtime.zip).Length
          (Get-FileHash C:\probe\downloads\asr-runtime.zip -Algorithm SHA256).Hash
      - name: List entries (.NET)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead('C:\probe\downloads\asr-runtime.zip')
          "entries: $($zip.Entries.Count)"
          $zip.Entries | Select-Object -First 80 | ForEach-Object { "{0}`t{1}`t{2}" -f $_.FullName, $_.Length, $_.CompressedLength }
          $zip.Dispose()
      - name: Expand like the app (Windows PowerShell 5.1)
        shell: cmd
        run: |
          powershell -NoProfile -NonInteractive -Command "Expand-Archive -LiteralPath 'C:\probe\downloads\asr-runtime.zip' -DestinationPath 'C:\probe\bundle.staging' -Force"
          echo exit=%ERRORLEVEL%
          dir /s /b C:\probe\bundle.staging
      - name: tar
        shell: cmd
        run: |
          mkdir C:\probe\tar
          tar -xf C:\probe\downloads\asr-runtime.zip -C C:\probe\tar
          echo exit=%ERRORLEVEL%
          dir /s /b C:\probe\tar

name: zz probe
on:
  push:
    branches: ['arena/a36fbfb2-lyric-forge-ktv']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: format
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- '*.dart')
          dart format $files || true
          git diff -U0 > fmt.diff || true
          wc -l fmt.diff
      - name: analyze
        if: always()
        run: |
          flutter analyze --no-pub --no-fatal-infos lib test tool > analyze.txt 2>&1 || true
          grep -E 'error •|warning •' analyze.txt > problems.txt || true
          wc -l problems.txt
      - name: tests
        if: always()
        run: |
          flutter test --no-pub --reporter expanded > tests.txt 2>&1 || true
          grep -E '\[E\]|Expected:|Actual:|Which:|error:|Some tests failed|All tests passed|^\S+\.dart:[0-9]+' tests.txt | head -150 > testfail.txt || true
          tail -1 tests.txt >> testfail.txt
          grep -n -A14 -E 'EXCEPTION CAUGHT BY' tests.txt | grep -v -E '^[0-9]+-\s*$' | head -220 >> testfail.txt || true
          tail -3 tests.txt
      - name: emit
        if: always()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'; }
          if [ -s problems.txt ]; then echo "::warning title=problems::$(head -c 60000 problems.txt | enc)"; fi
          echo "::notice title=tests::$(head -c 60000 testfail.txt | enc)"
          if [ -s fmt.diff ]; then split -b 3000 fmt.diff fmtpart.; for f in fmtpart.*; do echo "::error title=fmt $f::$(cat $f | enc)"; done; fi

name: ASR install experience validation

on:
  pull_request:
    paths:
      - "lib/features/transcription/domain/services/asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/managed_asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart"
      - "lib/features/transcription/presentation/widgets/asr_install_progress_card.dart"
      - "lib/features/transcription/presentation/widgets/asr_runtime_setup_dialog.dart"
      - "lib/features/settings/presentation/widgets/ai_transcription_settings_section.dart"
      - "test/features/transcription/asr_install_experience_contract_test.dart"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/asr-install-experience-validation.yml"
  push:
    branches: [main]
    paths:
      - "lib/features/transcription/domain/services/asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/managed_asr_runtime_manager.dart"
      - "lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart"
      - "lib/features/transcription/presentation/widgets/asr_install_progress_card.dart"
      - "lib/features/transcription/presentation/widgets/asr_runtime_setup_dialog.dart"
      - "lib/features/settings/presentation/widgets/ai_transcription_settings_section.dart"
      - "test/features/transcription/asr_install_experience_contract_test.dart"
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - ".github/workflows/asr-install-experience-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asr-install-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml
      - name: Analyze install experience changes
        run: >-
          flutter analyze --no-fatal-infos
          lib/features/transcription/domain/services/asr_runtime_manager.dart
          lib/features/transcription/data/services/managed_asr_runtime_manager.dart
          lib/features/transcription/data/services/managed_model_asr_runtime_manager.dart
          lib/features/transcription/presentation/widgets/asr_install_progress_card.dart
          lib/features/transcription/presentation/widgets/asr_runtime_setup_dialog.dart
          lib/features/settings/presentation/widgets/ai_transcription_settings_section.dart
          test/features/transcription/asr_install_experience_contract_test.dart
      - name: Test install experience contract
        run: flutter test test/features/transcription/asr_install_experience_contract_test.dart

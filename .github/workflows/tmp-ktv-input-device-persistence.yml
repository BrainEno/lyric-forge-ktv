name: Temporary KTV input device persistence validation

on:
  push:
    branches:
      - feat/ktv-input-device-persistence
    paths:
      - .github/workflows/tmp-ktv-input-device-persistence.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ktv-input-device-persistence
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add microphone input preference persistence
        shell: bash
        run: |
          cat > lib/features/player/domain/services/ktv_microphone_preference_store.dart <<'EOF'
          abstract class KtvMicrophonePreferenceStore {
            Future<String?> loadPreferredInputDeviceId();

            Future<void> savePreferredInputDeviceId(String? deviceId);
          }
          EOF

          cat > lib/features/player/data/services/file_ktv_microphone_preference_store.dart <<'EOF'
          import 'dart:convert';
          import 'dart:io';

          import 'package:path_provider/path_provider.dart';

          import '../../domain/services/ktv_microphone_preference_store.dart';

          class FileKtvMicrophonePreferenceStore
              implements KtvMicrophonePreferenceStore {
            static const String _fileName = 'ktv_microphone_preferences.json';
            static const String _preferredInputDeviceKey = 'preferredInputDeviceId';

            final Directory? rootDirectory;

            const FileKtvMicrophonePreferenceStore({this.rootDirectory});

            Future<File> _file() async {
              final directory = rootDirectory ?? await getApplicationSupportDirectory();
              await directory.create(recursive: true);
              return File(directory.path + Platform.pathSeparator + _fileName);
            }

            @override
            Future<String?> loadPreferredInputDeviceId() async {
              try {
                final file = await _file();
                if (!await file.exists()) return null;
                final decoded = jsonDecode(await file.readAsString());
                if (decoded is! Map<String, dynamic>) return null;
                final value = decoded[_preferredInputDeviceKey];
                if (value is! String) return null;
                final normalized = value.trim();
                return normalized.isEmpty ? null : normalized;
              } catch (_) {
                return null;
              }
            }

            @override
            Future<void> savePreferredInputDeviceId(String? deviceId) async {
              final normalized = deviceId?.trim();
              final file = await _file();
              if (normalized == null || normalized.isEmpty) {
                if (await file.exists()) await file.delete();
                return;
              }

              await file.writeAsString(
                jsonEncode(<String, Object>{
                  'version': 1,
                  _preferredInputDeviceKey: normalized,
                }),
                flush: true,
              );
            }
          }
          EOF

          cat > test/features/player/ktv_microphone_preference_store_test.dart <<'EOF'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';
          import 'package:lyric_forge_ktv/features/player/data/services/file_ktv_microphone_preference_store.dart';

          void main() {
            late Directory root;
            late FileKtvMicrophonePreferenceStore store;

            setUp(() async {
              root = await Directory.systemTemp.createTemp('ktv-mic-pref-test-');
              store = FileKtvMicrophonePreferenceStore(rootDirectory: root);
            });

            tearDown(() async {
              if (await root.exists()) {
                await root.delete(recursive: true);
              }
            });

            test('persists and restores a normalized microphone device id', () async {
              await store.savePreferredInputDeviceId('  usb-mic-42  ');

              expect(await store.loadPreferredInputDeviceId(), 'usb-mic-42');
            });

            test('saving system default clears a previous device preference', () async {
              await store.savePreferredInputDeviceId('usb-mic');
              expect(await store.loadPreferredInputDeviceId(), 'usb-mic');

              await store.savePreferredInputDeviceId(null);

              expect(await store.loadPreferredInputDeviceId(), isNull);
            });

            test('blank device id is treated as system default', () async {
              await store.savePreferredInputDeviceId('usb-mic');
              await store.savePreferredInputDeviceId('   ');

              expect(await store.loadPreferredInputDeviceId(), isNull);
            });

            test('corrupted preference file degrades to system default', () async {
              await store.savePreferredInputDeviceId('usb-mic');
              final files = root.listSync().whereType<File>().toList();
              expect(files, hasLength(1));
              await files.single.writeAsString('{broken-json');

              expect(await store.loadPreferredInputDeviceId(), isNull);
            });
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          service = Path('lib/features/player/data/services/record_soloud_ktv_microphone_service.dart')
          text = service.read_text(encoding='utf-8')

          text = text.replace(
              "import '../../domain/services/ktv_microphone_service.dart';\n",
              "import '../../domain/services/ktv_microphone_preference_store.dart';\nimport '../../domain/services/ktv_microphone_service.dart';\n",
              1,
          )
          text = text.replace(
              "  final AudioRecorder _recorder;\n  final SoLoud _soloud;\n",
              "  final AudioRecorder _recorder;\n  final SoLoud _soloud;\n  final KtvMicrophonePreferenceStore? _preferenceStore;\n",
              1,
          )
          text = text.replace(
              "  bool _initializedSoloud = false;\n",
              "  bool _initializedSoloud = false;\n  Future<void>? _preferenceLoadFuture;\n",
              1,
          )
          text = text.replace(
              "  RecordSoloudKtvMicrophoneService({\n    AudioRecorder? recorder,\n    SoLoud? soloud,\n  })  : _recorder = recorder ?? AudioRecorder(),\n        _soloud = soloud ?? SoLoud.instance {\n",
              "  RecordSoloudKtvMicrophoneService({\n    AudioRecorder? recorder,\n    SoLoud? soloud,\n    KtvMicrophonePreferenceStore? preferenceStore,\n  })  : _recorder = recorder ?? AudioRecorder(),\n        _soloud = soloud ?? SoLoud.instance,\n        _preferenceStore = preferenceStore {\n",
              1,
          )
          text = text.replace(
              "    try {\n      final devices = await _recorder.listInputDevices();\n",
              "    try {\n      await _ensurePreferredInputDeviceLoaded();\n      final devices = await _recorder.listInputDevices();\n",
              1,
          )
          text = text.replace(
              "      final selectedStillAvailable = selectedId == null ||\n          _recordInputDevices.containsKey(selectedId);\n\n      _emit(\n",
              "      final selectedStillAvailable = selectedId == null ||\n          _recordInputDevices.containsKey(selectedId);\n      if (!selectedStillAvailable) {\n        await _persistPreferredInputDevice(null);\n      }\n\n      _emit(\n",
              1,
          )
          text = text.replace(
              "    if (_state.selectedInputDeviceId == nextId) return;\n",
              "    if (_state.selectedInputDeviceId == nextId) {\n      await _persistPreferredInputDevice(nextId);\n      return;\n    }\n",
              1,
          )
          text = text.replace(
              "    _emit(\n      _state.copyWith(\n        selectedInputDeviceId: nextId,\n        clearSelectedInputDevice: nextId == null,\n        clearError: true,\n      ),\n    );\n\n    if (restartMonitoring) {\n",
              "    _emit(\n      _state.copyWith(\n        selectedInputDeviceId: nextId,\n        clearSelectedInputDevice: nextId == null,\n        clearError: true,\n      ),\n    );\n    await _persistPreferredInputDevice(nextId);\n\n    if (restartMonitoring) {\n",
              1,
          )
          helper_anchor = "  Future<void> _stopSessionSilently() async {\n"
          helper = """  Future<void> _ensurePreferredInputDeviceLoaded() {\n    final existing = _preferenceLoadFuture;\n    if (existing != null) return existing;\n\n    final loading = _restorePreferredInputDevice();\n    _preferenceLoadFuture = loading;\n    return loading;\n  }\n\n  Future<void> _restorePreferredInputDevice() async {\n    final store = _preferenceStore;\n    if (store == null) return;\n\n    try {\n      final preferredId = (await store.loadPreferredInputDeviceId())?.trim();\n      if (preferredId == null || preferredId.isEmpty) return;\n      _emit(\n        _state.copyWith(\n          selectedInputDeviceId: preferredId,\n          clearError: true,\n        ),\n      );\n    } catch (_) {\n      // Preference persistence must never block microphone availability.\n    }\n  }\n\n  Future<void> _persistPreferredInputDevice(String? deviceId) async {\n    final store = _preferenceStore;\n    if (store == null) return;\n    try {\n      await store.savePreferredInputDeviceId(deviceId);\n    } catch (_) {\n      // A settings write failure should not interrupt monitoring or recording.\n    }\n  }\n\n"""
          if helper_anchor not in text:
              raise SystemExit('microphone service helper anchor not found')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)
          service.write_text(text, encoding='utf-8')

          locator = Path('lib/core/services/service_locator.dart')
          text = locator.read_text(encoding='utf-8')
          text = text.replace(
              "import '../../features/player/data/services/file_local_media_relink_service.dart';\n",
              "import '../../features/player/data/services/file_ktv_microphone_preference_store.dart';\nimport '../../features/player/data/services/file_local_media_relink_service.dart';\n",
              1,
          )
          text = text.replace(
              "    ktvMicrophoneService = RecordSoloudKtvMicrophoneService();\n",
              "    ktvMicrophoneService = RecordSoloudKtvMicrophoneService(\n      preferenceStore: const FileKtvMicrophonePreferenceStore(),\n    );\n",
              1,
          )
          locator.write_text(text, encoding='utf-8')
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore repository analyzer config
        run: git checkout -- analysis_options.yaml

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test microphone preference slice
        run: |
          flutter test test/features/player/ktv_microphone_preference_store_test.dart
          flutter test test/features/player/ktv_microphone_signal_test.dart

      - name: Test full Flutter suite
        run: flutter test

      - name: Commit validated slice and self-clean
        shell: bash
        run: |
          git checkout -- analysis_options.yaml 2>/dev/null || true
          cat >> docs/work_log.md <<'EOF'

          ### [2026-10-09 15:42] 持久化 KTV 麦克风输入设备选择

          - Scope: 将全屏 KTV 中选择的麦克风设备 ID 持久化到 Application Support JSON；应用下次启动时在设备枚举前恢复首选输入。若设备已拔出、ID 失效或配置文件损坏，则安全回退系统默认输入，并清除陈旧偏好。
          - Files: `lib/features/player/domain/services/ktv_microphone_preference_store.dart`, `lib/features/player/data/services/file_ktv_microphone_preference_store.dart`, `lib/features/player/data/services/record_soloud_ktv_microphone_service.dart`, `lib/core/services/service_locator.dart`, `test/features/player/ktv_microphone_preference_store_test.dart`, `docs/work_log.md`
          - Validation:
            - `flutter analyze --no-fatal-infos --no-fatal-warnings` => success
            - microphone preference + signal focused tests => success
            - `flutter test` => success
          - Notes: 只持久化输入设备选择，不自动恢复监听开关、麦克风增益或监听延迟；偏好文件读写失败不会阻断麦克风监听/录音。真实 Windows/macOS USB、蓝牙设备跨重启 ID 稳定性仍需物理设备 E2E 验证。
          - Commit: `Persist KTV microphone input choice`
          EOF

          git rm --ignore-unmatch .github/workflows/tmp-ktv-input-device-persistence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Persist KTV microphone input choice"
          git push origin HEAD:feat/ktv-input-device-persistence

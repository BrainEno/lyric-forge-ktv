name: Temporary audition formatter

on:
  push:
    branches:
      - fix/v2-lyric-audition-feedback-20261026

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - name: Format changed audition files and commit formatter output
        shell: bash
        run: |
          dart format lib/features/lyrics/presentation/screens/lyric_editor_screen.dart lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart
          if git diff --quiet; then
            echo "Formatter made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/lyrics/presentation/screens/lyric_editor_screen.dart lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart
          git commit -m "style: format V2 audition changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Temporary V2 orchestration validation
on:
  push:
    branches: [arena/9f2ab423-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/lyrics/domain/proofreading/run_proofread_v2_use_case.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/features/lyrics/domain/proofreading/forced_alignment_proofread_service_test.dart test/features/lyrics/domain/proofreading/proofread_v2_review_assembler_test.dart test/features/lyrics/domain/proofreading/proofread_v2_document_composer_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/presentation/widgets/proofread_v2_options_accessibility_test.dart test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/v2-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/v2-test.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/v2-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+15]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/v2-analyze.log || {
            grep -E 'error •|warning •|error -|warning -' /tmp/v2-analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:55' --slug extract-v2-proofread-use-case --title 'Extract V2 proofreading orchestration'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2055-extract-v2-proofread-use-case.md')
          s=p.read_text()
          replacements={
           'TODO — describe the task purpose.':'Extract V2 proofreading orchestration from the editor without changing existing strategy behavior (partial #323).',
           'TODO — list changed files.':'V2 domain use case, editor screen, use-case tests, UX undo guidance, handoff and work-log navigation.',
           'dart format ... => TODO':'dart format changed Dart files with pinned SDK => passed in Actions 43023659317.',
           'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 43023659317.',
           'flutter test ... => TODO':'flutter test --no-pub on V2 use case, pipelines, review widgets, editor and architecture contracts => passed in Actions 43023659317.',
           'TODO — record risks and unverified behavior.':'#323 remains open; other workflows and the screen size and UX audit remain. #319 reference-first forced alignment and automatic secondary transcript are not implemented. Real devices, audio, ASR and real-song quality were not tested.',
           'TODO: replace with the actual English imperative subject':'Extract V2 proofreading orchestration',
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2055-extract-v2-proofread-use-case.md
          git diff -- docs > /tmp/worklog.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/worklog.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=WORKLOG{i//3000}::{data[i:i+3000]}')
          PY

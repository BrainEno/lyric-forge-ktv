name: Temporary Phase 4.4 validation and work log

on:
  push:
    branches:
      - arena/746aa31e-lyric-forge-ktv

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t dart_files < <(git diff --name-only origin/main...HEAD -- '*.dart')
          if (( ${#dart_files[@]} )); then
            dart format "${dart_files[@]}"
          fi
      - name: Run complete quality gate
        shell: bash
        run: |
          mkdir -p build
          set +e
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee build/phase44-quality.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            tail -200 build/phase44-quality.log > docs/phase44-ci-failure.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/phase44-ci-failure.txt
            git commit -m 'chore: capture Phase 4.4 CI diagnostics'
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit "$status"
          fi
      - name: Generate and validate work log
        shell: bash
        run: |
          stamp="$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          dart tool/work_log.dart new --timestamp "$stamp" --slug editor-player-minimal-state --title "Add scoped state management for editor and player bars"
          python3 - "$stamp" <<'PY'
          from pathlib import Path
          import sys

          stamp = sys.argv[1]
          path = next(Path('docs/log/entries').glob(f"{stamp[:10].replace('-', '')}-{stamp[11:13]}{stamp[14:16]}-editor-player-minimal-state.md"), None)
          if path is None:
              matches = list(Path('docs/log/entries').glob('*-editor-player-minimal-state.md'))
              if not matches:
                  raise SystemExit('work-log entry was not created')
              path = max(matches, key=lambda item: item.name)
          path.write_text(f'''# [{stamp}] Add scoped state management for editor and player bars

- Scope: Introduce observable editor document state and a scoped provider for the existing playback-session stream. Preserve service ownership, editing semantics, and the local-only nature of transient UI state.
- Files: `pubspec.yaml`, `pubspec.lock`, `lib/features/lyrics/presentation/controllers/lyric_editor_document_controller.dart`, `lib/features/lyrics/presentation/screens/lyric_editor_screen.dart`, `lib/features/player/presentation/widgets/global_player_bar.dart`, `lib/features/player/presentation/widgets/mobile_global_player_bar.dart`, `lib/features/player/presentation/widgets/playback_mode_controls.dart`, `lib/features/player/presentation/widgets/playback_queue_panel.dart`, `lib/features/player/presentation/widgets/playback_session_state_scope.dart`, `test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart`, `test/features/player/presentation/widgets/playback_session_state_scope_test.dart`, `docs/reviews/2026-10-31-recognition-quality-and-ux-deep-review.md`, `docs/handoff.md`, and generated work-log navigation files.
- Validation:
  - `flutter pub get --enforce-lockfile` => passed.
  - `dart format` on changed Dart files => passed.
  - `bash scripts/quality_gate.sh --skip-pub-get` => passed (changed-file format gate, analyzer, full test suite, and work-log preflight; workflow run ${{ github.run_id }}).
  - `dart tool/work_log.dart write` and `dart tool/work_log.dart check` => passed.
  - No real-song accuracy or physical-device playback result is claimed.
- Notes: The document controller now notifies after completed observable changes; project loading initializes it before the listening subtree builds. Desktop playback chrome forwards the existing session snapshot to its queue/mode controls, while mobile and desktop keep audio playback state on the existing audio stream. ASR algorithms and lyric-processing semantics are unchanged.
- Commit: `feat: add scoped state providers for editor and playback chrome`
''', encoding='utf-8')
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Remove temporary workflow and push completed changes
        run: |
          rm .github/workflows/temporary-phase44-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add scoped state providers for editor and playback chrome'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Arena association safety validation
on:
  push:
    branches: [arena/85794aa2-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/player/data/repositories/file_local_media_metadata_repository.dart lib/features/player/data/services/default_playback_session_service.dart test/local_media_metadata_playback_test.dart lib/features/player/domain/repositories/local_media_metadata_repository.dart lib/features/player/domain/services/playback_lyrics_project_linker.dart lib/features/player/domain/services/playback_lyrics_project_resolver.dart lib/features/player/presentation/widgets/local_song_lyrics_import_action.dart test/features/player/playback_lyrics_read_failure_test.dart test/file_local_media_metadata_repository_test.dart
      - name: Focused metadata and player tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/file_local_media_metadata_repository_test.dart test/local_media_metadata_playback_test.dart test/features/player/playback_lyrics_read_failure_test.dart test/features/player/playback_lyrics_project_resolver_test.dart test/features/player/playback_lyrics_project_linker_test.dart test/features/player/playback_lyrics_availability_test.dart 2>&1 | tee /tmp/focused.log
      - name: Full quality gate
        shell: bash
        run: |
          set -o pipefail
          bash scripts/quality_gate.sh --skip-pub-get 2>&1 | tee /tmp/gate.log
      - name: Create work log and handoff
        shell: bash
        run: |
          stamp=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')
          echo "ENTRY_STAMP=$stamp" >> "$GITHUB_ENV"
          dart tool/work_log.dart new --timestamp "$stamp" --slug protect-lyric-associations-from-partial-metadata --title 'Protect lyric associations from partial metadata'
          ENTRY_STAMP="$stamp" python3 - <<'PY'
          import os, re
          from pathlib import Path
          stamp = os.environ['ENTRY_STAMP']
          path = Path('docs/log/entries') / (stamp.replace(' ', '-').replace(':', '') + '-protect-lyric-associations-from-partial-metadata.md')
          s = path.read_text()
          s = re.sub(r'^- Validation:\n(?:  - .*\n)+', '- Validation: placeholder\n', s, flags=re.M)
          replacements = {
              'Scope': 'Prevent partial media metadata from being treated as an authoritative missing lyric association while retaining best-effort local playback display.',
              'Files': 'Metadata repository contract and file implementation, playback session, lyric resolver, linker and import action, metadata and player regression tests, index, handoff, this entry and generated work-log navigation.',
              'Validation': f"Local Flutter/Dart SDKs unavailable. Pinned GitHub Actions run {os.environ['GITHUB_RUN_ID']} passed focused metadata, playback, lyric resolution, linking and availability tests and the full repository quality gate; Dart format and work-log new/write/check ran there. Final PR checks reported separately. git diff --check ran locally.",
              'Notes': 'Incomplete and duplicate-path metadata remain readable for display, but authoritative association reads and writes fail; playback retains the existing lyric flag and explicit project IDs bypass metadata. Tests exercise real files, preserved queue and store, import error presentation, legacy and clean snapshots, and fake audio playback. Repair requires a new repository instance. Other repositories must implement the completeness capability if their reads can be partial; cross-process races and first-lyric unawaited link errors remain outside scope. No physical playback or manual UI checks performed.',
              'Commit': '`fix: guard lyric associations on partial metadata`',
          }
          for key, value in replacements.items():
              s, count = re.subn(rf'^- {key}:.*$', f'- {key}: {value}', s, count=1, flags=re.M)
              if count != 1: raise RuntimeError(f'missing {key}')
          if 'TODO' in s: raise RuntimeError('unfilled TODO')
          path.write_text(s)
          idx = Path('docs/work_log_index.md')
          text = idx.read_text()
          old = '- Playback lyric resolution fails closed on propagated read errors. Project stores reject partial or duplicate records; media metadata stores block partial writes but readable partial results can still mislead lyric resolution. Other stores may skip malformed records. Failed initial loads remain cached until restart, and link writes lack compare-and-swap protection.'
          new = '- Playback lyric resolution fails closed on propagated read errors and incomplete file-backed media metadata, while display reads remain best effort. Project stores reject partial or duplicate records; other stores may skip malformed records. Cached loads require restart after repair; link writes lack compare-and-swap protection, and first-lyric background linking can report unhandled errors.'
          if old not in text: raise RuntimeError('expected follow-up missing')
          idx.write_text(text.replace(old, new))
          Path('docs/handoff.md').write_text(f"""# Handoff\n\n## 目标\n\n处理 #223 的歌词关联风险：不将部分损坏的媒体元数据当作完整结果；提交中文 PR，不自动合并。\n\n## Git 现场\n\n- 基线 `888ce4617cbb88c494a40e77108a0f48775720b3`；分支 `arena/85794aa2-lyric-forge-ktv`。\n- 最终提交、PR 和检查状态以 Git/GitHub 为准。\n\n## 已改文件\n\n- 元数据仓库契约和实现、歌词关联解析/写入和导入入口、相关测试、工作日志及本 handoff。\n\n## 检查结果\n\n- 本地无 Flutter/Dart；固定 SDK GitHub Actions run {os.environ['GITHUB_RUN_ID']} 通过定向测试及完整质量门禁，并执行 format、work-log new/write/check。最终 head 的检查以 Actions 为准。\n- 本地提交前执行 `git diff --check`；未做真实设备或手动 UI 测试。\n\n## 下一步\n\n确认 PR 最终质量门禁并报告；#223 其余测试覆盖缺口继续保留。\n\n## 已知风险\n\n- 初次加载失败需重建实例；跨进程修改、其他存储实现的部分读取以及工程首次保存歌词时后台关联的未处理错误不在本次范围。\n- 可部分读取的仓库实现必须提供完整性能力，关联读取才会拒绝不完整数据。\n\n最后更新：{stamp}（Asia/Taipei）\n""")
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Publish patch
        shell: bash
        run: |
          stamp="${ENTRY_STAMP// /-}"
          stamp="${stamp//:/}"
          git add -N "docs/log/entries/$stamp-protect-lyric-associations-from-partial-metadata.md"
          git diff --binary -- lib/features/player/data/repositories/file_local_media_metadata_repository.dart lib/features/player/data/services/default_playback_session_service.dart test/local_media_metadata_playback_test.dart lib/features/player/domain/repositories/local_media_metadata_repository.dart lib/features/player/domain/services/playback_lyrics_project_linker.dart lib/features/player/domain/services/playback_lyrics_project_resolver.dart lib/features/player/presentation/widgets/local_song_lyrics_import_action.dart test/features/player/playback_lyrics_read_failure_test.dart test/file_local_media_metadata_repository_test.dart docs > /tmp/arena.patch
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64encode(gzip.compress(open('/tmp/arena.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=arena-patch-{i//3000:03}::{data[i:i+3000]}')
          PY
      - name: Export failure log
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          p = Path('/tmp/gate.log')
          if not p.exists(): p = Path('/tmp/focused.log')
          if p.exists():
              data = base64.b64encode(gzip.compress(p.read_bytes()[-350000:])).decode()
              for i in range(0,len(data),3000): print(f'::notice title=arena-log-{i//3000:03}::{data[i:i+3000]}')
          PY

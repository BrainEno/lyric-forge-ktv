name: Fix execution failure lint

on:
  push:
    branches:
      - feat/transcription-execution-failure-kinds
    paths:
      - ".github/workflows/fix-execution-failure-lint.yml"
      - "tools/fix_execution_failure_lint.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transcription-execution-failure-kinds
      - run: python tools/fix_execution_failure_lint.py
      - run: |
          rm tools/fix_execution_failure_lint.py
          rm .github/workflows/fix-execution-failure-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant manifest null assertion"
          git push

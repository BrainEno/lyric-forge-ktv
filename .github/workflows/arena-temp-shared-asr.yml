name: Arena temporary ASR segmentation validation
on:
  push:
    branches: [arena/fe82655d-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and expose patch
        run: |
          dart format lib/features/transcription/data/services/high_quality_transcription_service.dart lib/features/lyrics/presentation/widgets/lyric_inspector_pane.dart test/high_quality_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart
          git diff --binary | gzip -c | base64 -w 0 > /tmp/format.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/format.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=FORMAT{i//3000:03d}::{s[i:i+3000]}')
          PY
      - name: Targeted tests
        run: |
          if ! flutter test --no-pub --reporter expanded test/high_quality_transcription_service_test.dart test/resumable_chunked_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart > /tmp/tests.log 2>&1; then
            python3 - <<'PY'
          import pathlib,base64,gzip
          s=base64.b64encode(gzip.compress(pathlib.Path('/tmp/tests.log').read_bytes())).decode()
          for i in range(0,len(s),3000): print(f'::notice title=TESTLOG{i//3000:03d}::{s[i:i+3000]}')
          PY
            exit 1
          fi
          tail -n 3 /tmp/tests.log
      - run: flutter analyze --no-pub --no-fatal-infos lib test tool

name: Arena temporary ASR segmentation validation
on:
  push:
    branches: [arena/fe82655d-lyric-forge-ktv]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/features/transcription/data/services/high_quality_transcription_service.dart lib/features/lyrics/presentation/widgets/lyric_inspector_pane.dart test/high_quality_transcription_service_test.dart test/features/lyrics/presentation/widgets/lyric_inspector_pane_test.dart
      - name: Generate and check work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:49' --slug protect-shared-asr-segments --title 'Protect shared secondary ASR segments'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2049-protect-shared-asr-segments.md')
          s=p.read_text()
          for a,b in {
            'TODO — describe the task purpose.':'Prevent automatic reuse of one secondary ASR segment across multiple primary lyric lines and require manual review of ambiguous segmentation.',
            'TODO — list changed files.':'High-quality transcription fusion and tests, lyric inspector and widget tests, handoff, index, entry and generated work-log navigation.',
            'dart format ... => TODO':'dart format on changed Dart files => passed on pinned SDK.',
            'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 42943660214.',
            'flutter test ... => TODO':'flutter test --no-pub for high-quality ASR, resumable chunks and lyric inspector => passed in Actions 42943660214.',
            'TODO — record risks and unverified behavior.':'Matches are heuristic; old saved candidates have no new shared-segment flag. No real-song or device validation or measured accuracy improvement. Installation ownership is not wired into production.',
            'TODO: replace with the actual English imperative subject':'Protect shared secondary ASR segments',
          }.items():
              assert a in s, a
              s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
      - name: Expose generated patch
        run: |
          git add -N docs/log/entries/2026-11-07-2049-protect-shared-asr-segments.md
          git diff --binary -- docs | gzip -c | base64 -w 0 > /tmp/patch.b64
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('/tmp/patch.b64').read_text()
          for i in range(0,len(s),3000): print(f'::notice title=PATCH{i//3000:03d}::{s[i:i+3000]}')
          PY

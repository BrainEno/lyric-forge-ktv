name: Temporary proofreading validation
on:
  push:
    branches: [arena/98b2215d-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart test/features/lyrics/presentation/widgets/proofread_v2_options_accessibility_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/presentation/widgets/proofread_v2_options_accessibility_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/controllers/lyric_editor_document_controller_test.dart test/features/lyrics/domain/services/lyric_review_priority_service_test.dart test/features/transcription/typed_cancellation_contract_test.dart 2>&1 | tee /tmp/proofread-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/proofread-test.log ]; then
            python3 - <<'PY'
          import re
          lines=open('/tmp/proofread-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+12]:
                print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - name: Generate work log
        if: success()
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 23:05' --slug accessible-proofread-options --title 'Make proofreading options accessible'
          python3 - <<'PY'
          p='docs/log/entries/2026-11-07-2305-accessible-proofread-options.md'
          s=open(p).read()
          s=s.replace('- Scope: TODO', '- Scope: Make V2 proofreading options scrollable and keyboard-accessible in small windows and at large text sizes; protect asynchronous proofreading with cross-row conflict regressions.')
          s=s.replace('- Files: TODO', '- Files: V2 options dialog, accessibility widget tests, editor conflict widget tests, generated work-log navigation, handoff and this entry.')
          s=s.replace('- Validation: TODO', '- Validation: Pinned Flutter GitHub Actions run 42996726179 passed locked dependency resolution, dart format, targeted dialog/editor/controller/priority/cancellation tests and flutter analyze --no-pub --no-fatal-infos lib test tool. Work-log write/check run separately; inspect final PR checks. Local Flutter/Dart unavailable.')
          s=s.replace('- Notes: TODO', '- Notes: No real screen reader or device testing; #416 remains open. The timeline-conflict-confirmation edit race remains without a dedicated dynamic test. Real song quality evidence remains out of scope.')
          s=s.replace('- Commit: TODO', '- Commit: `Make proofreading options accessible in small windows`')
          open(p,'w').write(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2305-accessible-proofread-options.md
          git diff -- docs/log/entries/2026-11-07-2305-accessible-proofread-options.md docs/work_log.md docs/work_log_index.md docs/work_log_archive.md > /tmp/log.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/log.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=LOG{i//3000}::{data[i:i+3000]}')
          PY

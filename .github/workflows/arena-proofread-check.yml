name: Arena proofread check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and publish patch
        run: |
          dart format lib/app/lyric_editor_assembly.dart lib/features/lyrics/domain/proofreading/project_proofread_evidence.dart lib/features/lyrics/presentation/lyric_editor_dependencies.dart lib/features/lyrics/presentation/lyric_review_strings.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart lib/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog.dart lib/features/transcription/data/services/project_proofread_evidence_loader.dart test/features/transcription/project_proofread_evidence_loader_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          git diff > /tmp/format.patch
          gzip -c /tmp/format.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=FORMAT" NR "::" $0}'
      - run: flutter analyze --no-pub --no-fatal-infos lib test tool
      - run: flutter test --no-pub test/features/transcription/project_proofread_evidence_loader_test.dart test/features/lyrics/presentation/widgets/proofread_v2_project_evidence_test.dart test/features/lyrics/presentation/widgets/proofread_v2_auto_evidence_test.dart test/features/lyrics/presentation/widgets/proofread_v2_options_accessibility_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/architecture_layer_imports_contract_test.dart test/architecture/feature_dependency_graph_test.dart
      - name: Generate work log
        run: |
          dart tool/work_log.dart new --timestamp "2026-11-07 23:59" --slug reuse-verified-asr-proofread-evidence --title "Reuse verified ASR evidence for proofreading"
          python3 -c "from pathlib import Path; p=Path('docs/log/entries/2026-11-07-2359-reuse-verified-asr-proofread-evidence.md'); s=p.read_text(); s=s.replace('TODO — describe the task purpose.', 'Allow explicit reuse of an independent project ASR transcript for V2 review after conservative baseline and audio checks.').replace('TODO — list changed files.', 'Evidence loader and domain contract, editor assembly and V2 UI, loader and widget tests, work log, index and handoff.').replace('dart format ... => TODO', 'dart format changed Dart files => passed in Actions 43148246398.').replace('flutter analyze ... => TODO', 'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 43148246398.').replace('flutter test ... => TODO', 'Targeted loader, editor, dialog and architecture tests => passed in Actions 43148246398.').replace('TODO — record risks and unverified behavior.', 'Only matching primary drafts with verified single-input audio qualify; checks are not locks or proof of model accuracy. No real audio, device or screen-reader testing. Reference-first ForcedAligner and fused/chunked reuse remain open.').replace('TODO: replace with the actual English imperative subject', 'Reuse verified independent ASR evidence for proofreading'); p.write_text(s)"
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2359-reuse-verified-asr-proofread-evidence.md
          git diff -- docs > /tmp/worklog.patch
          gzip -c /tmp/worklog.patch | base64 -w0 | fold -w 4000 | awk '{print "::notice title=WORKLOG" NR "::" $0}'

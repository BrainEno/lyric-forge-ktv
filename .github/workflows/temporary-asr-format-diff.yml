name: Temporary ASR formatter diff

on:
  push:
    branches:
      - feat/asr-quality-metrics-and-recall-20261027
    paths:
      - 'lib/features/transcription/data/services/high_quality_transcription_service.dart'
      - 'test/high_quality_transcription_service_test.dart'
      - '.github/workflows/temporary-asr-format-diff.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Print formatter diffs without changing the branch
        run: |
          dart format lib/features/transcription/data/services/high_quality_transcription_service.dart test/high_quality_transcription_service_test.dart
          git diff -- lib/features/transcription/data/services/high_quality_transcription_service.dart test/high_quality_transcription_service_test.dart

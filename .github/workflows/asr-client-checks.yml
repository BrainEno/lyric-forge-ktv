name: ASR client checks

on:
  pull_request:
    paths:
      - 'lib/features/transcription/**'
      - 'lib/core/services/service_locator.dart'
      - 'test/features/transcription/**'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/asr-client-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/features/transcription/**'
      - 'lib/core/services/service_locator.dart'
      - 'test/features/transcription/**'
      - '.fvmrc'
      - '.github/actions/setup-flutter/action.yml'
      - '.github/workflows/asr-client-checks.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-asr-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile && git diff --exit-code -- pubspec.lock analysis_options.yaml

      - name: Analyze ASR client changes
        run: >-
          flutter analyze
          lib/core/services/service_locator.dart
          lib/features/transcription/data/services/resilient_asr_runtime_manager.dart
          test/features/transcription/resilient_asr_runtime_manager_test.dart

      - name: Test resilient ASR runtime manager
        run: flutter test test/features/transcription/resilient_asr_runtime_manager_test.dart

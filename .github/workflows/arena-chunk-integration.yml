name: Arena chunk integration validation
on:
  push:
    branches: [arena/67430e4a-lyric-forge-ktv]
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format and report patch
        run: |
          dart format \
            test/features/transcription/chunk_project_workflow_integration_test.dart \
            test/features/lyrics/presentation/screens/chunk_project_editor_review_integration_test.dart
          git diff --binary | gzip -c | base64 -w0 | fold -w 3000 | awk '{print "::notice title=FORMAT" NR "::" $0}'
      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos \
            test/features/transcription/chunk_project_workflow_integration_test.dart \
            test/features/lyrics/presentation/screens/chunk_project_editor_review_integration_test.dart \
            2>&1 | tee /tmp/analyze.log
      - name: Report analyze failure
        if: failure()
        shell: bash
        run: |
          if [[ -f /tmp/analyze.log ]]; then
            grep -nE "error •|warning •" /tmp/analyze.log | head -20 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            gzip -c /tmp/analyze.log | base64 -w0 | fold -w 3000 | awk '{print "::notice title=ANALYZE" NR "::" $0}'
          fi
      - name: Test new integration
        shell: bash
        run: |
          set -o pipefail
          timeout 45s flutter test -j 1 --timeout 10s --reporter expanded \
            test/features/transcription/chunk_project_workflow_integration_test.dart \
            test/features/lyrics/presentation/screens/chunk_project_editor_review_integration_test.dart \
            2>&1 | tee /tmp/new-test.log
      - name: Report new test log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/new-test.log ]]; then
            gzip -c /tmp/new-test.log | base64 -w0 | fold -w 3000 | awk '{print "::notice title=TESTLOG" NR "::" $0}'
          fi
      - name: Test chunk regressions
        shell: bash
        run: |
          flutter test \
            test/features/transcription/chunked_independent_asr_evidence_test.dart \
            test/features/transcription/chunk_asr_audio_verifier_test.dart \
            test/features/transcription/chunk_project_evidence_loader_test.dart \
            test/features/transcription/local_project_transcription_cancellation_test.dart \
            test/features/lyrics/presentation/widgets/project_chunk_asr_snapshot_dialog_test.dart \
            test/resumable_chunked_transcription_service_test.dart

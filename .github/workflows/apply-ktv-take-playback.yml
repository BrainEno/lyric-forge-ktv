name: Apply KTV take playback controls

on:
  push:
    branches: [feat/ktv-take-playback-controls]
    paths:
      - .github/workflows/apply-ktv-take-playback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch player take result sheet
        run: python3 .github/scripts/apply_ktv_take_playback.py
      - name: Commit patched player
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/player/presentation/screens/player_screen.dart
          git commit -m "Add complete KTV take playback controls"
          git push

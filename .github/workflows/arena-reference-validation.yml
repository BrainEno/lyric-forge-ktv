name: Temporary reference proofreading validation
on:
  push:
    branches: [arena/a127e907-lyric-forge-ktv]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-flutter
      - run: flutter pub get --enforce-lockfile
      - name: Format
        run: |
          dart format lib/features/lyrics/domain/proofreading/run_reference_proofread_use_case.dart lib/features/lyrics/presentation/screens/lyric_editor_screen.dart test/features/lyrics/domain/proofreading/run_reference_proofread_use_case_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart
          git diff > /tmp/format.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/format.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=FORMAT{i//3000}::{data[i:i+3000]}')
          PY
      - name: Tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test/features/lyrics/domain/proofreading/run_reference_proofread_use_case_test.dart test/features/lyrics/domain/proofreading/reference_proofread_review_builder_test.dart test/features/lyrics/domain/proofreading/reference_proofread_change_set_test.dart test/features/lyrics/domain/proofreading/run_proofread_v2_use_case_test.dart test/features/lyrics/presentation/screens/lyric_editor_save_conflict_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_v2_dialog_test.dart test/features/lyrics/presentation/widgets/lyric_proofread_menu_button_test.dart test/architecture test/architecture_layer_imports_contract_test.dart 2>&1 | tee /tmp/ref-test.log
      - name: Report failures
        if: failure()
        run: |
          if [ -f /tmp/ref-test.log ]; then
            python3 - <<'PY'
          lines=open('/tmp/ref-test.log').readlines()
          for i,line in enumerate(lines):
            if '[E]' in line or 'EXCEPTION CAUGHT' in line or 'Error:' in line or 'Expected:' in line:
              for item in lines[i:i+14]: print('::error::'+item.strip().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
          fi
      - name: Analyze
        if: always()
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos lib test tool 2>&1 | tee /tmp/ref-analyze.log || {
            grep -E 'error •|warning •|error -|warning -' /tmp/ref-analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Generate and validate work log
        run: |
          dart tool/work_log.dart new --timestamp '2026-11-07 20:56' --slug extract-reference-proofread-use-case --title 'Guard and extract reference proofreading workflows'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/log/entries/2026-11-07-2056-extract-reference-proofread-use-case.md')
          s=p.read_text()
          replacements={
           'TODO — describe the task purpose.':'Extract reference proofreading orchestration and discard stale reference alignment and proofreading proposals (partial #323).',
           'TODO — list changed files.':'Reference proofreading use case and tests, editor revision guards and widget tests, handoff and work-log navigation.',
           'dart format ... => TODO':'dart format changed Dart files with pinned SDK => passed in Actions 43035295663.',
           'flutter analyze ... => TODO':'flutter analyze --no-pub --no-fatal-infos lib test tool => passed in Actions 43035295663.',
           'flutter test ... => TODO':'flutter test --no-pub targeted reference and V2 use cases, editor widgets, review menu and architecture contracts => passed in Actions 43035295663.',
           'TODO — record risks and unverified behavior.':'#323 remains open, including reference alignment extraction, screen size and full UX audit. The in-memory revision guard is separate from persistent save conflicts; other asynchronous operations remain unaudited. No real device, native file picker, audio or song quality checks.',
           'TODO: replace with the actual English imperative subject':'Guard and extract reference proofreading workflows',
          }
          for a,b in replacements.items():
            assert a in s, a
            s=s.replace(a,b)
          p.write_text(s)
          PY
          dart tool/work_log.dart write
          dart tool/work_log.dart check
          git add -N docs/log/entries/2026-11-07-2056-extract-reference-proofread-use-case.md
          git diff -- docs > /tmp/worklog.patch
          python3 - <<'PY'
          import gzip,base64
          data=base64.b64encode(gzip.compress(open('/tmp/worklog.patch','rb').read())).decode()
          for i in range(0,len(data),3000): print(f'::notice title=WORKLOG{i//3000}::{data[i:i+3000]}')
          PY

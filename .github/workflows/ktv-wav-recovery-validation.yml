name: KTV WAV recovery validation
on:
  push:
    branches: [fix/ktv-wav-interrupted-recovery]
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/features/player/pcm16_wav_recovery_test.dart
      - run: flutter test
